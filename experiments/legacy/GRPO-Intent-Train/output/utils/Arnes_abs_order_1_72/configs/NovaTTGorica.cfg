!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NovaTTGorica
!
!
interface Fa0/1
 ip address 10.0.0.35 255.255.255.254
 description "To Ljubljana"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.47 255.255.255.254
 description "To Tolmin"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.48 255.255.255.254
 description "To Ajdovscina"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NovaTTGorica_from_Ajdovscina deny 10
!
route-map RMap_NovaTTGorica_from_Ljubljana deny 10
!
route-map RMap_NovaTTGorica_from_Tolmin deny 10
!
!
!
!
!
router bgp 190
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.49 remote-as 10
 neighbor 10.0.0.49 description "To Ajdovscina"
 neighbor 10.0.0.49 advertisement-interval 0
 neighbor 10.0.0.49 soft-reconfiguration inbound
 neighbor 10.0.0.49 send-community
 neighbor 10.0.0.49 route-map RMap_NovaTTGorica_from_Ajdovscina in
 neighbor 10.0.0.49 route-map RMap_NovaTTGorica_to_Ajdovscina out
 neighbor 10.0.0.34 remote-as 150
 neighbor 10.0.0.34 description "To Ljubljana"
 neighbor 10.0.0.34 advertisement-interval 0
 neighbor 10.0.0.34 soft-reconfiguration inbound
 neighbor 10.0.0.34 send-community
 neighbor 10.0.0.34 route-map RMap_NovaTTGorica_from_Ljubljana in
 neighbor 10.0.0.34 route-map RMap_NovaTTGorica_to_Ljubljana out
 neighbor 10.0.0.46 remote-as 320
 neighbor 10.0.0.46 description "To Tolmin"
 neighbor 10.0.0.46 advertisement-interval 0
 neighbor 10.0.0.46 soft-reconfiguration inbound
 neighbor 10.0.0.46 send-community
 neighbor 10.0.0.46 route-map RMap_NovaTTGorica_from_Tolmin in
 neighbor 10.0.0.46 route-map RMap_NovaTTGorica_to_Tolmin out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
