!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname MurskaTTSobota
!
!
interface Fa0/1
 ip address 10.0.0.59 255.255.255.254
 description "To Radenci"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.80 255.255.255.254
 description "To Ljutomer"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_MurskaTTSobota_from_Ljutomer deny 10
!
route-map RMap_MurskaTTSobota_from_Radenci deny 10
!
!
!
!
router bgp 180
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.81 remote-as 160
 neighbor 10.0.0.81 description "To Ljutomer"
 neighbor 10.0.0.81 advertisement-interval 0
 neighbor 10.0.0.81 soft-reconfiguration inbound
 neighbor 10.0.0.81 send-community
 neighbor 10.0.0.81 route-map RMap_MurskaTTSobota_from_Ljutomer in
 neighbor 10.0.0.81 route-map RMap_MurskaTTSobota_to_Ljutomer out
 neighbor 10.0.0.58 remote-as 250
 neighbor 10.0.0.58 description "To Radenci"
 neighbor 10.0.0.58 advertisement-interval 0
 neighbor 10.0.0.58 soft-reconfiguration inbound
 neighbor 10.0.0.58 send-community
 neighbor 10.0.0.58 route-map RMap_MurskaTTSobota_from_Radenci in
 neighbor 10.0.0.58 route-map RMap_MurskaTTSobota_to_Radenci out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
