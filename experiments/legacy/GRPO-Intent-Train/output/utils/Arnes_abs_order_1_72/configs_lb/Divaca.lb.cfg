!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Divaca
!
!
interface Fa1/0
 ip address 10.0.0.51 255.255.255.254
 description "To Portoroz"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.65 255.255.255.254
 description "To Senozece"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.68 255.255.255.254
 description "To Ajdovscina"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.70 255.255.255.254
 description "To Koper"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Divaca_from_Ajdovscina deny 10
!
route-map RMap_Divaca_from_Koper deny 10
!
route-map RMap_Divaca_from_Portoroz deny 10
!
route-map RMap_Divaca_from_Senozece deny 10
!
!
!
!
!
!
router bgp 40
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.69 remote-as 10
 neighbor 10.0.0.69 description "To Ajdovscina"
 neighbor 10.0.0.69 advertisement-interval 0
 neighbor 10.0.0.69 soft-reconfiguration inbound
 neighbor 10.0.0.69 send-community
 neighbor 10.0.0.69 route-map RMap_Divaca_from_Ajdovscina in
 neighbor 10.0.0.69 route-map RMap_Divaca_to_Ajdovscina out
 neighbor 10.0.0.71 remote-as 100
 neighbor 10.0.0.71 description "To Koper"
 neighbor 10.0.0.71 advertisement-interval 0
 neighbor 10.0.0.71 soft-reconfiguration inbound
 neighbor 10.0.0.71 send-community
 neighbor 10.0.0.71 route-map RMap_Divaca_from_Koper in
 neighbor 10.0.0.71 route-map RMap_Divaca_to_Koper out
 neighbor 10.0.0.50 remote-as 220
 neighbor 10.0.0.50 description "To Portoroz"
 neighbor 10.0.0.50 advertisement-interval 0
 neighbor 10.0.0.50 soft-reconfiguration inbound
 neighbor 10.0.0.50 send-community
 neighbor 10.0.0.50 route-map RMap_Divaca_from_Portoroz in
 neighbor 10.0.0.50 route-map RMap_Divaca_to_Portoroz out
 neighbor 10.0.0.64 remote-as 280
 neighbor 10.0.0.64 description "To Senozece"
 neighbor 10.0.0.64 advertisement-interval 0
 neighbor 10.0.0.64 soft-reconfiguration inbound
 neighbor 10.0.0.64 send-community
 neighbor 10.0.0.64 route-map RMap_Divaca_from_Senozece in
 neighbor 10.0.0.64 route-map RMap_Divaca_to_Senozece out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! SLB Configuration for Divaca 
ip slb serverfarm SF_Senozece_Bled
 real 10.0.0.71
  weight 55
 real 10.0.0.69
  weight 45

ip slb virtual-server VSERVER_Senozece_Bled
 address 10.0.0.64 255.255.255.255
 serverfarm SF_Senozece_Bled
