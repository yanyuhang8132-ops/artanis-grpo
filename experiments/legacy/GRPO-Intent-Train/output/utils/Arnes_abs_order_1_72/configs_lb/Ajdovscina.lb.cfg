!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Ajdovscina
!
!
interface Fa0/1
 ip address 10.0.0.49 255.255.255.254
 description "To NovaTTGorica"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.69 255.255.255.254
 description "To Divaca"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Ajdovscina_from_Divaca deny 10
!
route-map RMap_Ajdovscina_from_NovaTTGorica deny 10
!
!
!
!
router bgp 10
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.68 remote-as 40
 neighbor 10.0.0.68 description "To Divaca"
 neighbor 10.0.0.68 advertisement-interval 0
 neighbor 10.0.0.68 soft-reconfiguration inbound
 neighbor 10.0.0.68 send-community
 neighbor 10.0.0.68 route-map RMap_Ajdovscina_from_Divaca in
 neighbor 10.0.0.68 route-map RMap_Ajdovscina_to_Divaca out
 neighbor 10.0.0.48 remote-as 190
 neighbor 10.0.0.48 description "To NovaTTGorica"
 neighbor 10.0.0.48 advertisement-interval 0
 neighbor 10.0.0.48 soft-reconfiguration inbound
 neighbor 10.0.0.48 send-community
 neighbor 10.0.0.48 route-map RMap_Ajdovscina_from_NovaTTGorica in
 neighbor 10.0.0.48 route-map RMap_Ajdovscina_to_NovaTTGorica out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
