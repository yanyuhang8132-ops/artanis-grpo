!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Ptuj
!
!
interface Fa1/0
 ip address 10.0.0.61 255.255.255.254
 description "To RogasjaTTSlatina"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.85 255.255.255.254
 description "To Ormoz"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.86 255.255.255.254
 description "To Maribor"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Ptuj_from_Maribor deny 10
!
route-map RMap_Ptuj_from_Ormoz deny 10
!
route-map RMap_Ptuj_from_RogasjaTTSlatina deny 10
!
!
!
!
!
router bgp 240
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.87 remote-as 170
 neighbor 10.0.0.87 description "To Maribor"
 neighbor 10.0.0.87 advertisement-interval 0
 neighbor 10.0.0.87 soft-reconfiguration inbound
 neighbor 10.0.0.87 send-community
 neighbor 10.0.0.87 route-map RMap_Ptuj_from_Maribor in
 neighbor 10.0.0.87 route-map RMap_Ptuj_to_Maribor out
 neighbor 10.0.0.84 remote-as 210
 neighbor 10.0.0.84 description "To Ormoz"
 neighbor 10.0.0.84 advertisement-interval 0
 neighbor 10.0.0.84 soft-reconfiguration inbound
 neighbor 10.0.0.84 send-community
 neighbor 10.0.0.84 route-map RMap_Ptuj_from_Ormoz in
 neighbor 10.0.0.84 route-map RMap_Ptuj_to_Ormoz out
 neighbor 10.0.0.60 remote-as 270
 neighbor 10.0.0.60 description "To RogasjaTTSlatina"
 neighbor 10.0.0.60 advertisement-interval 0
 neighbor 10.0.0.60 soft-reconfiguration inbound
 neighbor 10.0.0.60 send-community
 neighbor 10.0.0.60 route-map RMap_Ptuj_from_RogasjaTTSlatina in
 neighbor 10.0.0.60 route-map RMap_Ptuj_to_RogasjaTTSlatina out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Ptuj
ip access-list extended ACL100
 permit ip host 10.0.0.4 host 10.0.0.55
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 98000000
interface Fa0/0
 service-policy input ACL_LIMIT_100
