!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Bled
!
!
interface Fa0/0
 ip address 10.0.0.27 255.255.255.254
 description "To Kranj"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.30 255.255.255.254
 description "To Tolmin"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Bled_from_Kranj deny 10
!
route-map RMap_Bled_from_Tolmin deny 10
!
!
!
!
router bgp 20
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.26 remote-as 120
 neighbor 10.0.0.26 description "To Kranj"
 neighbor 10.0.0.26 advertisement-interval 0
 neighbor 10.0.0.26 soft-reconfiguration inbound
 neighbor 10.0.0.26 send-community
 neighbor 10.0.0.26 route-map RMap_Bled_from_Kranj in
 neighbor 10.0.0.26 route-map RMap_Bled_to_Kranj out
 neighbor 10.0.0.31 remote-as 320
 neighbor 10.0.0.31 description "To Tolmin"
 neighbor 10.0.0.31 advertisement-interval 0
 neighbor 10.0.0.31 soft-reconfiguration inbound
 neighbor 10.0.0.31 send-community
 neighbor 10.0.0.31 route-map RMap_Bled_from_Tolmin in
 neighbor 10.0.0.31 route-map RMap_Bled_to_Tolmin out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
