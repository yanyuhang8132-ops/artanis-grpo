!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname USA
!
!
interface Fa0/0
 ip address 10.0.0.115 255.255.255.254
 description "To NodeID33"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.129 255.255.255.254
 description "To NodeID38"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_USA_from_NodeID33 deny 10
!
route-map RMap_USA_from_NodeID38 deny 10
!
!
!
!
router bgp 690
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.114 remote-as 370
 neighbor 10.0.0.114 description "To NodeID33"
 neighbor 10.0.0.114 advertisement-interval 0
 neighbor 10.0.0.114 soft-reconfiguration inbound
 neighbor 10.0.0.114 send-community
 neighbor 10.0.0.114 route-map RMap_USA_from_NodeID33 in
 neighbor 10.0.0.114 route-map RMap_USA_to_NodeID33 out
 neighbor 10.0.0.128 remote-as 410
 neighbor 10.0.0.128 description "To NodeID38"
 neighbor 10.0.0.128 advertisement-interval 0
 neighbor 10.0.0.128 soft-reconfiguration inbound
 neighbor 10.0.0.128 send-community
 neighbor 10.0.0.128 route-map RMap_USA_from_NodeID38 in
 neighbor 10.0.0.128 route-map RMap_USA_to_NodeID38 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
