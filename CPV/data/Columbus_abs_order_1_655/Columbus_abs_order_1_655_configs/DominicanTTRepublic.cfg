!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname DominicanTTRepublic
!
!
interface Fa1/0
 ip address 10.0.0.61 255.255.255.254
 description "To TurksTTandTTCaicos"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.133 255.255.255.254
 description "To NodeID39"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.152 255.255.255.254
 description "To NodeID56"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_DominicanTTRepublic_from_NodeID39 deny 10
!
route-map RMap_DominicanTTRepublic_from_NodeID56 deny 10
!
route-map RMap_DominicanTTRepublic_from_TurksTTandTTCaicos deny 10
!
!
!
!
!
router bgp 110
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.132 remote-as 420
 neighbor 10.0.0.132 description "To NodeID39"
 neighbor 10.0.0.132 advertisement-interval 0
 neighbor 10.0.0.132 soft-reconfiguration inbound
 neighbor 10.0.0.132 send-community
 neighbor 10.0.0.132 route-map RMap_DominicanTTRepublic_from_NodeID39 in
 neighbor 10.0.0.132 route-map RMap_DominicanTTRepublic_to_NodeID39 out
 neighbor 10.0.0.153 remote-as 490
 neighbor 10.0.0.153 description "To NodeID56"
 neighbor 10.0.0.153 advertisement-interval 0
 neighbor 10.0.0.153 soft-reconfiguration inbound
 neighbor 10.0.0.153 send-community
 neighbor 10.0.0.153 route-map RMap_DominicanTTRepublic_from_NodeID56 in
 neighbor 10.0.0.153 route-map RMap_DominicanTTRepublic_to_NodeID56 out
 neighbor 10.0.0.60 remote-as 680
 neighbor 10.0.0.60 description "To TurksTTandTTCaicos"
 neighbor 10.0.0.60 advertisement-interval 0
 neighbor 10.0.0.60 soft-reconfiguration inbound
 neighbor 10.0.0.60 send-community
 neighbor 10.0.0.60 route-map RMap_DominicanTTRepublic_from_TurksTTandTTCaicos in
 neighbor 10.0.0.60 route-map RMap_DominicanTTRepublic_to_TurksTTandTTCaicos out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
