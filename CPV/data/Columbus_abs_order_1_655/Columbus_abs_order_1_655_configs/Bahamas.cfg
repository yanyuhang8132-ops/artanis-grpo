!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Bahamas
!
!
interface Fa0/1
 ip address 10.0.0.100 255.255.255.254
 description "To NodeID59"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.102 255.255.255.254
 description "To NodeID45"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Bahamas_from_NodeID45 deny 10
!
route-map RMap_Bahamas_from_NodeID59 deny 10
!
!
!
!
router bgp 20
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.103 remote-as 450
 neighbor 10.0.0.103 description "To NodeID45"
 neighbor 10.0.0.103 advertisement-interval 0
 neighbor 10.0.0.103 soft-reconfiguration inbound
 neighbor 10.0.0.103 send-community
 neighbor 10.0.0.103 route-map RMap_Bahamas_from_NodeID45 in
 neighbor 10.0.0.103 route-map RMap_Bahamas_to_NodeID45 out
 neighbor 10.0.0.101 remote-as 510
 neighbor 10.0.0.101 description "To NodeID59"
 neighbor 10.0.0.101 advertisement-interval 0
 neighbor 10.0.0.101 soft-reconfiguration inbound
 neighbor 10.0.0.101 send-community
 neighbor 10.0.0.101 route-map RMap_Bahamas_from_NodeID59 in
 neighbor 10.0.0.101 route-map RMap_Bahamas_to_NodeID59 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
