!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Barbados
!
!
interface Fa0/0
 ip address 10.0.0.83 255.255.255.254
 description "To NodeID22"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Barbados_from_NodeID22 deny 10
!
!
!
router bgp 30
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.82 remote-as 290
 neighbor 10.0.0.82 description "To NodeID22"
 neighbor 10.0.0.82 advertisement-interval 0
 neighbor 10.0.0.82 soft-reconfiguration inbound
 neighbor 10.0.0.82 send-community
 neighbor 10.0.0.82 route-map RMap_Barbados_from_NodeID22 in
 neighbor 10.0.0.82 route-map RMap_Barbados_to_NodeID22 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
