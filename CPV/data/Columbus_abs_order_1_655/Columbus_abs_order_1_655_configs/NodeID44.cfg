!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID44
!
!
interface Fa0/0
 ip address 10.0.0.107 255.255.255.254
 description "To NodeID31"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.111 255.255.255.254
 description "To NodeID32"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.138 255.255.255.254
 description "To NodeID59"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.140 255.255.255.254
 description "To NodeID45"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID44_from_NodeID31 deny 10
!
route-map RMap_NodeID44_from_NodeID32 deny 10
!
route-map RMap_NodeID44_from_NodeID45 deny 10
!
route-map RMap_NodeID44_from_NodeID59 deny 10
!
!
!
!
!
!
router bgp 440
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.106 remote-as 350
 neighbor 10.0.0.106 description "To NodeID31"
 neighbor 10.0.0.106 advertisement-interval 0
 neighbor 10.0.0.106 soft-reconfiguration inbound
 neighbor 10.0.0.106 send-community
 neighbor 10.0.0.106 route-map RMap_NodeID44_from_NodeID31 in
 neighbor 10.0.0.106 route-map RMap_NodeID44_to_NodeID31 out
 neighbor 10.0.0.110 remote-as 360
 neighbor 10.0.0.110 description "To NodeID32"
 neighbor 10.0.0.110 advertisement-interval 0
 neighbor 10.0.0.110 soft-reconfiguration inbound
 neighbor 10.0.0.110 send-community
 neighbor 10.0.0.110 route-map RMap_NodeID44_from_NodeID32 in
 neighbor 10.0.0.110 route-map RMap_NodeID44_to_NodeID32 out
 neighbor 10.0.0.141 remote-as 450
 neighbor 10.0.0.141 description "To NodeID45"
 neighbor 10.0.0.141 advertisement-interval 0
 neighbor 10.0.0.141 soft-reconfiguration inbound
 neighbor 10.0.0.141 send-community
 neighbor 10.0.0.141 route-map RMap_NodeID44_from_NodeID45 in
 neighbor 10.0.0.141 route-map RMap_NodeID44_to_NodeID45 out
 neighbor 10.0.0.139 remote-as 510
 neighbor 10.0.0.139 description "To NodeID59"
 neighbor 10.0.0.139 advertisement-interval 0
 neighbor 10.0.0.139 soft-reconfiguration inbound
 neighbor 10.0.0.139 send-community
 neighbor 10.0.0.139 route-map RMap_NodeID44_from_NodeID59 in
 neighbor 10.0.0.139 route-map RMap_NodeID44_to_NodeID59 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
