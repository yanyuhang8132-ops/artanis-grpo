!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID34
!
!
interface Fa0/0
 ip address 10.0.0.5 255.255.255.254
 description "To NodeID1"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.21 255.255.255.254
 description "To Panama"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID34_from_NodeID1 deny 10
!
route-map RMap_NodeID34_from_Panama deny 10
!
!
!
!
router bgp 380
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.4 remote-as 240
 neighbor 10.0.0.4 description "To NodeID1"
 neighbor 10.0.0.4 advertisement-interval 0
 neighbor 10.0.0.4 soft-reconfiguration inbound
 neighbor 10.0.0.4 send-community
 neighbor 10.0.0.4 route-map RMap_NodeID34_from_NodeID1 in
 neighbor 10.0.0.4 route-map RMap_NodeID34_to_NodeID1 out
 neighbor 10.0.0.20 remote-as 600
 neighbor 10.0.0.20 description "To Panama"
 neighbor 10.0.0.20 advertisement-interval 0
 neighbor 10.0.0.20 soft-reconfiguration inbound
 neighbor 10.0.0.20 send-community
 neighbor 10.0.0.20 route-map RMap_NodeID34_from_Panama in
 neighbor 10.0.0.20 route-map RMap_NodeID34_to_Panama out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
