!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname TrinidadTTandTTTobago
!
!
interface Fa1/0
 ip address 10.0.0.45 255.255.255.254
 description "To StTTVincent"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.87 255.255.255.254
 description "To Grenada"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.123 255.255.255.254
 description "To NodeID35"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_TrinidadTTandTTTobago_from_Grenada deny 10
!
route-map RMap_TrinidadTTandTTTobago_from_NodeID35 deny 10
!
route-map RMap_TrinidadTTandTTTobago_from_StTTVincent deny 10
!
!
!
!
!
router bgp 670
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.86 remote-as 140
 neighbor 10.0.0.86 description "To Grenada"
 neighbor 10.0.0.86 advertisement-interval 0
 neighbor 10.0.0.86 soft-reconfiguration inbound
 neighbor 10.0.0.86 send-community
 neighbor 10.0.0.86 route-map RMap_TrinidadTTandTTTobago_from_Grenada in
 neighbor 10.0.0.86 route-map RMap_TrinidadTTandTTTobago_to_Grenada out
 neighbor 10.0.0.122 remote-as 390
 neighbor 10.0.0.122 description "To NodeID35"
 neighbor 10.0.0.122 advertisement-interval 0
 neighbor 10.0.0.122 soft-reconfiguration inbound
 neighbor 10.0.0.122 send-community
 neighbor 10.0.0.122 route-map RMap_TrinidadTTandTTTobago_from_NodeID35 in
 neighbor 10.0.0.122 route-map RMap_TrinidadTTandTTTobago_to_NodeID35 out
 neighbor 10.0.0.44 remote-as 650
 neighbor 10.0.0.44 description "To StTTVincent"
 neighbor 10.0.0.44 advertisement-interval 0
 neighbor 10.0.0.44 soft-reconfiguration inbound
 neighbor 10.0.0.44 send-community
 neighbor 10.0.0.44 route-map RMap_TrinidadTTandTTTobago_from_StTTVincent in
 neighbor 10.0.0.44 route-map RMap_TrinidadTTandTTTobago_to_StTTVincent out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
