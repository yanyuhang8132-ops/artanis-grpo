!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname TurksTTandTTCaicos
!
!
interface Fa0/1
 ip address 10.0.0.58 255.255.255.254
 description "To NodeID17"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.60 255.255.255.254
 description "To DominicanTTRepublic"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_TurksTTandTTCaicos_from_DominicanTTRepublic deny 10
!
route-map RMap_TurksTTandTTCaicos_from_NodeID17 deny 10
!
!
!
!
router bgp 680
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.61 remote-as 110
 neighbor 10.0.0.61 description "To DominicanTTRepublic"
 neighbor 10.0.0.61 advertisement-interval 0
 neighbor 10.0.0.61 soft-reconfiguration inbound
 neighbor 10.0.0.61 send-community
 neighbor 10.0.0.61 route-map RMap_TurksTTandTTCaicos_from_DominicanTTRepublic in
 neighbor 10.0.0.61 route-map RMap_TurksTTandTTCaicos_to_DominicanTTRepublic out
 neighbor 10.0.0.59 remote-as 280
 neighbor 10.0.0.59 description "To NodeID17"
 neighbor 10.0.0.59 advertisement-interval 0
 neighbor 10.0.0.59 soft-reconfiguration inbound
 neighbor 10.0.0.59 send-community
 neighbor 10.0.0.59 route-map RMap_TurksTTandTTCaicos_from_NodeID17 in
 neighbor 10.0.0.59 route-map RMap_TurksTTandTTCaicos_to_NodeID17 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
