!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID24
!
!
interface Fa0/1
 ip address 10.0.0.79 255.255.255.254
 description "To NodeID22"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.84 255.255.255.254
 description "To Grenada"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID24_from_Grenada deny 10
!
route-map RMap_NodeID24_from_NodeID22 deny 10
!
!
!
!
router bgp 300
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.85 remote-as 140
 neighbor 10.0.0.85 description "To Grenada"
 neighbor 10.0.0.85 advertisement-interval 0
 neighbor 10.0.0.85 soft-reconfiguration inbound
 neighbor 10.0.0.85 send-community
 neighbor 10.0.0.85 route-map RMap_NodeID24_from_Grenada in
 neighbor 10.0.0.85 route-map RMap_NodeID24_to_Grenada out
 neighbor 10.0.0.78 remote-as 290
 neighbor 10.0.0.78 description "To NodeID22"
 neighbor 10.0.0.78 advertisement-interval 0
 neighbor 10.0.0.78 soft-reconfiguration inbound
 neighbor 10.0.0.78 send-community
 neighbor 10.0.0.78 route-map RMap_NodeID24_from_NodeID22 in
 neighbor 10.0.0.78 route-map RMap_NodeID24_to_NodeID22 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
