!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID69
!
!
interface Fa0/1
 ip address 10.0.0.161 255.255.255.254
 description "To NodeID60"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.163 255.255.255.254
 description "To Nicaragua"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID69_from_Nicaragua deny 10
!
route-map RMap_NodeID69_from_NodeID60 deny 10
!
!
!
!
router bgp 560
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.162 remote-as 220
 neighbor 10.0.0.162 description "To Nicaragua"
 neighbor 10.0.0.162 advertisement-interval 0
 neighbor 10.0.0.162 soft-reconfiguration inbound
 neighbor 10.0.0.162 send-community
 neighbor 10.0.0.162 route-map RMap_NodeID69_from_Nicaragua in
 neighbor 10.0.0.162 route-map RMap_NodeID69_to_Nicaragua out
 neighbor 10.0.0.160 remote-as 520
 neighbor 10.0.0.160 description "To NodeID60"
 neighbor 10.0.0.160 advertisement-interval 0
 neighbor 10.0.0.160 soft-reconfiguration inbound
 neighbor 10.0.0.160 send-community
 neighbor 10.0.0.160 route-map RMap_NodeID69_from_NodeID60 in
 neighbor 10.0.0.160 route-map RMap_NodeID69_to_NodeID60 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
