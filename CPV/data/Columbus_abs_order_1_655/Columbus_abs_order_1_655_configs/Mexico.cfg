!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Mexico
!
!
interface Fa0/0
 ip address 10.0.0.46 255.255.255.254
 description "To Belize"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.48 255.255.255.254
 description "To NodeID15"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Mexico_from_Belize deny 10
!
route-map RMap_Mexico_from_NodeID15 deny 10
!
!
!
!
router bgp 210
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.47 remote-as 40
 neighbor 10.0.0.47 description "To Belize"
 neighbor 10.0.0.47 advertisement-interval 0
 neighbor 10.0.0.47 soft-reconfiguration inbound
 neighbor 10.0.0.47 send-community
 neighbor 10.0.0.47 route-map RMap_Mexico_from_Belize in
 neighbor 10.0.0.47 route-map RMap_Mexico_to_Belize out
 neighbor 10.0.0.49 remote-as 270
 neighbor 10.0.0.49 description "To NodeID15"
 neighbor 10.0.0.49 advertisement-interval 0
 neighbor 10.0.0.49 soft-reconfiguration inbound
 neighbor 10.0.0.49 send-community
 neighbor 10.0.0.49 route-map RMap_Mexico_from_NodeID15 in
 neighbor 10.0.0.49 route-map RMap_Mexico_to_NodeID15 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
