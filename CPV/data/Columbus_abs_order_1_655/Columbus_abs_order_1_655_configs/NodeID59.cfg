!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID59
!
!
interface Fa0/0
 ip address 10.0.0.101 255.255.255.254
 description "To Bahamas"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.109 255.255.255.254
 description "To NodeID32"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.139 255.255.255.254
 description "To NodeID44"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.157 255.255.255.254
 description "To NodeID58"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID59_from_Bahamas deny 10
!
route-map RMap_NodeID59_from_NodeID32 deny 10
!
route-map RMap_NodeID59_from_NodeID44 deny 10
!
route-map RMap_NodeID59_from_NodeID58 deny 10
!
!
!
!
!
!
router bgp 510
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.100 remote-as 20
 neighbor 10.0.0.100 description "To Bahamas"
 neighbor 10.0.0.100 advertisement-interval 0
 neighbor 10.0.0.100 soft-reconfiguration inbound
 neighbor 10.0.0.100 send-community
 neighbor 10.0.0.100 route-map RMap_NodeID59_from_Bahamas in
 neighbor 10.0.0.100 route-map RMap_NodeID59_to_Bahamas out
 neighbor 10.0.0.108 remote-as 360
 neighbor 10.0.0.108 description "To NodeID32"
 neighbor 10.0.0.108 advertisement-interval 0
 neighbor 10.0.0.108 soft-reconfiguration inbound
 neighbor 10.0.0.108 send-community
 neighbor 10.0.0.108 route-map RMap_NodeID59_from_NodeID32 in
 neighbor 10.0.0.108 route-map RMap_NodeID59_to_NodeID32 out
 neighbor 10.0.0.138 remote-as 440
 neighbor 10.0.0.138 description "To NodeID44"
 neighbor 10.0.0.138 advertisement-interval 0
 neighbor 10.0.0.138 soft-reconfiguration inbound
 neighbor 10.0.0.138 send-community
 neighbor 10.0.0.138 route-map RMap_NodeID59_from_NodeID44 in
 neighbor 10.0.0.138 route-map RMap_NodeID59_to_NodeID44 out
 neighbor 10.0.0.156 remote-as 500
 neighbor 10.0.0.156 description "To NodeID58"
 neighbor 10.0.0.156 advertisement-interval 0
 neighbor 10.0.0.156 soft-reconfiguration inbound
 neighbor 10.0.0.156 send-community
 neighbor 10.0.0.156 route-map RMap_NodeID59_from_NodeID58 in
 neighbor 10.0.0.156 route-map RMap_NodeID59_to_NodeID58 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
