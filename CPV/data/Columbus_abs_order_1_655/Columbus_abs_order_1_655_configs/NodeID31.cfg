!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID31
!
!
interface Fa0/0
 ip address 10.0.0.55 255.255.255.254
 description "To NodeID13"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.89 255.255.255.254
 description "To NodeID26"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.104 255.255.255.254
 description "To NodeID49"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.106 255.255.255.254
 description "To NodeID44"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID31_from_NodeID13 deny 10
!
route-map RMap_NodeID31_from_NodeID26 deny 10
!
route-map RMap_NodeID31_from_NodeID44 deny 10
!
route-map RMap_NodeID31_from_NodeID49 deny 10
!
!
!
!
!
!
router bgp 350
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.54 remote-as 250
 neighbor 10.0.0.54 description "To NodeID13"
 neighbor 10.0.0.54 advertisement-interval 0
 neighbor 10.0.0.54 soft-reconfiguration inbound
 neighbor 10.0.0.54 send-community
 neighbor 10.0.0.54 route-map RMap_NodeID31_from_NodeID13 in
 neighbor 10.0.0.54 route-map RMap_NodeID31_to_NodeID13 out
 neighbor 10.0.0.88 remote-as 310
 neighbor 10.0.0.88 description "To NodeID26"
 neighbor 10.0.0.88 advertisement-interval 0
 neighbor 10.0.0.88 soft-reconfiguration inbound
 neighbor 10.0.0.88 send-community
 neighbor 10.0.0.88 route-map RMap_NodeID31_from_NodeID26 in
 neighbor 10.0.0.88 route-map RMap_NodeID31_to_NodeID26 out
 neighbor 10.0.0.107 remote-as 440
 neighbor 10.0.0.107 description "To NodeID44"
 neighbor 10.0.0.107 advertisement-interval 0
 neighbor 10.0.0.107 soft-reconfiguration inbound
 neighbor 10.0.0.107 send-community
 neighbor 10.0.0.107 route-map RMap_NodeID31_from_NodeID44 in
 neighbor 10.0.0.107 route-map RMap_NodeID31_to_NodeID44 out
 neighbor 10.0.0.105 remote-as 470
 neighbor 10.0.0.105 description "To NodeID49"
 neighbor 10.0.0.105 advertisement-interval 0
 neighbor 10.0.0.105 soft-reconfiguration inbound
 neighbor 10.0.0.105 send-community
 neighbor 10.0.0.105 route-map RMap_NodeID31_from_NodeID49 in
 neighbor 10.0.0.105 route-map RMap_NodeID31_to_NodeID49 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
