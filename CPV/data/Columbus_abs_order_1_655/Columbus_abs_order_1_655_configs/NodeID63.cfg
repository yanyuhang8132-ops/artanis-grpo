!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID63
!
!
interface Fa1/0
 ip address 10.0.0.165 255.255.255.254
 description "To NodeID62"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.166 255.255.255.254
 description "To ElTTSalvador"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.168 255.255.255.254
 description "To Guatemala"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID63_from_ElTTSalvador deny 10
!
route-map RMap_NodeID63_from_Guatemala deny 10
!
route-map RMap_NodeID63_from_NodeID62 deny 10
!
!
!
!
!
router bgp 540
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.167 remote-as 130
 neighbor 10.0.0.167 description "To ElTTSalvador"
 neighbor 10.0.0.167 advertisement-interval 0
 neighbor 10.0.0.167 soft-reconfiguration inbound
 neighbor 10.0.0.167 send-community
 neighbor 10.0.0.167 route-map RMap_NodeID63_from_ElTTSalvador in
 neighbor 10.0.0.167 route-map RMap_NodeID63_to_ElTTSalvador out
 neighbor 10.0.0.169 remote-as 160
 neighbor 10.0.0.169 description "To Guatemala"
 neighbor 10.0.0.169 advertisement-interval 0
 neighbor 10.0.0.169 soft-reconfiguration inbound
 neighbor 10.0.0.169 send-community
 neighbor 10.0.0.169 route-map RMap_NodeID63_from_Guatemala in
 neighbor 10.0.0.169 route-map RMap_NodeID63_to_Guatemala out
 neighbor 10.0.0.164 remote-as 530
 neighbor 10.0.0.164 description "To NodeID62"
 neighbor 10.0.0.164 advertisement-interval 0
 neighbor 10.0.0.164 soft-reconfiguration inbound
 neighbor 10.0.0.164 send-community
 neighbor 10.0.0.164 route-map RMap_NodeID63_from_NodeID62 in
 neighbor 10.0.0.164 route-map RMap_NodeID63_to_NodeID62 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
