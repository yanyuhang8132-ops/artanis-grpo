!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID49
!
!
interface Fa0/0
 ip address 10.0.0.105 255.255.255.254
 description "To NodeID31"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.113 255.255.255.254
 description "To NodeID33"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.143 255.255.255.254
 description "To NodeID45"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID49_from_NodeID31 deny 10
!
route-map RMap_NodeID49_from_NodeID33 deny 10
!
route-map RMap_NodeID49_from_NodeID45 deny 10
!
!
!
!
!
router bgp 470
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.104 remote-as 350
 neighbor 10.0.0.104 description "To NodeID31"
 neighbor 10.0.0.104 advertisement-interval 0
 neighbor 10.0.0.104 soft-reconfiguration inbound
 neighbor 10.0.0.104 send-community
 neighbor 10.0.0.104 route-map RMap_NodeID49_from_NodeID31 in
 neighbor 10.0.0.104 route-map RMap_NodeID49_to_NodeID31 out
 neighbor 10.0.0.112 remote-as 370
 neighbor 10.0.0.112 description "To NodeID33"
 neighbor 10.0.0.112 advertisement-interval 0
 neighbor 10.0.0.112 soft-reconfiguration inbound
 neighbor 10.0.0.112 send-community
 neighbor 10.0.0.112 route-map RMap_NodeID49_from_NodeID33 in
 neighbor 10.0.0.112 route-map RMap_NodeID49_to_NodeID33 out
 neighbor 10.0.0.142 remote-as 450
 neighbor 10.0.0.142 description "To NodeID45"
 neighbor 10.0.0.142 advertisement-interval 0
 neighbor 10.0.0.142 soft-reconfiguration inbound
 neighbor 10.0.0.142 send-community
 neighbor 10.0.0.142 route-map RMap_NodeID49_from_NodeID45 in
 neighbor 10.0.0.142 route-map RMap_NodeID49_to_NodeID45 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
