!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Guyana
!
!
interface Fa0/0
 ip address 10.0.0.121 255.255.255.254
 description "To NodeID35"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Guyana_from_NodeID35 deny 10
!
!
!
router bgp 170
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.120 remote-as 390
 neighbor 10.0.0.120 description "To NodeID35"
 neighbor 10.0.0.120 advertisement-interval 0
 neighbor 10.0.0.120 soft-reconfiguration inbound
 neighbor 10.0.0.120 send-community
 neighbor 10.0.0.120 route-map RMap_Guyana_from_NodeID35 in
 neighbor 10.0.0.120 route-map RMap_Guyana_to_NodeID35 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
