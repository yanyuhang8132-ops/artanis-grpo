!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Jamaica
!
!
interface Fa0/0
 ip address 10.0.0.131 255.255.255.254
 description "To NodeID39"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.134 255.255.255.254
 description "To NodeID41"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Jamaica_from_NodeID39 deny 10
!
route-map RMap_Jamaica_from_NodeID41 deny 10
!
!
!
!
router bgp 190
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.130 remote-as 420
 neighbor 10.0.0.130 description "To NodeID39"
 neighbor 10.0.0.130 advertisement-interval 0
 neighbor 10.0.0.130 soft-reconfiguration inbound
 neighbor 10.0.0.130 send-community
 neighbor 10.0.0.130 route-map RMap_Jamaica_from_NodeID39 in
 neighbor 10.0.0.130 route-map RMap_Jamaica_to_NodeID39 out
 neighbor 10.0.0.135 remote-as 430
 neighbor 10.0.0.135 description "To NodeID41"
 neighbor 10.0.0.135 advertisement-interval 0
 neighbor 10.0.0.135 soft-reconfiguration inbound
 neighbor 10.0.0.135 send-community
 neighbor 10.0.0.135 route-map RMap_Jamaica_from_NodeID41 in
 neighbor 10.0.0.135 route-map RMap_Jamaica_to_NodeID41 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
