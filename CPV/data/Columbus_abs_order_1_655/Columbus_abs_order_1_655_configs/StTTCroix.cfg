!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname StTTCroix
!
!
interface Fa1/0
 ip address 10.0.0.39 255.255.255.254
 description "To NodeID8"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.81 255.255.255.254
 description "To NodeID22"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.151 255.255.255.254
 description "To NodeID50"
 speed auto
 duplex auto
!
!
ip community-list 1 permit 100:0 100:0 100:0
!
!
!
!
!
route-map RMap_StTTCroix_from_NodeID22 permit 10
 match community 1
 set local-preference 1
 set community 100:0 additive
route-map RMap_StTTCroix_from_NodeID22 deny 20
!
route-map RMap_StTTCroix_from_NodeID50 deny 10
!
route-map RMap_StTTCroix_from_NodeID8 deny 10
!
!
route-map RMap_StTTCroix_to_NodeID50 permit 100
!
route-map RMap_StTTCroix_to_NodeID8 permit 100
!
!
router bgp 620
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.80 remote-as 290
 neighbor 10.0.0.80 description "To NodeID22"
 neighbor 10.0.0.80 advertisement-interval 0
 neighbor 10.0.0.80 soft-reconfiguration inbound
 neighbor 10.0.0.80 send-community
 neighbor 10.0.0.80 route-map RMap_StTTCroix_from_NodeID22 in
 neighbor 10.0.0.80 route-map RMap_StTTCroix_to_NodeID22 out
 neighbor 10.0.0.150 remote-as 480
 neighbor 10.0.0.150 description "To NodeID50"
 neighbor 10.0.0.150 advertisement-interval 0
 neighbor 10.0.0.150 soft-reconfiguration inbound
 neighbor 10.0.0.150 send-community
 neighbor 10.0.0.150 route-map RMap_StTTCroix_from_NodeID50 in
 neighbor 10.0.0.150 route-map RMap_StTTCroix_to_NodeID50 out
 neighbor 10.0.0.38 remote-as 580
 neighbor 10.0.0.38 description "To NodeID8"
 neighbor 10.0.0.38 advertisement-interval 0
 neighbor 10.0.0.38 soft-reconfiguration inbound
 neighbor 10.0.0.38 send-community
 neighbor 10.0.0.38 route-map RMap_StTTCroix_from_NodeID8 in
 neighbor 10.0.0.38 route-map RMap_StTTCroix_to_NodeID8 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
