!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Guatemala
!
!
interface Fa0/0
 ip address 10.0.0.91 255.255.255.254
 description "To NodeID28"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.169 255.255.255.254
 description "To NodeID63"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Guatemala_from_NodeID28 deny 10
!
route-map RMap_Guatemala_from_NodeID63 deny 10
!
!
!
!
router bgp 160
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.90 remote-as 330
 neighbor 10.0.0.90 description "To NodeID28"
 neighbor 10.0.0.90 advertisement-interval 0
 neighbor 10.0.0.90 soft-reconfiguration inbound
 neighbor 10.0.0.90 send-community
 neighbor 10.0.0.90 route-map RMap_Guatemala_from_NodeID28 in
 neighbor 10.0.0.90 route-map RMap_Guatemala_to_NodeID28 out
 neighbor 10.0.0.168 remote-as 540
 neighbor 10.0.0.168 description "To NodeID63"
 neighbor 10.0.0.168 advertisement-interval 0
 neighbor 10.0.0.168 soft-reconfiguration inbound
 neighbor 10.0.0.168 send-community
 neighbor 10.0.0.168 route-map RMap_Guatemala_from_NodeID63 in
 neighbor 10.0.0.168 route-map RMap_Guatemala_to_NodeID63 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
