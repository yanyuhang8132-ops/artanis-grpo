!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID29
!
!
interface Fa0/0
 ip address 10.0.0.51 255.255.255.254
 description "To NodeID13"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.96 255.255.255.254
 description "To NodeID67"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.98 255.255.255.254
 description "To NodeID46"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID29_from_NodeID13 deny 10
!
route-map RMap_NodeID29_from_NodeID46 deny 10
!
route-map RMap_NodeID29_from_NodeID67 deny 10
!
!
!
!
!
router bgp 340
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.50 remote-as 250
 neighbor 10.0.0.50 description "To NodeID13"
 neighbor 10.0.0.50 advertisement-interval 0
 neighbor 10.0.0.50 soft-reconfiguration inbound
 neighbor 10.0.0.50 send-community
 neighbor 10.0.0.50 route-map RMap_NodeID29_from_NodeID13 in
 neighbor 10.0.0.50 route-map RMap_NodeID29_to_NodeID13 out
 neighbor 10.0.0.99 remote-as 460
 neighbor 10.0.0.99 description "To NodeID46"
 neighbor 10.0.0.99 advertisement-interval 0
 neighbor 10.0.0.99 soft-reconfiguration inbound
 neighbor 10.0.0.99 send-community
 neighbor 10.0.0.99 route-map RMap_NodeID29_from_NodeID46 in
 neighbor 10.0.0.99 route-map RMap_NodeID29_to_NodeID46 out
 neighbor 10.0.0.97 remote-as 550
 neighbor 10.0.0.97 description "To NodeID67"
 neighbor 10.0.0.97 advertisement-interval 0
 neighbor 10.0.0.97 soft-reconfiguration inbound
 neighbor 10.0.0.97 send-community
 neighbor 10.0.0.97 route-map RMap_NodeID29_from_NodeID67 in
 neighbor 10.0.0.97 route-map RMap_NodeID29_to_NodeID67 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
