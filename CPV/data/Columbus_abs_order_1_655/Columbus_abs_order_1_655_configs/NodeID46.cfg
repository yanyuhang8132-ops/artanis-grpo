!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID46
!
!
interface Fa1/0
 ip address 10.0.0.43 255.255.255.254
 description "To NodeID9"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.99 255.255.255.254
 description "To NodeID29"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.137 255.255.255.254
 description "To CaymanTTIslands"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID46_from_CaymanTTIslands deny 10
!
route-map RMap_NodeID46_from_NodeID29 deny 10
!
route-map RMap_NodeID46_from_NodeID9 deny 10
!
!
!
!
!
router bgp 460
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.136 remote-as 60
 neighbor 10.0.0.136 description "To CaymanTTIslands"
 neighbor 10.0.0.136 advertisement-interval 0
 neighbor 10.0.0.136 soft-reconfiguration inbound
 neighbor 10.0.0.136 send-community
 neighbor 10.0.0.136 route-map RMap_NodeID46_from_CaymanTTIslands in
 neighbor 10.0.0.136 route-map RMap_NodeID46_to_CaymanTTIslands out
 neighbor 10.0.0.98 remote-as 340
 neighbor 10.0.0.98 description "To NodeID29"
 neighbor 10.0.0.98 advertisement-interval 0
 neighbor 10.0.0.98 soft-reconfiguration inbound
 neighbor 10.0.0.98 send-community
 neighbor 10.0.0.98 route-map RMap_NodeID46_from_NodeID29 in
 neighbor 10.0.0.98 route-map RMap_NodeID46_to_NodeID29 out
 neighbor 10.0.0.42 remote-as 590
 neighbor 10.0.0.42 description "To NodeID9"
 neighbor 10.0.0.42 advertisement-interval 0
 neighbor 10.0.0.42 soft-reconfiguration inbound
 neighbor 10.0.0.42 send-community
 neighbor 10.0.0.42 route-map RMap_NodeID46_from_NodeID9 in
 neighbor 10.0.0.42 route-map RMap_NodeID46_to_NodeID9 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
