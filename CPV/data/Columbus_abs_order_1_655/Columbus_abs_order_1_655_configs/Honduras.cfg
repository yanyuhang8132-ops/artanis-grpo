!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Honduras
!
!
interface Fa0/0
 ip address 10.0.0.159 255.255.255.254
 description "To NodeID60"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.171 255.255.255.254
 description "To NodeID67"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Honduras_from_NodeID60 deny 10
!
route-map RMap_Honduras_from_NodeID67 deny 10
!
!
!
!
router bgp 180
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.158 remote-as 520
 neighbor 10.0.0.158 description "To NodeID60"
 neighbor 10.0.0.158 advertisement-interval 0
 neighbor 10.0.0.158 soft-reconfiguration inbound
 neighbor 10.0.0.158 send-community
 neighbor 10.0.0.158 route-map RMap_Honduras_from_NodeID60 in
 neighbor 10.0.0.158 route-map RMap_Honduras_to_NodeID60 out
 neighbor 10.0.0.170 remote-as 550
 neighbor 10.0.0.170 description "To NodeID67"
 neighbor 10.0.0.170 advertisement-interval 0
 neighbor 10.0.0.170 soft-reconfiguration inbound
 neighbor 10.0.0.170 send-community
 neighbor 10.0.0.170 route-map RMap_Honduras_from_NodeID67 in
 neighbor 10.0.0.170 route-map RMap_Honduras_to_NodeID67 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
