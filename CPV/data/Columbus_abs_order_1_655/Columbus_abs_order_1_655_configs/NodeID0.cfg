!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID0
!
!
interface Fa0/0
 ip address 10.0.0.0 255.255.255.254
 description "To NodeID1"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.2 255.255.255.254
 description "To NodeID27"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID0_from_NodeID1 deny 10
!
route-map RMap_NodeID0_from_NodeID27 deny 10
!
!
!
!
router bgp 230
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.1 remote-as 240
 neighbor 10.0.0.1 description "To NodeID1"
 neighbor 10.0.0.1 advertisement-interval 0
 neighbor 10.0.0.1 soft-reconfiguration inbound
 neighbor 10.0.0.1 send-community
 neighbor 10.0.0.1 route-map RMap_NodeID0_from_NodeID1 in
 neighbor 10.0.0.1 route-map RMap_NodeID0_to_NodeID1 out
 neighbor 10.0.0.3 remote-as 320
 neighbor 10.0.0.3 description "To NodeID27"
 neighbor 10.0.0.3 advertisement-interval 0
 neighbor 10.0.0.3 soft-reconfiguration inbound
 neighbor 10.0.0.3 send-community
 neighbor 10.0.0.3 route-map RMap_NodeID0_from_NodeID27 in
 neighbor 10.0.0.3 route-map RMap_NodeID0_to_NodeID27 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
