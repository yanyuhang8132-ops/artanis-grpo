!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Martinique
!
!
interface Fa0/0
 ip address 10.0.0.71 255.255.255.254
 description "To Dominica"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.74 255.255.255.254
 description "To NodeID22"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.76 255.255.255.254
 description "To PeerMartinique_0"
 speed auto
 duplex auto
!
!
!
!
!
!
!
route-map RMap_External_Martinique_from_PeerMartinique_0 permit 10
 set community 100:0 additive
 set local-preference 1
!
route-map RMap_Martinique_from_Dominica deny 10
!
route-map RMap_Martinique_from_NodeID22 deny 10
!
route-map RMap_Martinique_to_Dominica permit 100
!
route-map RMap_Martinique_to_NodeID22 permit 100
!
!
!
router bgp 200
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.70 remote-as 100
 neighbor 10.0.0.70 description "To Dominica"
 neighbor 10.0.0.70 advertisement-interval 0
 neighbor 10.0.0.70 soft-reconfiguration inbound
 neighbor 10.0.0.70 send-community
 neighbor 10.0.0.70 route-map RMap_Martinique_from_Dominica in
 neighbor 10.0.0.70 route-map RMap_Martinique_to_Dominica out
 neighbor 10.0.0.75 remote-as 290
 neighbor 10.0.0.75 description "To NodeID22"
 neighbor 10.0.0.75 advertisement-interval 0
 neighbor 10.0.0.75 soft-reconfiguration inbound
 neighbor 10.0.0.75 send-community
 neighbor 10.0.0.75 route-map RMap_Martinique_from_NodeID22 in
 neighbor 10.0.0.75 route-map RMap_Martinique_to_NodeID22 out
 neighbor 10.0.0.77 remote-as 10010
 neighbor 10.0.0.77 description "To PeerMartinique_0"
 neighbor 10.0.0.77 advertisement-interval 0
 neighbor 10.0.0.77 soft-reconfiguration inbound
 neighbor 10.0.0.77 send-community
 neighbor 10.0.0.77 route-map RMap_External_Martinique_from_PeerMartinique_0 in
 neighbor 10.0.0.77 route-map RMap_Martinique_to_PeerMartinique_0 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
