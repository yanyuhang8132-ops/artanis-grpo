!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID32
!
!
interface Fa0/1
 ip address 10.0.0.108 255.255.255.254
 description "To NodeID59"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.110 255.255.255.254
 description "To NodeID44"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID32_from_NodeID44 deny 10
!
route-map RMap_NodeID32_from_NodeID59 deny 10
!
!
!
!
router bgp 360
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.111 remote-as 440
 neighbor 10.0.0.111 description "To NodeID44"
 neighbor 10.0.0.111 advertisement-interval 0
 neighbor 10.0.0.111 soft-reconfiguration inbound
 neighbor 10.0.0.111 send-community
 neighbor 10.0.0.111 route-map RMap_NodeID32_from_NodeID44 in
 neighbor 10.0.0.111 route-map RMap_NodeID32_to_NodeID44 out
 neighbor 10.0.0.109 remote-as 510
 neighbor 10.0.0.109 description "To NodeID59"
 neighbor 10.0.0.109 advertisement-interval 0
 neighbor 10.0.0.109 soft-reconfiguration inbound
 neighbor 10.0.0.109 send-community
 neighbor 10.0.0.109 route-map RMap_NodeID32_from_NodeID59 in
 neighbor 10.0.0.109 route-map RMap_NodeID32_to_NodeID59 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
