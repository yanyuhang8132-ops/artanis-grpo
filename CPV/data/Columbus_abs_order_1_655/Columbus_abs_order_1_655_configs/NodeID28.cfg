!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID28
!
!
interface Fa0/1
 ip address 10.0.0.90 255.255.255.254
 description "To Guatemala"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.92 255.255.255.254
 description "To Belize"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.94 255.255.255.254
 description "To NodeID67"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID28_from_Belize deny 10
!
route-map RMap_NodeID28_from_Guatemala deny 10
!
route-map RMap_NodeID28_from_NodeID67 deny 10
!
!
!
!
!
router bgp 330
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.93 remote-as 40
 neighbor 10.0.0.93 description "To Belize"
 neighbor 10.0.0.93 advertisement-interval 0
 neighbor 10.0.0.93 soft-reconfiguration inbound
 neighbor 10.0.0.93 send-community
 neighbor 10.0.0.93 route-map RMap_NodeID28_from_Belize in
 neighbor 10.0.0.93 route-map RMap_NodeID28_to_Belize out
 neighbor 10.0.0.91 remote-as 160
 neighbor 10.0.0.91 description "To Guatemala"
 neighbor 10.0.0.91 advertisement-interval 0
 neighbor 10.0.0.91 soft-reconfiguration inbound
 neighbor 10.0.0.91 send-community
 neighbor 10.0.0.91 route-map RMap_NodeID28_from_Guatemala in
 neighbor 10.0.0.91 route-map RMap_NodeID28_to_Guatemala out
 neighbor 10.0.0.95 remote-as 550
 neighbor 10.0.0.95 description "To NodeID67"
 neighbor 10.0.0.95 advertisement-interval 0
 neighbor 10.0.0.95 soft-reconfiguration inbound
 neighbor 10.0.0.95 send-community
 neighbor 10.0.0.95 route-map RMap_NodeID28_from_NodeID67 in
 neighbor 10.0.0.95 route-map RMap_NodeID28_to_NodeID67 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
