!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Grenada
!
!
interface Fa0/0
 ip address 10.0.0.85 255.255.255.254
 description "To NodeID24"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.86 255.255.255.254
 description "To TrinidadTTandTTTobago"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Grenada_from_NodeID24 deny 10
!
route-map RMap_Grenada_from_TrinidadTTandTTTobago deny 10
!
!
!
!
router bgp 140
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.84 remote-as 300
 neighbor 10.0.0.84 description "To NodeID24"
 neighbor 10.0.0.84 advertisement-interval 0
 neighbor 10.0.0.84 soft-reconfiguration inbound
 neighbor 10.0.0.84 send-community
 neighbor 10.0.0.84 route-map RMap_Grenada_from_NodeID24 in
 neighbor 10.0.0.84 route-map RMap_Grenada_to_NodeID24 out
 neighbor 10.0.0.87 remote-as 670
 neighbor 10.0.0.87 description "To TrinidadTTandTTTobago"
 neighbor 10.0.0.87 advertisement-interval 0
 neighbor 10.0.0.87 soft-reconfiguration inbound
 neighbor 10.0.0.87 send-community
 neighbor 10.0.0.87 route-map RMap_Grenada_from_TrinidadTTandTTTobago in
 neighbor 10.0.0.87 route-map RMap_Grenada_to_TrinidadTTandTTTobago out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
