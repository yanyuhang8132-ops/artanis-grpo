!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NodeID33
!
!
interface Fa0/1
 ip address 10.0.0.112 255.255.255.254
 description "To NodeID49"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.114 255.255.255.254
 description "To USA"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.116 255.255.255.254
 description "To NodeID45"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NodeID33_from_NodeID45 deny 10
!
route-map RMap_NodeID33_from_NodeID49 deny 10
!
route-map RMap_NodeID33_from_USA deny 10
!
!
!
!
!
router bgp 370
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.117 remote-as 450
 neighbor 10.0.0.117 description "To NodeID45"
 neighbor 10.0.0.117 advertisement-interval 0
 neighbor 10.0.0.117 soft-reconfiguration inbound
 neighbor 10.0.0.117 send-community
 neighbor 10.0.0.117 route-map RMap_NodeID33_from_NodeID45 in
 neighbor 10.0.0.117 route-map RMap_NodeID33_to_NodeID45 out
 neighbor 10.0.0.113 remote-as 470
 neighbor 10.0.0.113 description "To NodeID49"
 neighbor 10.0.0.113 advertisement-interval 0
 neighbor 10.0.0.113 soft-reconfiguration inbound
 neighbor 10.0.0.113 send-community
 neighbor 10.0.0.113 route-map RMap_NodeID33_from_NodeID49 in
 neighbor 10.0.0.113 route-map RMap_NodeID33_to_NodeID49 out
 neighbor 10.0.0.115 remote-as 690
 neighbor 10.0.0.115 description "To USA"
 neighbor 10.0.0.115 advertisement-interval 0
 neighbor 10.0.0.115 soft-reconfiguration inbound
 neighbor 10.0.0.115 send-community
 neighbor 10.0.0.115 route-map RMap_NodeID33_from_USA in
 neighbor 10.0.0.115 route-map RMap_NodeID33_to_USA out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
