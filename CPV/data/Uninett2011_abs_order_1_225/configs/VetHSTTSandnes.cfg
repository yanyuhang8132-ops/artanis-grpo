!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname VetHSTTSandnes
!
!
interface Fa0/0
 ip address 10.0.0.103 255.255.255.254
 description "To UiSTTStavanger"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_VetHSTTSandnes_from_UiSTTStavanger deny 10
!
!
!
router bgp 690
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.102 remote-as 650
 neighbor 10.0.0.102 description "To UiSTTStavanger"
 neighbor 10.0.0.102 advertisement-interval 0
 neighbor 10.0.0.102 soft-reconfiguration inbound
 neighbor 10.0.0.102 send-community
 neighbor 10.0.0.102 route-map RMap_VetHSTTSandnes_from_UiSTTStavanger in
 neighbor 10.0.0.102 route-map RMap_VetHSTTSandnes_to_UiSTTStavanger out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
