!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiNTTTNamsos
!
!
interface Fa0/1
 ip address 10.0.0.53 255.255.255.254
 description "To NBTTMoTTiTTRana"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.131 255.255.255.254
 description "To HiNTTTSteinkjer"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiNTTTNamsos_from_HiNTTTSteinkjer deny 10
!
route-map RMap_HiNTTTNamsos_from_NBTTMoTTiTTRana deny 10
!
!
!
!
router bgp 330
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.130 remote-as 340
 neighbor 10.0.0.130 description "To HiNTTTSteinkjer"
 neighbor 10.0.0.130 advertisement-interval 0
 neighbor 10.0.0.130 soft-reconfiguration inbound
 neighbor 10.0.0.130 send-community
 neighbor 10.0.0.130 route-map RMap_HiNTTTNamsos_from_HiNTTTSteinkjer in
 neighbor 10.0.0.130 route-map RMap_HiNTTTNamsos_to_HiNTTTSteinkjer out
 neighbor 10.0.0.52 remote-as 450
 neighbor 10.0.0.52 description "To NBTTMoTTiTTRana"
 neighbor 10.0.0.52 advertisement-interval 0
 neighbor 10.0.0.52 soft-reconfiguration inbound
 neighbor 10.0.0.52 send-community
 neighbor 10.0.0.52 route-map RMap_HiNTTTNamsos_from_NBTTMoTTiTTRana in
 neighbor 10.0.0.52 route-map RMap_HiNTTTNamsos_to_NBTTMoTTiTTRana out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
