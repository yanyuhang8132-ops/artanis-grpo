!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UiO
!
!
interface Fa2/0
 ip address 10.0.0.0 255.255.255.254
 description "To UiOID1"
 speed auto
 duplex auto
!
interface Fa2/1
 ip address 10.0.0.2 255.255.255.254
 description "To UiOTTStTTOlavsplassTT5"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.4 255.255.255.254
 description "To HHTTKongsvinger"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.6 255.255.255.254
 description "To UMBTTAs"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.8 255.255.255.254
 description "To HiTTTBo"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.10 255.255.255.254
 description "To UiBTTBT"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UiO_from_HHTTKongsvinger deny 10
!
route-map RMap_UiO_from_HiTTTBo deny 10
!
route-map RMap_UiO_from_UMBTTAs deny 10
!
route-map RMap_UiO_from_UiBTTBT deny 10
!
route-map RMap_UiO_from_UiOID1 deny 10
!
route-map RMap_UiO_from_UiOTTStTTOlavsplassTT5 deny 10
!
!
!
!
!
!
!
!
router bgp 620
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.5 remote-as 60
 neighbor 10.0.0.5 description "To HHTTKongsvinger"
 neighbor 10.0.0.5 advertisement-interval 0
 neighbor 10.0.0.5 soft-reconfiguration inbound
 neighbor 10.0.0.5 send-community
 neighbor 10.0.0.5 route-map RMap_UiO_from_HHTTKongsvinger in
 neighbor 10.0.0.5 route-map RMap_UiO_to_HHTTKongsvinger out
 neighbor 10.0.0.9 remote-as 400
 neighbor 10.0.0.9 description "To HiTTTBo"
 neighbor 10.0.0.9 advertisement-interval 0
 neighbor 10.0.0.9 soft-reconfiguration inbound
 neighbor 10.0.0.9 send-community
 neighbor 10.0.0.9 route-map RMap_UiO_from_HiTTTBo in
 neighbor 10.0.0.9 route-map RMap_UiO_to_HiTTTBo out
 neighbor 10.0.0.7 remote-as 540
 neighbor 10.0.0.7 description "To UMBTTAs"
 neighbor 10.0.0.7 advertisement-interval 0
 neighbor 10.0.0.7 soft-reconfiguration inbound
 neighbor 10.0.0.7 send-community
 neighbor 10.0.0.7 route-map RMap_UiO_from_UMBTTAs in
 neighbor 10.0.0.7 route-map RMap_UiO_to_UMBTTAs out
 neighbor 10.0.0.11 remote-as 600
 neighbor 10.0.0.11 description "To UiBTTBT"
 neighbor 10.0.0.11 advertisement-interval 0
 neighbor 10.0.0.11 soft-reconfiguration inbound
 neighbor 10.0.0.11 send-community
 neighbor 10.0.0.11 route-map RMap_UiO_from_UiBTTBT in
 neighbor 10.0.0.11 route-map RMap_UiO_to_UiBTTBT out
 neighbor 10.0.0.1 remote-as 630
 neighbor 10.0.0.1 description "To UiOID1"
 neighbor 10.0.0.1 advertisement-interval 0
 neighbor 10.0.0.1 soft-reconfiguration inbound
 neighbor 10.0.0.1 send-community
 neighbor 10.0.0.1 route-map RMap_UiO_from_UiOID1 in
 neighbor 10.0.0.1 route-map RMap_UiO_to_UiOID1 out
 neighbor 10.0.0.3 remote-as 640
 neighbor 10.0.0.3 description "To UiOTTStTTOlavsplassTT5"
 neighbor 10.0.0.3 advertisement-interval 0
 neighbor 10.0.0.3 soft-reconfiguration inbound
 neighbor 10.0.0.3 send-community
 neighbor 10.0.0.3 route-map RMap_UiO_from_UiOTTStTTOlavsplassTT5 in
 neighbor 10.0.0.3 route-map RMap_UiO_to_UiOTTStTTOlavsplassTT5 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
