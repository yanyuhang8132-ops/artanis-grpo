!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiOTTFredrikstad
!
!
interface Fa0/0
 ip address 10.0.0.65 255.255.255.254
 description "To HVETTBorre"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.165 255.255.255.254
 description "To HiOTTHalden"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.167 255.255.255.254
 description "To UMBTTAs"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiOTTFredrikstad_from_HVETTBorre deny 10
!
route-map RMap_HiOTTFredrikstad_from_HiOTTHalden deny 10
!
route-map RMap_HiOTTFredrikstad_from_UMBTTAs deny 10
!
!
!
!
!
router bgp 380
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.64 remote-as 160
 neighbor 10.0.0.64 description "To HVETTBorre"
 neighbor 10.0.0.64 advertisement-interval 0
 neighbor 10.0.0.64 soft-reconfiguration inbound
 neighbor 10.0.0.64 send-community
 neighbor 10.0.0.64 route-map RMap_HiOTTFredrikstad_from_HVETTBorre in
 neighbor 10.0.0.64 route-map RMap_HiOTTFredrikstad_to_HVETTBorre out
 neighbor 10.0.0.164 remote-as 390
 neighbor 10.0.0.164 description "To HiOTTHalden"
 neighbor 10.0.0.164 advertisement-interval 0
 neighbor 10.0.0.164 soft-reconfiguration inbound
 neighbor 10.0.0.164 send-community
 neighbor 10.0.0.164 route-map RMap_HiOTTFredrikstad_from_HiOTTHalden in
 neighbor 10.0.0.164 route-map RMap_HiOTTFredrikstad_to_HiOTTHalden out
 neighbor 10.0.0.166 remote-as 540
 neighbor 10.0.0.166 description "To UMBTTAs"
 neighbor 10.0.0.166 advertisement-interval 0
 neighbor 10.0.0.166 soft-reconfiguration inbound
 neighbor 10.0.0.166 send-community
 neighbor 10.0.0.166 route-map RMap_HiOTTFredrikstad_from_UMBTTAs in
 neighbor 10.0.0.166 route-map RMap_HiOTTFredrikstad_to_UMBTTAs out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
