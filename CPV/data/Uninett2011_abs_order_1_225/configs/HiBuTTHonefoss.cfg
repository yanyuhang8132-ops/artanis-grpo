!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiBuTTHonefoss
!
!
interface Fa0/1
 ip address 10.0.0.41 255.255.255.254
 description "To HiBUTTKongsberg"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.48 255.255.255.254
 description "To HiAKTTKjeller"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiBuTTHonefoss_from_HiAKTTKjeller deny 10
!
route-map RMap_HiBuTTHonefoss_from_HiBUTTKongsberg deny 10
!
!
!
!
router bgp 230
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.49 remote-as 190
 neighbor 10.0.0.49 description "To HiAKTTKjeller"
 neighbor 10.0.0.49 advertisement-interval 0
 neighbor 10.0.0.49 soft-reconfiguration inbound
 neighbor 10.0.0.49 send-community
 neighbor 10.0.0.49 route-map RMap_HiBuTTHonefoss_from_HiAKTTKjeller in
 neighbor 10.0.0.49 route-map RMap_HiBuTTHonefoss_to_HiAKTTKjeller out
 neighbor 10.0.0.40 remote-as 220
 neighbor 10.0.0.40 description "To HiBUTTKongsberg"
 neighbor 10.0.0.40 advertisement-interval 0
 neighbor 10.0.0.40 soft-reconfiguration inbound
 neighbor 10.0.0.40 send-community
 neighbor 10.0.0.40 route-map RMap_HiBuTTHonefoss_from_HiBUTTKongsberg in
 neighbor 10.0.0.40 route-map RMap_HiBuTTHonefoss_to_HiBUTTKongsberg out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
