!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UiATTKristiansand
!
!
interface Fa0/1
 ip address 10.0.0.33 255.255.255.254
 description "To UiOTTStTTOlavsplassTT5"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.107 255.255.255.254
 description "To UiSTTStavanger"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.160 255.255.255.254
 description "To UiATTGrimstad"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UiATTKristiansand_from_UiATTGrimstad deny 10
!
route-map RMap_UiATTKristiansand_from_UiOTTStTTOlavsplassTT5 deny 10
!
route-map RMap_UiATTKristiansand_from_UiSTTStavanger deny 10
!
!
!
!
!
router bgp 590
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.161 remote-as 580
 neighbor 10.0.0.161 description "To UiATTGrimstad"
 neighbor 10.0.0.161 advertisement-interval 0
 neighbor 10.0.0.161 soft-reconfiguration inbound
 neighbor 10.0.0.161 send-community
 neighbor 10.0.0.161 route-map RMap_UiATTKristiansand_from_UiATTGrimstad in
 neighbor 10.0.0.161 route-map RMap_UiATTKristiansand_to_UiATTGrimstad out
 neighbor 10.0.0.32 remote-as 640
 neighbor 10.0.0.32 description "To UiOTTStTTOlavsplassTT5"
 neighbor 10.0.0.32 advertisement-interval 0
 neighbor 10.0.0.32 soft-reconfiguration inbound
 neighbor 10.0.0.32 send-community
 neighbor 10.0.0.32 route-map RMap_UiATTKristiansand_from_UiOTTStTTOlavsplassTT5 in
 neighbor 10.0.0.32 route-map RMap_UiATTKristiansand_to_UiOTTStTTOlavsplassTT5 out
 neighbor 10.0.0.106 remote-as 650
 neighbor 10.0.0.106 description "To UiSTTStavanger"
 neighbor 10.0.0.106 advertisement-interval 0
 neighbor 10.0.0.106 soft-reconfiguration inbound
 neighbor 10.0.0.106 send-community
 neighbor 10.0.0.106 route-map RMap_UiATTKristiansand_from_UiSTTStavanger in
 neighbor 10.0.0.106 route-map RMap_UiATTKristiansand_to_UiSTTStavanger out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
