!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HSHTTStord
!
!
interface Fa0/0
 ip address 10.0.0.111 255.255.255.254
 description "To HSHTTHaugesund"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.112 255.255.255.254
 description "To UiBTTHoyteklogibygget"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HSHTTStord_from_HSHTTHaugesund deny 10
!
route-map RMap_HSHTTStord_from_UiBTTHoyteklogibygget deny 10
!
!
!
!
router bgp 130
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.110 remote-as 120
 neighbor 10.0.0.110 description "To HSHTTHaugesund"
 neighbor 10.0.0.110 advertisement-interval 0
 neighbor 10.0.0.110 soft-reconfiguration inbound
 neighbor 10.0.0.110 send-community
 neighbor 10.0.0.110 route-map RMap_HSHTTStord_from_HSHTTHaugesund in
 neighbor 10.0.0.110 route-map RMap_HSHTTStord_to_HSHTTHaugesund out
 neighbor 10.0.0.113 remote-as 610
 neighbor 10.0.0.113 description "To UiBTTHoyteklogibygget"
 neighbor 10.0.0.113 advertisement-interval 0
 neighbor 10.0.0.113 soft-reconfiguration inbound
 neighbor 10.0.0.113 send-community
 neighbor 10.0.0.113 route-map RMap_HSHTTStord_from_UiBTTHoyteklogibygget in
 neighbor 10.0.0.113 route-map RMap_HSHTTStord_to_UiBTTHoyteklogibygget out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
