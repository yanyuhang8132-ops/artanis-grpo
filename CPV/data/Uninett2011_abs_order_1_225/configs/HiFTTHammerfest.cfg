!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiFTTHammerfest
!
!
interface Fa1/0
 ip address 10.0.0.89 255.255.255.254
 description "To UiTo"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.152 255.255.255.254
 description "To HiFTTAlta"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.154 255.255.255.254
 description "To HiFTTVadso"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiFTTHammerfest_from_HiFTTAlta deny 10
!
route-map RMap_HiFTTHammerfest_from_HiFTTVadso deny 10
!
route-map RMap_HiFTTHammerfest_from_UiTo deny 10
!
!
!
!
!
router bgp 250
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.153 remote-as 240
 neighbor 10.0.0.153 description "To HiFTTAlta"
 neighbor 10.0.0.153 advertisement-interval 0
 neighbor 10.0.0.153 soft-reconfiguration inbound
 neighbor 10.0.0.153 send-community
 neighbor 10.0.0.153 route-map RMap_HiFTTHammerfest_from_HiFTTAlta in
 neighbor 10.0.0.153 route-map RMap_HiFTTHammerfest_to_HiFTTAlta out
 neighbor 10.0.0.155 remote-as 270
 neighbor 10.0.0.155 description "To HiFTTVadso"
 neighbor 10.0.0.155 advertisement-interval 0
 neighbor 10.0.0.155 soft-reconfiguration inbound
 neighbor 10.0.0.155 send-community
 neighbor 10.0.0.155 route-map RMap_HiFTTHammerfest_from_HiFTTVadso in
 neighbor 10.0.0.155 route-map RMap_HiFTTHammerfest_to_HiFTTVadso out
 neighbor 10.0.0.88 remote-as 660
 neighbor 10.0.0.88 description "To UiTo"
 neighbor 10.0.0.88 advertisement-interval 0
 neighbor 10.0.0.88 soft-reconfiguration inbound
 neighbor 10.0.0.88 send-community
 neighbor 10.0.0.88 route-map RMap_HiFTTHammerfest_from_UiTo in
 neighbor 10.0.0.88 route-map RMap_HiFTTHammerfest_to_UiTo out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
