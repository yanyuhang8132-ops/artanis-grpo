!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HitTTRauland
!
!
interface Fa0/0
 ip address 10.0.0.168 255.255.255.254
 description "To HiTTTBo"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HitTTRauland_from_HiTTTBo deny 10
!
!
!
router bgp 440
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.169 remote-as 400
 neighbor 10.0.0.169 description "To HiTTTBo"
 neighbor 10.0.0.169 advertisement-interval 0
 neighbor 10.0.0.169 soft-reconfiguration inbound
 neighbor 10.0.0.169 send-community
 neighbor 10.0.0.169 route-map RMap_HitTTRauland_from_HiTTTBo in
 neighbor 10.0.0.169 route-map RMap_HitTTRauland_to_HiTTTBo out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
