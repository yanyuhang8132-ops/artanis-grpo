!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HHTTRena
!
!
interface Fa0/1
 ip address 10.0.0.177 255.255.255.254
 description "To HHTTEvenstad"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.190 255.255.255.254
 description "To HHTTElverum"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HHTTRena_from_HHTTElverum deny 10
!
route-map RMap_HHTTRena_from_HHTTEvenstad deny 10
!
!
!
!
router bgp 70
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.191 remote-as 30
 neighbor 10.0.0.191 description "To HHTTElverum"
 neighbor 10.0.0.191 advertisement-interval 0
 neighbor 10.0.0.191 soft-reconfiguration inbound
 neighbor 10.0.0.191 send-community
 neighbor 10.0.0.191 route-map RMap_HHTTRena_from_HHTTElverum in
 neighbor 10.0.0.191 route-map RMap_HHTTRena_to_HHTTElverum out
 neighbor 10.0.0.176 remote-as 40
 neighbor 10.0.0.176 description "To HHTTEvenstad"
 neighbor 10.0.0.176 advertisement-interval 0
 neighbor 10.0.0.176 soft-reconfiguration inbound
 neighbor 10.0.0.176 send-community
 neighbor 10.0.0.176 route-map RMap_HHTTRena_from_HHTTEvenstad in
 neighbor 10.0.0.176 route-map RMap_HHTTRena_to_HHTTEvenstad out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
