!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiNTTTLevanger
!
!
interface Fa0/0
 ip address 10.0.0.129 255.255.255.254
 description "To HiNTTTSteinkjer"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.143 255.255.255.254
 description "To HingTTStjordal"
 speed auto
 duplex auto
!
!
!
ip community-list 2 permit 100:0 100:0 100:0
!
!
!
ip prefix-list IpL_HiNTTTSteinkjer_HiNTTTLevanger_0 seq 10 permit 128.0.0.0/24
!
!
route-map RMap_HiNTTTLevanger_from_HiNTTTSteinkjer permit 10
 match ip address prefix-list IpL_HiNTTTSteinkjer_HiNTTTLevanger_0
 set local-preference 1
 set community 100:0 additive
route-map RMap_HiNTTTLevanger_from_HiNTTTSteinkjer deny 20
!
route-map RMap_HiNTTTLevanger_from_HingTTStjordal permit 10
 match community 2
 set local-preference 1
 set community 100:0 additive
route-map RMap_HiNTTTLevanger_from_HingTTStjordal deny 20
!
route-map RMap_HiNTTTLevanger_to_HiNTTTSteinkjer permit 100
!
!
!
router bgp 320
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.128 remote-as 340
 neighbor 10.0.0.128 description "To HiNTTTSteinkjer"
 neighbor 10.0.0.128 advertisement-interval 0
 neighbor 10.0.0.128 soft-reconfiguration inbound
 neighbor 10.0.0.128 send-community
 neighbor 10.0.0.128 route-map RMap_HiNTTTLevanger_from_HiNTTTSteinkjer in
 neighbor 10.0.0.128 route-map RMap_HiNTTTLevanger_to_HiNTTTSteinkjer out
 neighbor 10.0.0.142 remote-as 430
 neighbor 10.0.0.142 description "To HingTTStjordal"
 neighbor 10.0.0.142 advertisement-interval 0
 neighbor 10.0.0.142 soft-reconfiguration inbound
 neighbor 10.0.0.142 send-community
 neighbor 10.0.0.142 route-map RMap_HiNTTTLevanger_from_HingTTStjordal in
 neighbor 10.0.0.142 route-map RMap_HiNTTTLevanger_to_HingTTStjordal out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
