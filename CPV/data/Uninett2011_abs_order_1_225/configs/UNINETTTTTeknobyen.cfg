!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UNINETTTTTeknobyen
!
!
interface Fa0/1
 ip address 10.0.0.151 255.255.255.254
 description "To HSMTTKristiansun"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.185 255.255.255.254
 description "To NTNUTTHovedbygget"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.187 255.255.255.254
 description "To NTNUTTRealfagbygget"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.188 255.255.255.254
 description "To HHTTTynset"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UNINETTTTTeknobyen_from_HHTTTynset deny 10
!
route-map RMap_UNINETTTTTeknobyen_from_HSMTTKristiansun deny 10
!
route-map RMap_UNINETTTTTeknobyen_from_NTNUTTHovedbygget deny 10
!
route-map RMap_UNINETTTTTeknobyen_from_NTNUTTRealfagbygget deny 10
!
!
!
!
!
!
router bgp 560
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.189 remote-as 80
 neighbor 10.0.0.189 description "To HHTTTynset"
 neighbor 10.0.0.189 advertisement-interval 0
 neighbor 10.0.0.189 soft-reconfiguration inbound
 neighbor 10.0.0.189 send-community
 neighbor 10.0.0.189 route-map RMap_UNINETTTTTeknobyen_from_HHTTTynset in
 neighbor 10.0.0.189 route-map RMap_UNINETTTTTeknobyen_to_HHTTTynset out
 neighbor 10.0.0.150 remote-as 140
 neighbor 10.0.0.150 description "To HSMTTKristiansun"
 neighbor 10.0.0.150 advertisement-interval 0
 neighbor 10.0.0.150 soft-reconfiguration inbound
 neighbor 10.0.0.150 send-community
 neighbor 10.0.0.150 route-map RMap_UNINETTTTTeknobyen_from_HSMTTKristiansun in
 neighbor 10.0.0.150 route-map RMap_UNINETTTTTeknobyen_to_HSMTTKristiansun out
 neighbor 10.0.0.184 remote-as 490
 neighbor 10.0.0.184 description "To NTNUTTHovedbygget"
 neighbor 10.0.0.184 advertisement-interval 0
 neighbor 10.0.0.184 soft-reconfiguration inbound
 neighbor 10.0.0.184 send-community
 neighbor 10.0.0.184 route-map RMap_UNINETTTTTeknobyen_from_NTNUTTHovedbygget in
 neighbor 10.0.0.184 route-map RMap_UNINETTTTTeknobyen_to_NTNUTTHovedbygget out
 neighbor 10.0.0.186 remote-as 500
 neighbor 10.0.0.186 description "To NTNUTTRealfagbygget"
 neighbor 10.0.0.186 advertisement-interval 0
 neighbor 10.0.0.186 soft-reconfiguration inbound
 neighbor 10.0.0.186 send-community
 neighbor 10.0.0.186 route-map RMap_UNINETTTTTeknobyen_from_NTNUTTRealfagbygget in
 neighbor 10.0.0.186 route-map RMap_UNINETTTTTeknobyen_to_NTNUTTRealfagbygget out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
