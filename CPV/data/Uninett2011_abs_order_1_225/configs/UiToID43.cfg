!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UiToID43
!
!
interface Fa0/1
 ip address 10.0.0.81 255.255.255.254
 description "To HiHTTHarstad"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.91 255.255.255.254
 description "To UiTo"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.156 255.255.255.254
 description "To HiFTTAlta"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.158 255.255.255.254
 description "To NTNUTTRealfagbygget"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UiToID43_from_HiFTTAlta deny 10
!
route-map RMap_UiToID43_from_HiHTTHarstad deny 10
!
route-map RMap_UiToID43_from_NTNUTTRealfagbygget deny 10
!
route-map RMap_UiToID43_from_UiTo deny 10
!
!
!
!
!
!
router bgp 670
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.157 remote-as 240
 neighbor 10.0.0.157 description "To HiFTTAlta"
 neighbor 10.0.0.157 advertisement-interval 0
 neighbor 10.0.0.157 soft-reconfiguration inbound
 neighbor 10.0.0.157 send-community
 neighbor 10.0.0.157 route-map RMap_UiToID43_from_HiFTTAlta in
 neighbor 10.0.0.157 route-map RMap_UiToID43_to_HiFTTAlta out
 neighbor 10.0.0.80 remote-as 290
 neighbor 10.0.0.80 description "To HiHTTHarstad"
 neighbor 10.0.0.80 advertisement-interval 0
 neighbor 10.0.0.80 soft-reconfiguration inbound
 neighbor 10.0.0.80 send-community
 neighbor 10.0.0.80 route-map RMap_UiToID43_from_HiHTTHarstad in
 neighbor 10.0.0.80 route-map RMap_UiToID43_to_HiHTTHarstad out
 neighbor 10.0.0.159 remote-as 500
 neighbor 10.0.0.159 description "To NTNUTTRealfagbygget"
 neighbor 10.0.0.159 advertisement-interval 0
 neighbor 10.0.0.159 soft-reconfiguration inbound
 neighbor 10.0.0.159 send-community
 neighbor 10.0.0.159 route-map RMap_UiToID43_from_NTNUTTRealfagbygget in
 neighbor 10.0.0.159 route-map RMap_UiToID43_to_NTNUTTRealfagbygget out
 neighbor 10.0.0.90 remote-as 660
 neighbor 10.0.0.90 description "To UiTo"
 neighbor 10.0.0.90 advertisement-interval 0
 neighbor 10.0.0.90 soft-reconfiguration inbound
 neighbor 10.0.0.90 send-community
 neighbor 10.0.0.90 route-map RMap_UiToID43_from_UiTo in
 neighbor 10.0.0.90 route-map RMap_UiToID43_to_UiTo out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
