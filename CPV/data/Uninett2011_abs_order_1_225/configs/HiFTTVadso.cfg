!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiFTTVadso
!
!
interface Fa0/1
 ip address 10.0.0.139 255.255.255.254
 description "To HiFTTKirkenes"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.155 255.255.255.254
 description "To HiFTTHammerfest"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiFTTVadso_from_HiFTTHammerfest deny 10
!
route-map RMap_HiFTTVadso_from_HiFTTKirkenes deny 10
!
!
!
!
router bgp 270
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.154 remote-as 250
 neighbor 10.0.0.154 description "To HiFTTHammerfest"
 neighbor 10.0.0.154 advertisement-interval 0
 neighbor 10.0.0.154 soft-reconfiguration inbound
 neighbor 10.0.0.154 send-community
 neighbor 10.0.0.154 route-map RMap_HiFTTVadso_from_HiFTTHammerfest in
 neighbor 10.0.0.154 route-map RMap_HiFTTVadso_to_HiFTTHammerfest out
 neighbor 10.0.0.138 remote-as 260
 neighbor 10.0.0.138 description "To HiFTTKirkenes"
 neighbor 10.0.0.138 advertisement-interval 0
 neighbor 10.0.0.138 soft-reconfiguration inbound
 neighbor 10.0.0.138 send-community
 neighbor 10.0.0.138 route-map RMap_HiFTTVadso_from_HiFTTKirkenes in
 neighbor 10.0.0.138 route-map RMap_HiFTTVadso_to_HiFTTKirkenes out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
