!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HHTTHamar
!
!
interface Fa0/0
 ip address 10.0.0.178 255.255.255.254
 description "To HHTTElverum"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.180 255.255.255.254
 description "To HiLTTLillehammer"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HHTTHamar_from_HHTTElverum deny 10
!
route-map RMap_HHTTHamar_from_HiLTTLillehammer deny 10
!
!
!
!
router bgp 50
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.179 remote-as 30
 neighbor 10.0.0.179 description "To HHTTElverum"
 neighbor 10.0.0.179 advertisement-interval 0
 neighbor 10.0.0.179 soft-reconfiguration inbound
 neighbor 10.0.0.179 send-community
 neighbor 10.0.0.179 route-map RMap_HHTTHamar_from_HHTTElverum in
 neighbor 10.0.0.179 route-map RMap_HHTTHamar_to_HHTTElverum out
 neighbor 10.0.0.181 remote-as 300
 neighbor 10.0.0.181 description "To HiLTTLillehammer"
 neighbor 10.0.0.181 advertisement-interval 0
 neighbor 10.0.0.181 soft-reconfiguration inbound
 neighbor 10.0.0.181 send-community
 neighbor 10.0.0.181 route-map RMap_HHTTHamar_from_HiLTTLillehammer in
 neighbor 10.0.0.181 route-map RMap_HHTTHamar_to_HiLTTLillehammer out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
