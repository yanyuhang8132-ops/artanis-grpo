!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiNTTNarvik
!
!
interface Fa1/1
 ip address 10.0.0.68 255.255.255.254
 description "To Stockholm"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.70 255.255.255.254
 description "To NTNUTTHovedbygget"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.72 255.255.255.254
 description "To HiHTTHarstad"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.74 255.255.255.254
 description "To HBOTTBodo"
 speed auto
 duplex auto
!
interface Fa2/0
 ip address 10.0.0.76 255.255.255.254
 description "To UiTo"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiNTTNarvik_from_HBOTTBodo deny 10
!
route-map RMap_HiNTTNarvik_from_HiHTTHarstad deny 10
!
route-map RMap_HiNTTNarvik_from_NTNUTTHovedbygget deny 10
!
route-map RMap_HiNTTNarvik_from_Stockholm deny 10
!
route-map RMap_HiNTTNarvik_from_UiTo deny 10
!
!
!
!
!
!
!
router bgp 310
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.75 remote-as 10
 neighbor 10.0.0.75 description "To HBOTTBodo"
 neighbor 10.0.0.75 advertisement-interval 0
 neighbor 10.0.0.75 soft-reconfiguration inbound
 neighbor 10.0.0.75 send-community
 neighbor 10.0.0.75 route-map RMap_HiNTTNarvik_from_HBOTTBodo in
 neighbor 10.0.0.75 route-map RMap_HiNTTNarvik_to_HBOTTBodo out
 neighbor 10.0.0.73 remote-as 290
 neighbor 10.0.0.73 description "To HiHTTHarstad"
 neighbor 10.0.0.73 advertisement-interval 0
 neighbor 10.0.0.73 soft-reconfiguration inbound
 neighbor 10.0.0.73 send-community
 neighbor 10.0.0.73 route-map RMap_HiNTTNarvik_from_HiHTTHarstad in
 neighbor 10.0.0.73 route-map RMap_HiNTTNarvik_to_HiHTTHarstad out
 neighbor 10.0.0.71 remote-as 490
 neighbor 10.0.0.71 description "To NTNUTTHovedbygget"
 neighbor 10.0.0.71 advertisement-interval 0
 neighbor 10.0.0.71 soft-reconfiguration inbound
 neighbor 10.0.0.71 send-community
 neighbor 10.0.0.71 route-map RMap_HiNTTNarvik_from_NTNUTTHovedbygget in
 neighbor 10.0.0.71 route-map RMap_HiNTTNarvik_to_NTNUTTHovedbygget out
 neighbor 10.0.0.69 remote-as 530
 neighbor 10.0.0.69 description "To Stockholm"
 neighbor 10.0.0.69 advertisement-interval 0
 neighbor 10.0.0.69 soft-reconfiguration inbound
 neighbor 10.0.0.69 send-community
 neighbor 10.0.0.69 route-map RMap_HiNTTNarvik_from_Stockholm in
 neighbor 10.0.0.69 route-map RMap_HiNTTNarvik_to_Stockholm out
 neighbor 10.0.0.77 remote-as 660
 neighbor 10.0.0.77 description "To UiTo"
 neighbor 10.0.0.77 advertisement-interval 0
 neighbor 10.0.0.77 soft-reconfiguration inbound
 neighbor 10.0.0.77 send-community
 neighbor 10.0.0.77 route-map RMap_HiNTTNarvik_from_UiTo in
 neighbor 10.0.0.77 route-map RMap_HiNTTNarvik_to_UiTo out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
