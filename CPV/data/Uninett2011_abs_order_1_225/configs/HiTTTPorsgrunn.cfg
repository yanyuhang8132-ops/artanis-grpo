!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiTTTPorsgrunn
!
!
interface Fa0/1
 ip address 10.0.0.163 255.255.255.254
 description "To UiATTGrimstad"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.170 255.255.255.254
 description "To HiTTTBo"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiTTTPorsgrunn_from_HiTTTBo deny 10
!
route-map RMap_HiTTTPorsgrunn_from_UiATTGrimstad deny 10
!
!
!
!
router bgp 420
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.171 remote-as 400
 neighbor 10.0.0.171 description "To HiTTTBo"
 neighbor 10.0.0.171 advertisement-interval 0
 neighbor 10.0.0.171 soft-reconfiguration inbound
 neighbor 10.0.0.171 send-community
 neighbor 10.0.0.171 route-map RMap_HiTTTPorsgrunn_from_HiTTTBo in
 neighbor 10.0.0.171 route-map RMap_HiTTTPorsgrunn_to_HiTTTBo out
 neighbor 10.0.0.162 remote-as 580
 neighbor 10.0.0.162 description "To UiATTGrimstad"
 neighbor 10.0.0.162 advertisement-interval 0
 neighbor 10.0.0.162 soft-reconfiguration inbound
 neighbor 10.0.0.162 send-community
 neighbor 10.0.0.162 route-map RMap_HiTTTPorsgrunn_from_UiATTGrimstad in
 neighbor 10.0.0.162 route-map RMap_HiTTTPorsgrunn_to_UiATTGrimstad out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
