!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiFTTAlta
!
!
interface Fa0/1
 ip address 10.0.0.137 255.255.255.254
 description "To SA_SHTTKautokeino"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.153 255.255.255.254
 description "To HiFTTHammerfest"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.157 255.255.255.254
 description "To UiToID43"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiFTTAlta_from_HiFTTHammerfest deny 10
!
route-map RMap_HiFTTAlta_from_SA_SHTTKautokeino deny 10
!
route-map RMap_HiFTTAlta_from_UiToID43 deny 10
!
!
!
!
!
router bgp 240
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.152 remote-as 250
 neighbor 10.0.0.152 description "To HiFTTHammerfest"
 neighbor 10.0.0.152 advertisement-interval 0
 neighbor 10.0.0.152 soft-reconfiguration inbound
 neighbor 10.0.0.152 send-community
 neighbor 10.0.0.152 route-map RMap_HiFTTAlta_from_HiFTTHammerfest in
 neighbor 10.0.0.152 route-map RMap_HiFTTAlta_to_HiFTTHammerfest out
 neighbor 10.0.0.136 remote-as 520
 neighbor 10.0.0.136 description "To SA_SHTTKautokeino"
 neighbor 10.0.0.136 advertisement-interval 0
 neighbor 10.0.0.136 soft-reconfiguration inbound
 neighbor 10.0.0.136 send-community
 neighbor 10.0.0.136 route-map RMap_HiFTTAlta_from_SA_SHTTKautokeino in
 neighbor 10.0.0.136 route-map RMap_HiFTTAlta_to_SA_SHTTKautokeino out
 neighbor 10.0.0.156 remote-as 670
 neighbor 10.0.0.156 description "To UiToID43"
 neighbor 10.0.0.156 advertisement-interval 0
 neighbor 10.0.0.156 soft-reconfiguration inbound
 neighbor 10.0.0.156 send-community
 neighbor 10.0.0.156 route-map RMap_HiFTTAlta_from_UiToID43 in
 neighbor 10.0.0.156 route-map RMap_HiFTTAlta_to_UiToID43 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
