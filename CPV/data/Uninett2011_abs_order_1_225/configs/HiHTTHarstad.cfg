!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiHTTHarstad
!
!
interface Fa0/1
 ip address 10.0.0.73 255.255.255.254
 description "To HiNTTNarvik"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.78 255.255.255.254
 description "To UNISTTSvalbard"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.80 255.255.255.254
 description "To UiToID43"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.82 255.255.255.254
 description "To HBOTTBodo"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiHTTHarstad_from_HBOTTBodo deny 10
!
route-map RMap_HiHTTHarstad_from_HiNTTNarvik deny 10
!
route-map RMap_HiHTTHarstad_from_UNISTTSvalbard deny 10
!
route-map RMap_HiHTTHarstad_from_UiToID43 deny 10
!
!
!
!
!
!
router bgp 290
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.83 remote-as 10
 neighbor 10.0.0.83 description "To HBOTTBodo"
 neighbor 10.0.0.83 advertisement-interval 0
 neighbor 10.0.0.83 soft-reconfiguration inbound
 neighbor 10.0.0.83 send-community
 neighbor 10.0.0.83 route-map RMap_HiHTTHarstad_from_HBOTTBodo in
 neighbor 10.0.0.83 route-map RMap_HiHTTHarstad_to_HBOTTBodo out
 neighbor 10.0.0.72 remote-as 310
 neighbor 10.0.0.72 description "To HiNTTNarvik"
 neighbor 10.0.0.72 advertisement-interval 0
 neighbor 10.0.0.72 soft-reconfiguration inbound
 neighbor 10.0.0.72 send-community
 neighbor 10.0.0.72 route-map RMap_HiHTTHarstad_from_HiNTTNarvik in
 neighbor 10.0.0.72 route-map RMap_HiHTTHarstad_to_HiNTTNarvik out
 neighbor 10.0.0.79 remote-as 570
 neighbor 10.0.0.79 description "To UNISTTSvalbard"
 neighbor 10.0.0.79 advertisement-interval 0
 neighbor 10.0.0.79 soft-reconfiguration inbound
 neighbor 10.0.0.79 send-community
 neighbor 10.0.0.79 route-map RMap_HiHTTHarstad_from_UNISTTSvalbard in
 neighbor 10.0.0.79 route-map RMap_HiHTTHarstad_to_UNISTTSvalbard out
 neighbor 10.0.0.81 remote-as 670
 neighbor 10.0.0.81 description "To UiToID43"
 neighbor 10.0.0.81 advertisement-interval 0
 neighbor 10.0.0.81 soft-reconfiguration inbound
 neighbor 10.0.0.81 send-community
 neighbor 10.0.0.81 route-map RMap_HiHTTHarstad_from_UiToID43 in
 neighbor 10.0.0.81 route-map RMap_HiHTTHarstad_to_UiToID43 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
