!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UiATTGrimstad
!
!
interface Fa0/1
 ip address 10.0.0.161 255.255.255.254
 description "To UiATTKristiansand"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.162 255.255.255.254
 description "To HiTTTPorsgrunn"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UiATTGrimstad_from_HiTTTPorsgrunn deny 10
!
route-map RMap_UiATTGrimstad_from_UiATTKristiansand deny 10
!
!
!
!
router bgp 580
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.163 remote-as 420
 neighbor 10.0.0.163 description "To HiTTTPorsgrunn"
 neighbor 10.0.0.163 advertisement-interval 0
 neighbor 10.0.0.163 soft-reconfiguration inbound
 neighbor 10.0.0.163 send-community
 neighbor 10.0.0.163 route-map RMap_UiATTGrimstad_from_HiTTTPorsgrunn in
 neighbor 10.0.0.163 route-map RMap_UiATTGrimstad_to_HiTTTPorsgrunn out
 neighbor 10.0.0.160 remote-as 590
 neighbor 10.0.0.160 description "To UiATTKristiansand"
 neighbor 10.0.0.160 advertisement-interval 0
 neighbor 10.0.0.160 soft-reconfiguration inbound
 neighbor 10.0.0.160 send-community
 neighbor 10.0.0.160 route-map RMap_UiATTGrimstad_from_UiATTKristiansand in
 neighbor 10.0.0.160 route-map RMap_UiATTGrimstad_to_UiATTKristiansand out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
