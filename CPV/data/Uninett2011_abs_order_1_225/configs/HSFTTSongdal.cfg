!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HSFTTSongdal
!
!
interface Fa0/1
 ip address 10.0.0.117 255.255.255.254
 description "To UiBTTHoyteklogibygget"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.120 255.255.255.254
 description "To HSFTTForde"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HSFTTSongdal_from_HSFTTForde deny 10
!
route-map RMap_HSFTTSongdal_from_UiBTTHoyteklogibygget deny 10
!
!
!
!
router bgp 110
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.121 remote-as 90
 neighbor 10.0.0.121 description "To HSFTTForde"
 neighbor 10.0.0.121 advertisement-interval 0
 neighbor 10.0.0.121 soft-reconfiguration inbound
 neighbor 10.0.0.121 send-community
 neighbor 10.0.0.121 route-map RMap_HSFTTSongdal_from_HSFTTForde in
 neighbor 10.0.0.121 route-map RMap_HSFTTSongdal_to_HSFTTForde out
 neighbor 10.0.0.116 remote-as 610
 neighbor 10.0.0.116 description "To UiBTTHoyteklogibygget"
 neighbor 10.0.0.116 advertisement-interval 0
 neighbor 10.0.0.116 soft-reconfiguration inbound
 neighbor 10.0.0.116 send-community
 neighbor 10.0.0.116 route-map RMap_HSFTTSongdal_from_UiBTTHoyteklogibygget in
 neighbor 10.0.0.116 route-map RMap_HSFTTSongdal_to_UiBTTHoyteklogibygget out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
