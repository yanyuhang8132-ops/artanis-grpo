!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HSFTTForde
!
!
interface Fa1/0
 ip address 10.0.0.101 255.255.255.254
 description "To HVOTTVolda"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.121 255.255.255.254
 description "To HSFTTSongdal"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.122 255.255.255.254
 description "To HSFTTSandane"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HSFTTForde_from_HSFTTSandane deny 10
!
route-map RMap_HSFTTForde_from_HSFTTSongdal deny 10
!
route-map RMap_HSFTTForde_from_HVOTTVolda deny 10
!
!
!
!
!
router bgp 90
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.123 remote-as 100
 neighbor 10.0.0.123 description "To HSFTTSandane"
 neighbor 10.0.0.123 advertisement-interval 0
 neighbor 10.0.0.123 soft-reconfiguration inbound
 neighbor 10.0.0.123 send-community
 neighbor 10.0.0.123 route-map RMap_HSFTTForde_from_HSFTTSandane in
 neighbor 10.0.0.123 route-map RMap_HSFTTForde_to_HSFTTSandane out
 neighbor 10.0.0.120 remote-as 110
 neighbor 10.0.0.120 description "To HSFTTSongdal"
 neighbor 10.0.0.120 advertisement-interval 0
 neighbor 10.0.0.120 soft-reconfiguration inbound
 neighbor 10.0.0.120 send-community
 neighbor 10.0.0.120 route-map RMap_HSFTTForde_from_HSFTTSongdal in
 neighbor 10.0.0.120 route-map RMap_HSFTTForde_to_HSFTTSongdal out
 neighbor 10.0.0.100 remote-as 180
 neighbor 10.0.0.100 description "To HVOTTVolda"
 neighbor 10.0.0.100 advertisement-interval 0
 neighbor 10.0.0.100 soft-reconfiguration inbound
 neighbor 10.0.0.100 send-community
 neighbor 10.0.0.100 route-map RMap_HSFTTForde_from_HVOTTVolda in
 neighbor 10.0.0.100 route-map RMap_HSFTTForde_to_HVOTTVolda out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
