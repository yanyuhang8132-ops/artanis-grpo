!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiAKTTKjeller
!
!
interface Fa0/1
 ip address 10.0.0.47 255.255.255.254
 description "To UNIKTTKjeller"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.49 255.255.255.254
 description "To HiBuTTHonefoss"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiAKTTKjeller_from_HiBuTTHonefoss deny 10
!
route-map RMap_HiAKTTKjeller_from_UNIKTTKjeller deny 10
!
!
!
!
router bgp 190
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.48 remote-as 230
 neighbor 10.0.0.48 description "To HiBuTTHonefoss"
 neighbor 10.0.0.48 advertisement-interval 0
 neighbor 10.0.0.48 soft-reconfiguration inbound
 neighbor 10.0.0.48 send-community
 neighbor 10.0.0.48 route-map RMap_HiAKTTKjeller_from_HiBuTTHonefoss in
 neighbor 10.0.0.48 route-map RMap_HiAKTTKjeller_to_HiBuTTHonefoss out
 neighbor 10.0.0.46 remote-as 550
 neighbor 10.0.0.46 description "To UNIKTTKjeller"
 neighbor 10.0.0.46 advertisement-interval 0
 neighbor 10.0.0.46 soft-reconfiguration inbound
 neighbor 10.0.0.46 send-community
 neighbor 10.0.0.46 route-map RMap_HiAKTTKjeller_from_UNIKTTKjeller in
 neighbor 10.0.0.46 route-map RMap_HiAKTTKjeller_to_UNIKTTKjeller out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
