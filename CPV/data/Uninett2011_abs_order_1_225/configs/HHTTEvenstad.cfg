!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HHTTEvenstad
!
!
interface Fa0/1
 ip address 10.0.0.174 255.255.255.254
 description "To HHTTTynset"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.176 255.255.255.254
 description "To HHTTRena"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HHTTEvenstad_from_HHTTRena deny 10
!
route-map RMap_HHTTEvenstad_from_HHTTTynset deny 10
!
!
!
!
router bgp 40
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.177 remote-as 70
 neighbor 10.0.0.177 description "To HHTTRena"
 neighbor 10.0.0.177 advertisement-interval 0
 neighbor 10.0.0.177 soft-reconfiguration inbound
 neighbor 10.0.0.177 send-community
 neighbor 10.0.0.177 route-map RMap_HHTTEvenstad_from_HHTTRena in
 neighbor 10.0.0.177 route-map RMap_HHTTEvenstad_to_HHTTRena out
 neighbor 10.0.0.175 remote-as 80
 neighbor 10.0.0.175 description "To HHTTTynset"
 neighbor 10.0.0.175 advertisement-interval 0
 neighbor 10.0.0.175 soft-reconfiguration inbound
 neighbor 10.0.0.175 send-community
 neighbor 10.0.0.175 route-map RMap_HHTTEvenstad_from_HHTTTynset in
 neighbor 10.0.0.175 route-map RMap_HHTTEvenstad_to_HHTTTynset out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
