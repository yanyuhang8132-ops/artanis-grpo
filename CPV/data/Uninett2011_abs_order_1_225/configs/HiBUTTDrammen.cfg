!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiBUTTDrammen
!
!
interface Fa1/1
 ip address 10.0.0.29 255.255.255.254
 description "To UiOTTStTTOlavsplassTT5"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.39 255.255.255.254
 description "To HiBUTTKongsberg"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.42 255.255.255.254
 description "To HVETTBorre"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.44 255.255.255.254
 description "To HiTTTBo"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiBUTTDrammen_from_HVETTBorre deny 10
!
route-map RMap_HiBUTTDrammen_from_HiBUTTKongsberg deny 10
!
route-map RMap_HiBUTTDrammen_from_HiTTTBo deny 10
!
route-map RMap_HiBUTTDrammen_from_UiOTTStTTOlavsplassTT5 deny 10
!
!
!
!
!
!
router bgp 210
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.43 remote-as 160
 neighbor 10.0.0.43 description "To HVETTBorre"
 neighbor 10.0.0.43 advertisement-interval 0
 neighbor 10.0.0.43 soft-reconfiguration inbound
 neighbor 10.0.0.43 send-community
 neighbor 10.0.0.43 route-map RMap_HiBUTTDrammen_from_HVETTBorre in
 neighbor 10.0.0.43 route-map RMap_HiBUTTDrammen_to_HVETTBorre out
 neighbor 10.0.0.38 remote-as 220
 neighbor 10.0.0.38 description "To HiBUTTKongsberg"
 neighbor 10.0.0.38 advertisement-interval 0
 neighbor 10.0.0.38 soft-reconfiguration inbound
 neighbor 10.0.0.38 send-community
 neighbor 10.0.0.38 route-map RMap_HiBUTTDrammen_from_HiBUTTKongsberg in
 neighbor 10.0.0.38 route-map RMap_HiBUTTDrammen_to_HiBUTTKongsberg out
 neighbor 10.0.0.45 remote-as 400
 neighbor 10.0.0.45 description "To HiTTTBo"
 neighbor 10.0.0.45 advertisement-interval 0
 neighbor 10.0.0.45 soft-reconfiguration inbound
 neighbor 10.0.0.45 send-community
 neighbor 10.0.0.45 route-map RMap_HiBUTTDrammen_from_HiTTTBo in
 neighbor 10.0.0.45 route-map RMap_HiBUTTDrammen_to_HiTTTBo out
 neighbor 10.0.0.28 remote-as 640
 neighbor 10.0.0.28 description "To UiOTTStTTOlavsplassTT5"
 neighbor 10.0.0.28 advertisement-interval 0
 neighbor 10.0.0.28 soft-reconfiguration inbound
 neighbor 10.0.0.28 send-community
 neighbor 10.0.0.28 route-map RMap_HiBUTTDrammen_from_UiOTTStTTOlavsplassTT5 in
 neighbor 10.0.0.28 route-map RMap_HiBUTTDrammen_to_UiOTTStTTOlavsplassTT5 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
