!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiNeTTNesna
!
!
interface Fa0/1
 ip address 10.0.0.57 255.255.255.254
 description "To NBTTMoTTiTTRana"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.62 255.255.255.254
 description "To HiNeTTSandnesjoen"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiNeTTNesna_from_HiNeTTSandnesjoen deny 10
!
route-map RMap_HiNeTTNesna_from_NBTTMoTTiTTRana deny 10
!
!
!
!
router bgp 360
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.63 remote-as 370
 neighbor 10.0.0.63 description "To HiNeTTSandnesjoen"
 neighbor 10.0.0.63 advertisement-interval 0
 neighbor 10.0.0.63 soft-reconfiguration inbound
 neighbor 10.0.0.63 send-community
 neighbor 10.0.0.63 route-map RMap_HiNeTTNesna_from_HiNeTTSandnesjoen in
 neighbor 10.0.0.63 route-map RMap_HiNeTTNesna_to_HiNeTTSandnesjoen out
 neighbor 10.0.0.56 remote-as 450
 neighbor 10.0.0.56 description "To NBTTMoTTiTTRana"
 neighbor 10.0.0.56 advertisement-interval 0
 neighbor 10.0.0.56 soft-reconfiguration inbound
 neighbor 10.0.0.56 send-community
 neighbor 10.0.0.56 route-map RMap_HiNeTTNesna_from_NBTTMoTTiTTRana in
 neighbor 10.0.0.56 route-map RMap_HiNeTTNesna_to_NBTTMoTTiTTRana out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
