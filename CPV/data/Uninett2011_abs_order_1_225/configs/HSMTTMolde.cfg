!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HSMTTMolde
!
!
interface Fa0/1
 ip address 10.0.0.99 255.255.255.254
 description "To HiATTAlesund"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.148 255.255.255.254
 description "To HSMTTKristiansun"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HSMTTMolde_from_HSMTTKristiansun deny 10
!
route-map RMap_HSMTTMolde_from_HiATTAlesund deny 10
!
!
!
!
router bgp 150
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.149 remote-as 140
 neighbor 10.0.0.149 description "To HSMTTKristiansun"
 neighbor 10.0.0.149 advertisement-interval 0
 neighbor 10.0.0.149 soft-reconfiguration inbound
 neighbor 10.0.0.149 send-community
 neighbor 10.0.0.149 route-map RMap_HSMTTMolde_from_HSMTTKristiansun in
 neighbor 10.0.0.149 route-map RMap_HSMTTMolde_to_HSMTTKristiansun out
 neighbor 10.0.0.98 remote-as 200
 neighbor 10.0.0.98 description "To HiATTAlesund"
 neighbor 10.0.0.98 advertisement-interval 0
 neighbor 10.0.0.98 soft-reconfiguration inbound
 neighbor 10.0.0.98 send-community
 neighbor 10.0.0.98 route-map RMap_HSMTTMolde_from_HiATTAlesund in
 neighbor 10.0.0.98 route-map RMap_HSMTTMolde_to_HiATTAlesund out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
