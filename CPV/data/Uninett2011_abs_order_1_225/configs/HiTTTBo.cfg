!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiTTTBo
!
!
interface Fa2/0
 ip address 10.0.0.9 255.255.255.254
 description "To UiO"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.45 255.255.255.254
 description "To HiBUTTDrammen"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.169 255.255.255.254
 description "To HitTTRauland"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.171 255.255.255.254
 description "To HiTTTPorsgrunn"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.172 255.255.255.254
 description "To HiTTTNotodden"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiTTTBo_from_HiBUTTDrammen deny 10
!
route-map RMap_HiTTTBo_from_HiTTTNotodden deny 10
!
route-map RMap_HiTTTBo_from_HiTTTPorsgrunn deny 10
!
route-map RMap_HiTTTBo_from_HitTTRauland deny 10
!
route-map RMap_HiTTTBo_from_UiO deny 10
!
!
!
!
!
!
!
router bgp 400
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.44 remote-as 210
 neighbor 10.0.0.44 description "To HiBUTTDrammen"
 neighbor 10.0.0.44 advertisement-interval 0
 neighbor 10.0.0.44 soft-reconfiguration inbound
 neighbor 10.0.0.44 send-community
 neighbor 10.0.0.44 route-map RMap_HiTTTBo_from_HiBUTTDrammen in
 neighbor 10.0.0.44 route-map RMap_HiTTTBo_to_HiBUTTDrammen out
 neighbor 10.0.0.173 remote-as 410
 neighbor 10.0.0.173 description "To HiTTTNotodden"
 neighbor 10.0.0.173 advertisement-interval 0
 neighbor 10.0.0.173 soft-reconfiguration inbound
 neighbor 10.0.0.173 send-community
 neighbor 10.0.0.173 route-map RMap_HiTTTBo_from_HiTTTNotodden in
 neighbor 10.0.0.173 route-map RMap_HiTTTBo_to_HiTTTNotodden out
 neighbor 10.0.0.170 remote-as 420
 neighbor 10.0.0.170 description "To HiTTTPorsgrunn"
 neighbor 10.0.0.170 advertisement-interval 0
 neighbor 10.0.0.170 soft-reconfiguration inbound
 neighbor 10.0.0.170 send-community
 neighbor 10.0.0.170 route-map RMap_HiTTTBo_from_HiTTTPorsgrunn in
 neighbor 10.0.0.170 route-map RMap_HiTTTBo_to_HiTTTPorsgrunn out
 neighbor 10.0.0.168 remote-as 440
 neighbor 10.0.0.168 description "To HitTTRauland"
 neighbor 10.0.0.168 advertisement-interval 0
 neighbor 10.0.0.168 soft-reconfiguration inbound
 neighbor 10.0.0.168 send-community
 neighbor 10.0.0.168 route-map RMap_HiTTTBo_from_HitTTRauland in
 neighbor 10.0.0.168 route-map RMap_HiTTTBo_to_HitTTRauland out
 neighbor 10.0.0.8 remote-as 620
 neighbor 10.0.0.8 description "To UiO"
 neighbor 10.0.0.8 advertisement-interval 0
 neighbor 10.0.0.8 soft-reconfiguration inbound
 neighbor 10.0.0.8 send-community
 neighbor 10.0.0.8 route-map RMap_HiTTTBo_from_UiO in
 neighbor 10.0.0.8 route-map RMap_HiTTTBo_to_UiO out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
