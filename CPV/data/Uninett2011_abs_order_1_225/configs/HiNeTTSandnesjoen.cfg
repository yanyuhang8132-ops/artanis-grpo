!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiNeTTSandnesjoen
!
!
interface Fa0/1
 ip address 10.0.0.63 255.255.255.254
 description "To HiNeTTNesna"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.124 255.255.255.254
 description "To NTNUTTHovedbygget"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.126 255.255.255.254
 description "To HBOTTBodo"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiNeTTSandnesjoen_from_HBOTTBodo deny 10
!
route-map RMap_HiNeTTSandnesjoen_from_HiNeTTNesna deny 10
!
route-map RMap_HiNeTTSandnesjoen_from_NTNUTTHovedbygget deny 10
!
!
!
!
!
router bgp 370
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.127 remote-as 10
 neighbor 10.0.0.127 description "To HBOTTBodo"
 neighbor 10.0.0.127 advertisement-interval 0
 neighbor 10.0.0.127 soft-reconfiguration inbound
 neighbor 10.0.0.127 send-community
 neighbor 10.0.0.127 route-map RMap_HiNeTTSandnesjoen_from_HBOTTBodo in
 neighbor 10.0.0.127 route-map RMap_HiNeTTSandnesjoen_to_HBOTTBodo out
 neighbor 10.0.0.62 remote-as 360
 neighbor 10.0.0.62 description "To HiNeTTNesna"
 neighbor 10.0.0.62 advertisement-interval 0
 neighbor 10.0.0.62 soft-reconfiguration inbound
 neighbor 10.0.0.62 send-community
 neighbor 10.0.0.62 route-map RMap_HiNeTTSandnesjoen_from_HiNeTTNesna in
 neighbor 10.0.0.62 route-map RMap_HiNeTTSandnesjoen_to_HiNeTTNesna out
 neighbor 10.0.0.125 remote-as 490
 neighbor 10.0.0.125 description "To NTNUTTHovedbygget"
 neighbor 10.0.0.125 advertisement-interval 0
 neighbor 10.0.0.125 soft-reconfiguration inbound
 neighbor 10.0.0.125 send-community
 neighbor 10.0.0.125 route-map RMap_HiNeTTSandnesjoen_from_NTNUTTHovedbygget in
 neighbor 10.0.0.125 route-map RMap_HiNeTTSandnesjoen_to_NTNUTTHovedbygget out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
