!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HSMTTKristiansun
!
!
interface Fa0/0
 ip address 10.0.0.149 255.255.255.254
 description "To HSMTTMolde"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.150 255.255.255.254
 description "To UNINETTTTTeknobyen"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HSMTTKristiansun_from_HSMTTMolde deny 10
!
route-map RMap_HSMTTKristiansun_from_UNINETTTTTeknobyen deny 10
!
!
!
!
router bgp 140
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.148 remote-as 150
 neighbor 10.0.0.148 description "To HSMTTMolde"
 neighbor 10.0.0.148 advertisement-interval 0
 neighbor 10.0.0.148 soft-reconfiguration inbound
 neighbor 10.0.0.148 send-community
 neighbor 10.0.0.148 route-map RMap_HSMTTKristiansun_from_HSMTTMolde in
 neighbor 10.0.0.148 route-map RMap_HSMTTKristiansun_to_HSMTTMolde out
 neighbor 10.0.0.151 remote-as 560
 neighbor 10.0.0.151 description "To UNINETTTTTeknobyen"
 neighbor 10.0.0.151 advertisement-interval 0
 neighbor 10.0.0.151 soft-reconfiguration inbound
 neighbor 10.0.0.151 send-community
 neighbor 10.0.0.151 route-map RMap_HSMTTKristiansun_from_UNINETTTTTeknobyen in
 neighbor 10.0.0.151 route-map RMap_HSMTTKristiansun_to_UNINETTTTTeknobyen out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
