!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UiSTTStavanger
!
!
interface Fa1/1
 ip address 10.0.0.102 255.255.255.254
 description "To VetHSTTSandnes"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.104 255.255.255.254
 description "To HSHTTHaugesund"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.106 255.255.255.254
 description "To UiATTKristiansand"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.108 255.255.255.254
 description "To UiBTTBT"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UiSTTStavanger_from_HSHTTHaugesund deny 10
!
route-map RMap_UiSTTStavanger_from_UiATTKristiansand deny 10
!
route-map RMap_UiSTTStavanger_from_UiBTTBT deny 10
!
route-map RMap_UiSTTStavanger_from_VetHSTTSandnes deny 10
!
!
!
!
!
!
router bgp 650
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.105 remote-as 120
 neighbor 10.0.0.105 description "To HSHTTHaugesund"
 neighbor 10.0.0.105 advertisement-interval 0
 neighbor 10.0.0.105 soft-reconfiguration inbound
 neighbor 10.0.0.105 send-community
 neighbor 10.0.0.105 route-map RMap_UiSTTStavanger_from_HSHTTHaugesund in
 neighbor 10.0.0.105 route-map RMap_UiSTTStavanger_to_HSHTTHaugesund out
 neighbor 10.0.0.107 remote-as 590
 neighbor 10.0.0.107 description "To UiATTKristiansand"
 neighbor 10.0.0.107 advertisement-interval 0
 neighbor 10.0.0.107 soft-reconfiguration inbound
 neighbor 10.0.0.107 send-community
 neighbor 10.0.0.107 route-map RMap_UiSTTStavanger_from_UiATTKristiansand in
 neighbor 10.0.0.107 route-map RMap_UiSTTStavanger_to_UiATTKristiansand out
 neighbor 10.0.0.109 remote-as 600
 neighbor 10.0.0.109 description "To UiBTTBT"
 neighbor 10.0.0.109 advertisement-interval 0
 neighbor 10.0.0.109 soft-reconfiguration inbound
 neighbor 10.0.0.109 send-community
 neighbor 10.0.0.109 route-map RMap_UiSTTStavanger_from_UiBTTBT in
 neighbor 10.0.0.109 route-map RMap_UiSTTStavanger_to_UiBTTBT out
 neighbor 10.0.0.103 remote-as 690
 neighbor 10.0.0.103 description "To VetHSTTSandnes"
 neighbor 10.0.0.103 advertisement-interval 0
 neighbor 10.0.0.103 soft-reconfiguration inbound
 neighbor 10.0.0.103 send-community
 neighbor 10.0.0.103 route-map RMap_UiSTTStavanger_from_VetHSTTSandnes in
 neighbor 10.0.0.103 route-map RMap_UiSTTStavanger_to_VetHSTTSandnes out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
