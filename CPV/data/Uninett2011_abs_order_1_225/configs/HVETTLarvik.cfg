!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HVETTLarvik
!
!
interface Fa0/0
 ip address 10.0.0.67 255.255.255.254
 description "To HVETTBorre"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HVETTLarvik_from_HVETTBorre deny 10
!
!
!
router bgp 170
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.66 remote-as 160
 neighbor 10.0.0.66 description "To HVETTBorre"
 neighbor 10.0.0.66 advertisement-interval 0
 neighbor 10.0.0.66 soft-reconfiguration inbound
 neighbor 10.0.0.66 send-community
 neighbor 10.0.0.66 route-map RMap_HVETTLarvik_from_HVETTBorre in
 neighbor 10.0.0.66 route-map RMap_HVETTLarvik_to_HVETTBorre out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
