!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HingTTStjordal
!
!
interface Fa0/0
 ip address 10.0.0.142 255.255.255.254
 description "To HiNTTTLevanger"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.144 255.255.255.254
 description "To NTNUTTRealfagbygget"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.146 255.255.255.254
 description "To PeerHingTTStjordal_0"
 speed auto
 duplex auto
!
!
!
!
!
!
!
route-map RMap_External_HingTTStjordal_from_PeerHingTTStjordal_0 permit 10
 set community 100:0 additive
 set local-preference 1
!
route-map RMap_HingTTStjordal_from_HiNTTTLevanger deny 10
!
route-map RMap_HingTTStjordal_from_NTNUTTRealfagbygget deny 10
!
route-map RMap_HingTTStjordal_to_HiNTTTLevanger permit 100
!
route-map RMap_HingTTStjordal_to_NTNUTTRealfagbygget permit 100
!
!
!
router bgp 430
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.143 remote-as 320
 neighbor 10.0.0.143 description "To HiNTTTLevanger"
 neighbor 10.0.0.143 advertisement-interval 0
 neighbor 10.0.0.143 soft-reconfiguration inbound
 neighbor 10.0.0.143 send-community
 neighbor 10.0.0.143 route-map RMap_HingTTStjordal_from_HiNTTTLevanger in
 neighbor 10.0.0.143 route-map RMap_HingTTStjordal_to_HiNTTTLevanger out
 neighbor 10.0.0.145 remote-as 500
 neighbor 10.0.0.145 description "To NTNUTTRealfagbygget"
 neighbor 10.0.0.145 advertisement-interval 0
 neighbor 10.0.0.145 soft-reconfiguration inbound
 neighbor 10.0.0.145 send-community
 neighbor 10.0.0.145 route-map RMap_HingTTStjordal_from_NTNUTTRealfagbygget in
 neighbor 10.0.0.145 route-map RMap_HingTTStjordal_to_NTNUTTRealfagbygget out
 neighbor 10.0.0.147 remote-as 10010
 neighbor 10.0.0.147 description "To PeerHingTTStjordal_0"
 neighbor 10.0.0.147 advertisement-interval 0
 neighbor 10.0.0.147 soft-reconfiguration inbound
 neighbor 10.0.0.147 send-community
 neighbor 10.0.0.147 route-map RMap_External_HingTTStjordal_from_PeerHingTTStjordal_0 in
 neighbor 10.0.0.147 route-map RMap_HingTTStjordal_to_PeerHingTTStjordal_0 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
