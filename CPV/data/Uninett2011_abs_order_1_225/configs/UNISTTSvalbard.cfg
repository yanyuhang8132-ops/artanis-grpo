!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UNISTTSvalbard
!
!
interface Fa0/0
 ip address 10.0.0.79 255.255.255.254
 description "To HiHTTHarstad"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.141 255.255.255.254
 description "To NyAlesund"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UNISTTSvalbard_from_HiHTTHarstad deny 10
!
route-map RMap_UNISTTSvalbard_from_NyAlesund deny 10
!
!
!
!
router bgp 570
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.78 remote-as 290
 neighbor 10.0.0.78 description "To HiHTTHarstad"
 neighbor 10.0.0.78 advertisement-interval 0
 neighbor 10.0.0.78 soft-reconfiguration inbound
 neighbor 10.0.0.78 send-community
 neighbor 10.0.0.78 route-map RMap_UNISTTSvalbard_from_HiHTTHarstad in
 neighbor 10.0.0.78 route-map RMap_UNISTTSvalbard_to_HiHTTHarstad out
 neighbor 10.0.0.140 remote-as 510
 neighbor 10.0.0.140 description "To NyAlesund"
 neighbor 10.0.0.140 advertisement-interval 0
 neighbor 10.0.0.140 soft-reconfiguration inbound
 neighbor 10.0.0.140 send-community
 neighbor 10.0.0.140 route-map RMap_UNISTTSvalbard_from_NyAlesund in
 neighbor 10.0.0.140 route-map RMap_UNISTTSvalbard_to_NyAlesund out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
