!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HVOTTVolda
!
!
interface Fa0/1
 ip address 10.0.0.93 255.255.255.254
 description "To HiATTAlesund"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.100 255.255.255.254
 description "To HSFTTForde"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HVOTTVolda_from_HSFTTForde deny 10
!
route-map RMap_HVOTTVolda_from_HiATTAlesund deny 10
!
!
!
!
router bgp 180
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.101 remote-as 90
 neighbor 10.0.0.101 description "To HSFTTForde"
 neighbor 10.0.0.101 advertisement-interval 0
 neighbor 10.0.0.101 soft-reconfiguration inbound
 neighbor 10.0.0.101 send-community
 neighbor 10.0.0.101 route-map RMap_HVOTTVolda_from_HSFTTForde in
 neighbor 10.0.0.101 route-map RMap_HVOTTVolda_to_HSFTTForde out
 neighbor 10.0.0.92 remote-as 200
 neighbor 10.0.0.92 description "To HiATTAlesund"
 neighbor 10.0.0.92 advertisement-interval 0
 neighbor 10.0.0.92 soft-reconfiguration inbound
 neighbor 10.0.0.92 send-community
 neighbor 10.0.0.92 route-map RMap_HVOTTVolda_from_HiATTAlesund in
 neighbor 10.0.0.92 route-map RMap_HVOTTVolda_to_HiATTAlesund out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
