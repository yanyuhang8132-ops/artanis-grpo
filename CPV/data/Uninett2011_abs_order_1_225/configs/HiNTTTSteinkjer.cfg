!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiNTTTSteinkjer
!
!
interface Fa0/0
 ip address 10.0.0.128 255.255.255.254
 description "To HiNTTTLevanger"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.130 255.255.255.254
 description "To HiNTTTNamsos"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.132 255.255.255.254
 description "To NTNUTTHovedbygget"
 speed auto
 duplex auto
!
!
ip community-list 1 permit 100:0 100:0 100:0
!
!
!
!
!
route-map RMap_HiNTTTSteinkjer_from_HiNTTTLevanger deny 10
!
route-map RMap_HiNTTTSteinkjer_from_HiNTTTNamsos deny 10
!
route-map RMap_HiNTTTSteinkjer_from_NTNUTTHovedbygget permit 10
 match community 1
 set local-preference 1
 set community 100:0 additive
route-map RMap_HiNTTTSteinkjer_from_NTNUTTHovedbygget deny 20
!
route-map RMap_HiNTTTSteinkjer_to_HiNTTTLevanger permit 100
!
route-map RMap_HiNTTTSteinkjer_to_HiNTTTNamsos deny 100
!
!
!
router bgp 340
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.129 remote-as 320
 neighbor 10.0.0.129 description "To HiNTTTLevanger"
 neighbor 10.0.0.129 advertisement-interval 0
 neighbor 10.0.0.129 soft-reconfiguration inbound
 neighbor 10.0.0.129 send-community
 neighbor 10.0.0.129 route-map RMap_HiNTTTSteinkjer_from_HiNTTTLevanger in
 neighbor 10.0.0.129 route-map RMap_HiNTTTSteinkjer_to_HiNTTTLevanger out
 neighbor 10.0.0.131 remote-as 330
 neighbor 10.0.0.131 description "To HiNTTTNamsos"
 neighbor 10.0.0.131 advertisement-interval 0
 neighbor 10.0.0.131 soft-reconfiguration inbound
 neighbor 10.0.0.131 send-community
 neighbor 10.0.0.131 route-map RMap_HiNTTTSteinkjer_from_HiNTTTNamsos in
 neighbor 10.0.0.131 route-map RMap_HiNTTTSteinkjer_to_HiNTTTNamsos out
 neighbor 10.0.0.133 remote-as 490
 neighbor 10.0.0.133 description "To NTNUTTHovedbygget"
 neighbor 10.0.0.133 advertisement-interval 0
 neighbor 10.0.0.133 soft-reconfiguration inbound
 neighbor 10.0.0.133 send-community
 neighbor 10.0.0.133 route-map RMap_HiNTTTSteinkjer_from_NTNUTTHovedbygget in
 neighbor 10.0.0.133 route-map RMap_HiNTTTSteinkjer_to_NTNUTTHovedbygget out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
