!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UiTo
!
!
interface Fa0/1
 ip address 10.0.0.77 255.255.255.254
 description "To HiNTTNarvik"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.88 255.255.255.254
 description "To HiFTTHammerfest"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.90 255.255.255.254
 description "To UiToID43"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UiTo_from_HiFTTHammerfest deny 10
!
route-map RMap_UiTo_from_HiNTTNarvik deny 10
!
route-map RMap_UiTo_from_UiToID43 deny 10
!
!
!
!
!
router bgp 660
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.89 remote-as 250
 neighbor 10.0.0.89 description "To HiFTTHammerfest"
 neighbor 10.0.0.89 advertisement-interval 0
 neighbor 10.0.0.89 soft-reconfiguration inbound
 neighbor 10.0.0.89 send-community
 neighbor 10.0.0.89 route-map RMap_UiTo_from_HiFTTHammerfest in
 neighbor 10.0.0.89 route-map RMap_UiTo_to_HiFTTHammerfest out
 neighbor 10.0.0.76 remote-as 310
 neighbor 10.0.0.76 description "To HiNTTNarvik"
 neighbor 10.0.0.76 advertisement-interval 0
 neighbor 10.0.0.76 soft-reconfiguration inbound
 neighbor 10.0.0.76 send-community
 neighbor 10.0.0.76 route-map RMap_UiTo_from_HiNTTNarvik in
 neighbor 10.0.0.76 route-map RMap_UiTo_to_HiNTTNarvik out
 neighbor 10.0.0.91 remote-as 670
 neighbor 10.0.0.91 description "To UiToID43"
 neighbor 10.0.0.91 advertisement-interval 0
 neighbor 10.0.0.91 soft-reconfiguration inbound
 neighbor 10.0.0.91 send-community
 neighbor 10.0.0.91 route-map RMap_UiTo_from_UiToID43 in
 neighbor 10.0.0.91 route-map RMap_UiTo_to_UiToID43 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
