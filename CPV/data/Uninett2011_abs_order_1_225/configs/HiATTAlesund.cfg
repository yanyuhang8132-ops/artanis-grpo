!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiATTAlesund
!
!
interface Fa0/1
 ip address 10.0.0.92 255.255.255.254
 description "To HVOTTVolda"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.94 255.255.255.254
 description "To NTNUTTHovedbygget"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.96 255.255.255.254
 description "To UiBTTHoyteklogibygget"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.98 255.255.255.254
 description "To HSMTTMolde"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiATTAlesund_from_HSMTTMolde deny 10
!
route-map RMap_HiATTAlesund_from_HVOTTVolda deny 10
!
route-map RMap_HiATTAlesund_from_NTNUTTHovedbygget deny 10
!
route-map RMap_HiATTAlesund_from_UiBTTHoyteklogibygget deny 10
!
!
!
!
!
!
router bgp 200
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.99 remote-as 150
 neighbor 10.0.0.99 description "To HSMTTMolde"
 neighbor 10.0.0.99 advertisement-interval 0
 neighbor 10.0.0.99 soft-reconfiguration inbound
 neighbor 10.0.0.99 send-community
 neighbor 10.0.0.99 route-map RMap_HiATTAlesund_from_HSMTTMolde in
 neighbor 10.0.0.99 route-map RMap_HiATTAlesund_to_HSMTTMolde out
 neighbor 10.0.0.93 remote-as 180
 neighbor 10.0.0.93 description "To HVOTTVolda"
 neighbor 10.0.0.93 advertisement-interval 0
 neighbor 10.0.0.93 soft-reconfiguration inbound
 neighbor 10.0.0.93 send-community
 neighbor 10.0.0.93 route-map RMap_HiATTAlesund_from_HVOTTVolda in
 neighbor 10.0.0.93 route-map RMap_HiATTAlesund_to_HVOTTVolda out
 neighbor 10.0.0.95 remote-as 490
 neighbor 10.0.0.95 description "To NTNUTTHovedbygget"
 neighbor 10.0.0.95 advertisement-interval 0
 neighbor 10.0.0.95 soft-reconfiguration inbound
 neighbor 10.0.0.95 send-community
 neighbor 10.0.0.95 route-map RMap_HiATTAlesund_from_NTNUTTHovedbygget in
 neighbor 10.0.0.95 route-map RMap_HiATTAlesund_to_NTNUTTHovedbygget out
 neighbor 10.0.0.97 remote-as 610
 neighbor 10.0.0.97 description "To UiBTTHoyteklogibygget"
 neighbor 10.0.0.97 advertisement-interval 0
 neighbor 10.0.0.97 soft-reconfiguration inbound
 neighbor 10.0.0.97 send-community
 neighbor 10.0.0.97 route-map RMap_HiATTAlesund_from_UiBTTHoyteklogibygget in
 neighbor 10.0.0.97 route-map RMap_HiATTAlesund_to_UiBTTHoyteklogibygget out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
