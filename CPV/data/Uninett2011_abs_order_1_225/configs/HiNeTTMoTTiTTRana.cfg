!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiNeTTMoTTiTTRana
!
!
interface Fa0/0
 ip address 10.0.0.55 255.255.255.254
 description "To NBTTMoTTiTTRana"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiNeTTMoTTiTTRana_from_NBTTMoTTiTTRana deny 10
!
!
!
router bgp 350
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.54 remote-as 450
 neighbor 10.0.0.54 description "To NBTTMoTTiTTRana"
 neighbor 10.0.0.54 advertisement-interval 0
 neighbor 10.0.0.54 soft-reconfiguration inbound
 neighbor 10.0.0.54 send-community
 neighbor 10.0.0.54 route-map RMap_HiNeTTMoTTiTTRana_from_NBTTMoTTiTTRana in
 neighbor 10.0.0.54 route-map RMap_HiNeTTMoTTiTTRana_to_NBTTMoTTiTTRana out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
