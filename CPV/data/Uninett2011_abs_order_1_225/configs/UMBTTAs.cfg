!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UMBTTAs
!
!
interface Fa0/1
 ip address 10.0.0.7 255.255.255.254
 description "To UiO"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.166 255.255.255.254
 description "To HiOTTFredrikstad"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UMBTTAs_from_HiOTTFredrikstad deny 10
!
route-map RMap_UMBTTAs_from_UiO deny 10
!
!
!
!
router bgp 540
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.167 remote-as 380
 neighbor 10.0.0.167 description "To HiOTTFredrikstad"
 neighbor 10.0.0.167 advertisement-interval 0
 neighbor 10.0.0.167 soft-reconfiguration inbound
 neighbor 10.0.0.167 send-community
 neighbor 10.0.0.167 route-map RMap_UMBTTAs_from_HiOTTFredrikstad in
 neighbor 10.0.0.167 route-map RMap_UMBTTAs_to_HiOTTFredrikstad out
 neighbor 10.0.0.6 remote-as 620
 neighbor 10.0.0.6 description "To UiO"
 neighbor 10.0.0.6 advertisement-interval 0
 neighbor 10.0.0.6 soft-reconfiguration inbound
 neighbor 10.0.0.6 send-community
 neighbor 10.0.0.6 route-map RMap_UMBTTAs_from_UiO in
 neighbor 10.0.0.6 route-map RMap_UMBTTAs_to_UiO out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
