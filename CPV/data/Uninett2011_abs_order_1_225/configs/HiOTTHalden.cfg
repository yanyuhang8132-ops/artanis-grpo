!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiOTTHalden
!
!
interface Fa0/1
 ip address 10.0.0.19 255.255.255.254
 description "To UiOID1"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.164 255.255.255.254
 description "To HiOTTFredrikstad"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiOTTHalden_from_HiOTTFredrikstad deny 10
!
route-map RMap_HiOTTHalden_from_UiOID1 deny 10
!
!
!
!
router bgp 390
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.165 remote-as 380
 neighbor 10.0.0.165 description "To HiOTTFredrikstad"
 neighbor 10.0.0.165 advertisement-interval 0
 neighbor 10.0.0.165 soft-reconfiguration inbound
 neighbor 10.0.0.165 send-community
 neighbor 10.0.0.165 route-map RMap_HiOTTHalden_from_HiOTTFredrikstad in
 neighbor 10.0.0.165 route-map RMap_HiOTTHalden_to_HiOTTFredrikstad out
 neighbor 10.0.0.18 remote-as 630
 neighbor 10.0.0.18 description "To UiOID1"
 neighbor 10.0.0.18 advertisement-interval 0
 neighbor 10.0.0.18 soft-reconfiguration inbound
 neighbor 10.0.0.18 send-community
 neighbor 10.0.0.18 route-map RMap_HiOTTHalden_from_UiOID1 in
 neighbor 10.0.0.18 route-map RMap_HiOTTHalden_to_UiOID1 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
