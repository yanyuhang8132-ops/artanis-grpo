!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HHTTKongsvinger
!
!
interface Fa0/1
 ip address 10.0.0.5 255.255.255.254
 description "To UiO"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.193 255.255.255.254
 description "To HHTTElverum"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HHTTKongsvinger_from_HHTTElverum deny 10
!
route-map RMap_HHTTKongsvinger_from_UiO deny 10
!
!
!
!
router bgp 60
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.192 remote-as 30
 neighbor 10.0.0.192 description "To HHTTElverum"
 neighbor 10.0.0.192 advertisement-interval 0
 neighbor 10.0.0.192 soft-reconfiguration inbound
 neighbor 10.0.0.192 send-community
 neighbor 10.0.0.192 route-map RMap_HHTTKongsvinger_from_HHTTElverum in
 neighbor 10.0.0.192 route-map RMap_HHTTKongsvinger_to_HHTTElverum out
 neighbor 10.0.0.4 remote-as 620
 neighbor 10.0.0.4 description "To UiO"
 neighbor 10.0.0.4 advertisement-interval 0
 neighbor 10.0.0.4 soft-reconfiguration inbound
 neighbor 10.0.0.4 send-community
 neighbor 10.0.0.4 route-map RMap_HHTTKongsvinger_from_UiO in
 neighbor 10.0.0.4 route-map RMap_HHTTKongsvinger_to_UiO out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
