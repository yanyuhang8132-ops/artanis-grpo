!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HHTTTynset
!
!
interface Fa0/0
 ip address 10.0.0.175 255.255.255.254
 description "To HHTTEvenstad"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.189 255.255.255.254
 description "To UNINETTTTTeknobyen"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HHTTTynset_from_HHTTEvenstad deny 10
!
route-map RMap_HHTTTynset_from_UNINETTTTTeknobyen deny 10
!
!
!
!
router bgp 80
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.174 remote-as 40
 neighbor 10.0.0.174 description "To HHTTEvenstad"
 neighbor 10.0.0.174 advertisement-interval 0
 neighbor 10.0.0.174 soft-reconfiguration inbound
 neighbor 10.0.0.174 send-community
 neighbor 10.0.0.174 route-map RMap_HHTTTynset_from_HHTTEvenstad in
 neighbor 10.0.0.174 route-map RMap_HHTTTynset_to_HHTTEvenstad out
 neighbor 10.0.0.188 remote-as 560
 neighbor 10.0.0.188 description "To UNINETTTTTeknobyen"
 neighbor 10.0.0.188 advertisement-interval 0
 neighbor 10.0.0.188 soft-reconfiguration inbound
 neighbor 10.0.0.188 send-community
 neighbor 10.0.0.188 route-map RMap_HHTTTynset_from_UNINETTTTTeknobyen in
 neighbor 10.0.0.188 route-map RMap_HHTTTynset_to_UNINETTTTTeknobyen out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
