!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HHTTElverum
!
!
interface Fa0/0
 ip address 10.0.0.179 255.255.255.254
 description "To HHTTHamar"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.191 255.255.255.254
 description "To HHTTRena"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.192 255.255.255.254
 description "To HHTTKongsvinger"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HHTTElverum_from_HHTTHamar deny 10
!
route-map RMap_HHTTElverum_from_HHTTKongsvinger deny 10
!
route-map RMap_HHTTElverum_from_HHTTRena deny 10
!
!
!
!
!
router bgp 30
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.178 remote-as 50
 neighbor 10.0.0.178 description "To HHTTHamar"
 neighbor 10.0.0.178 advertisement-interval 0
 neighbor 10.0.0.178 soft-reconfiguration inbound
 neighbor 10.0.0.178 send-community
 neighbor 10.0.0.178 route-map RMap_HHTTElverum_from_HHTTHamar in
 neighbor 10.0.0.178 route-map RMap_HHTTElverum_to_HHTTHamar out
 neighbor 10.0.0.193 remote-as 60
 neighbor 10.0.0.193 description "To HHTTKongsvinger"
 neighbor 10.0.0.193 advertisement-interval 0
 neighbor 10.0.0.193 soft-reconfiguration inbound
 neighbor 10.0.0.193 send-community
 neighbor 10.0.0.193 route-map RMap_HHTTElverum_from_HHTTKongsvinger in
 neighbor 10.0.0.193 route-map RMap_HHTTElverum_to_HHTTKongsvinger out
 neighbor 10.0.0.190 remote-as 70
 neighbor 10.0.0.190 description "To HHTTRena"
 neighbor 10.0.0.190 advertisement-interval 0
 neighbor 10.0.0.190 soft-reconfiguration inbound
 neighbor 10.0.0.190 send-community
 neighbor 10.0.0.190 route-map RMap_HHTTElverum_from_HHTTRena in
 neighbor 10.0.0.190 route-map RMap_HHTTElverum_to_HHTTRena out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
