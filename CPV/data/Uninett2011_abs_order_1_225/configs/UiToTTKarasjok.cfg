!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UiToTTKarasjok
!
!
interface Fa0/1
 ip address 10.0.0.84 255.255.255.254
 description "To SA_SHTTKautokeino"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.86 255.255.255.254
 description "To HiFTTKirkenes"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UiToTTKarasjok_from_HiFTTKirkenes deny 10
!
route-map RMap_UiToTTKarasjok_from_SA_SHTTKautokeino deny 10
!
!
!
!
router bgp 680
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.87 remote-as 260
 neighbor 10.0.0.87 description "To HiFTTKirkenes"
 neighbor 10.0.0.87 advertisement-interval 0
 neighbor 10.0.0.87 soft-reconfiguration inbound
 neighbor 10.0.0.87 send-community
 neighbor 10.0.0.87 route-map RMap_UiToTTKarasjok_from_HiFTTKirkenes in
 neighbor 10.0.0.87 route-map RMap_UiToTTKarasjok_to_HiFTTKirkenes out
 neighbor 10.0.0.85 remote-as 520
 neighbor 10.0.0.85 description "To SA_SHTTKautokeino"
 neighbor 10.0.0.85 advertisement-interval 0
 neighbor 10.0.0.85 soft-reconfiguration inbound
 neighbor 10.0.0.85 send-community
 neighbor 10.0.0.85 route-map RMap_UiToTTKarasjok_from_SA_SHTTKautokeino in
 neighbor 10.0.0.85 route-map RMap_UiToTTKarasjok_to_SA_SHTTKautokeino out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
