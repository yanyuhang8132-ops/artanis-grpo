!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname UiBTTBT
!
!
interface Fa0/1
 ip address 10.0.0.11 255.255.255.254
 description "To UiO"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.109 255.255.255.254
 description "To UiSTTStavanger"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.115 255.255.255.254
 description "To UiBTTHoyteklogibygget"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_UiBTTBT_from_UiBTTHoyteklogibygget deny 10
!
route-map RMap_UiBTTBT_from_UiO deny 10
!
route-map RMap_UiBTTBT_from_UiSTTStavanger deny 10
!
!
!
!
!
router bgp 600
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.114 remote-as 610
 neighbor 10.0.0.114 description "To UiBTTHoyteklogibygget"
 neighbor 10.0.0.114 advertisement-interval 0
 neighbor 10.0.0.114 soft-reconfiguration inbound
 neighbor 10.0.0.114 send-community
 neighbor 10.0.0.114 route-map RMap_UiBTTBT_from_UiBTTHoyteklogibygget in
 neighbor 10.0.0.114 route-map RMap_UiBTTBT_to_UiBTTHoyteklogibygget out
 neighbor 10.0.0.10 remote-as 620
 neighbor 10.0.0.10 description "To UiO"
 neighbor 10.0.0.10 advertisement-interval 0
 neighbor 10.0.0.10 soft-reconfiguration inbound
 neighbor 10.0.0.10 send-community
 neighbor 10.0.0.10 route-map RMap_UiBTTBT_from_UiO in
 neighbor 10.0.0.10 route-map RMap_UiBTTBT_to_UiO out
 neighbor 10.0.0.108 remote-as 650
 neighbor 10.0.0.108 description "To UiSTTStavanger"
 neighbor 10.0.0.108 advertisement-interval 0
 neighbor 10.0.0.108 soft-reconfiguration inbound
 neighbor 10.0.0.108 send-community
 neighbor 10.0.0.108 route-map RMap_UiBTTBT_from_UiSTTStavanger in
 neighbor 10.0.0.108 route-map RMap_UiBTTBT_to_UiSTTStavanger out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
