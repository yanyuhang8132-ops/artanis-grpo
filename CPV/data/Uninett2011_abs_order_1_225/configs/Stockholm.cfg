!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Stockholm
!
!
interface Fa1/0
 ip address 10.0.0.13 255.255.255.254
 description "To UiOID1"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.69 255.255.255.254
 description "To HiNTTNarvik"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.135 255.255.255.254
 description "To NORDUnetTTStockholm"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Stockholm_from_HiNTTNarvik deny 10
!
route-map RMap_Stockholm_from_NORDUnetTTStockholm deny 10
!
route-map RMap_Stockholm_from_UiOID1 deny 10
!
!
!
!
!
router bgp 530
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.68 remote-as 310
 neighbor 10.0.0.68 description "To HiNTTNarvik"
 neighbor 10.0.0.68 advertisement-interval 0
 neighbor 10.0.0.68 soft-reconfiguration inbound
 neighbor 10.0.0.68 send-community
 neighbor 10.0.0.68 route-map RMap_Stockholm_from_HiNTTNarvik in
 neighbor 10.0.0.68 route-map RMap_Stockholm_to_HiNTTNarvik out
 neighbor 10.0.0.134 remote-as 470
 neighbor 10.0.0.134 description "To NORDUnetTTStockholm"
 neighbor 10.0.0.134 advertisement-interval 0
 neighbor 10.0.0.134 soft-reconfiguration inbound
 neighbor 10.0.0.134 send-community
 neighbor 10.0.0.134 route-map RMap_Stockholm_from_NORDUnetTTStockholm in
 neighbor 10.0.0.134 route-map RMap_Stockholm_to_NORDUnetTTStockholm out
 neighbor 10.0.0.12 remote-as 630
 neighbor 10.0.0.12 description "To UiOID1"
 neighbor 10.0.0.12 advertisement-interval 0
 neighbor 10.0.0.12 soft-reconfiguration inbound
 neighbor 10.0.0.12 send-community
 neighbor 10.0.0.12 route-map RMap_Stockholm_from_UiOID1 in
 neighbor 10.0.0.12 route-map RMap_Stockholm_to_UiOID1 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
