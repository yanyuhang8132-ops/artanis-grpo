!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiBUTTKongsberg
!
!
interface Fa0/0
 ip address 10.0.0.38 255.255.255.254
 description "To HiBUTTDrammen"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.40 255.255.255.254
 description "To HiBuTTHonefoss"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiBUTTKongsberg_from_HiBUTTDrammen deny 10
!
route-map RMap_HiBUTTKongsberg_from_HiBuTTHonefoss deny 10
!
!
!
!
router bgp 220
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.39 remote-as 210
 neighbor 10.0.0.39 description "To HiBUTTDrammen"
 neighbor 10.0.0.39 advertisement-interval 0
 neighbor 10.0.0.39 soft-reconfiguration inbound
 neighbor 10.0.0.39 send-community
 neighbor 10.0.0.39 route-map RMap_HiBUTTKongsberg_from_HiBUTTDrammen in
 neighbor 10.0.0.39 route-map RMap_HiBUTTKongsberg_to_HiBUTTDrammen out
 neighbor 10.0.0.41 remote-as 230
 neighbor 10.0.0.41 description "To HiBuTTHonefoss"
 neighbor 10.0.0.41 advertisement-interval 0
 neighbor 10.0.0.41 soft-reconfiguration inbound
 neighbor 10.0.0.41 send-community
 neighbor 10.0.0.41 route-map RMap_HiBUTTKongsberg_from_HiBuTTHonefoss in
 neighbor 10.0.0.41 route-map RMap_HiBUTTKongsberg_to_HiBuTTHonefoss out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
