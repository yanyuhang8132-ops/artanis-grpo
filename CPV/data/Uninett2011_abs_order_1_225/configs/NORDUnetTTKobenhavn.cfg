!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NORDUnetTTKobenhavn
!
!
interface Fa0/0
 ip address 10.0.0.31 255.255.255.254
 description "To UiOTTStTTOlavsplassTT5"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NORDUnetTTKobenhavn_from_UiOTTStTTOlavsplassTT5 deny 10
!
!
!
router bgp 460
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.30 remote-as 640
 neighbor 10.0.0.30 description "To UiOTTStTTOlavsplassTT5"
 neighbor 10.0.0.30 advertisement-interval 0
 neighbor 10.0.0.30 soft-reconfiguration inbound
 neighbor 10.0.0.30 send-community
 neighbor 10.0.0.30 route-map RMap_NORDUnetTTKobenhavn_from_UiOTTStTTOlavsplassTT5 in
 neighbor 10.0.0.30 route-map RMap_NORDUnetTTKobenhavn_to_UiOTTStTTOlavsplassTT5 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
