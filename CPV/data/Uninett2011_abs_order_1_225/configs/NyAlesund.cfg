!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NyAlesund
!
!
interface Fa0/0
 ip address 10.0.0.140 255.255.255.254
 description "To UNISTTSvalbard"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NyAlesund_from_UNISTTSvalbard deny 10
!
!
!
router bgp 510
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.141 remote-as 570
 neighbor 10.0.0.141 description "To UNISTTSvalbard"
 neighbor 10.0.0.141 advertisement-interval 0
 neighbor 10.0.0.141 soft-reconfiguration inbound
 neighbor 10.0.0.141 send-community
 neighbor 10.0.0.141 route-map RMap_NyAlesund_from_UNISTTSvalbard in
 neighbor 10.0.0.141 route-map RMap_NyAlesund_to_UNISTTSvalbard out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
