!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HiFTTKirkenes
!
!
interface Fa0/1
 ip address 10.0.0.87 255.255.255.254
 description "To UiToTTKarasjok"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.138 255.255.255.254
 description "To HiFTTVadso"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HiFTTKirkenes_from_HiFTTVadso deny 10
!
route-map RMap_HiFTTKirkenes_from_UiToTTKarasjok deny 10
!
!
!
!
router bgp 260
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.139 remote-as 270
 neighbor 10.0.0.139 description "To HiFTTVadso"
 neighbor 10.0.0.139 advertisement-interval 0
 neighbor 10.0.0.139 soft-reconfiguration inbound
 neighbor 10.0.0.139 send-community
 neighbor 10.0.0.139 route-map RMap_HiFTTKirkenes_from_HiFTTVadso in
 neighbor 10.0.0.139 route-map RMap_HiFTTKirkenes_to_HiFTTVadso out
 neighbor 10.0.0.86 remote-as 680
 neighbor 10.0.0.86 description "To UiToTTKarasjok"
 neighbor 10.0.0.86 advertisement-interval 0
 neighbor 10.0.0.86 soft-reconfiguration inbound
 neighbor 10.0.0.86 send-community
 neighbor 10.0.0.86 route-map RMap_HiFTTKirkenes_from_UiToTTKarasjok in
 neighbor 10.0.0.86 route-map RMap_HiFTTKirkenes_to_UiToTTKarasjok out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
