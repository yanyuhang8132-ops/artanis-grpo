!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HVETTBorre
!
!
interface Fa0/1
 ip address 10.0.0.43 255.255.255.254
 description "To HiBUTTDrammen"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.64 255.255.255.254
 description "To HiOTTFredrikstad"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.66 255.255.255.254
 description "To HVETTLarvik"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HVETTBorre_from_HVETTLarvik deny 10
!
route-map RMap_HVETTBorre_from_HiBUTTDrammen deny 10
!
route-map RMap_HVETTBorre_from_HiOTTFredrikstad deny 10
!
!
!
!
!
router bgp 160
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.67 remote-as 170
 neighbor 10.0.0.67 description "To HVETTLarvik"
 neighbor 10.0.0.67 advertisement-interval 0
 neighbor 10.0.0.67 soft-reconfiguration inbound
 neighbor 10.0.0.67 send-community
 neighbor 10.0.0.67 route-map RMap_HVETTBorre_from_HVETTLarvik in
 neighbor 10.0.0.67 route-map RMap_HVETTBorre_to_HVETTLarvik out
 neighbor 10.0.0.42 remote-as 210
 neighbor 10.0.0.42 description "To HiBUTTDrammen"
 neighbor 10.0.0.42 advertisement-interval 0
 neighbor 10.0.0.42 soft-reconfiguration inbound
 neighbor 10.0.0.42 send-community
 neighbor 10.0.0.42 route-map RMap_HVETTBorre_from_HiBUTTDrammen in
 neighbor 10.0.0.42 route-map RMap_HVETTBorre_to_HiBUTTDrammen out
 neighbor 10.0.0.65 remote-as 380
 neighbor 10.0.0.65 description "To HiOTTFredrikstad"
 neighbor 10.0.0.65 advertisement-interval 0
 neighbor 10.0.0.65 soft-reconfiguration inbound
 neighbor 10.0.0.65 send-community
 neighbor 10.0.0.65 route-map RMap_HVETTBorre_from_HiOTTFredrikstad in
 neighbor 10.0.0.65 route-map RMap_HVETTBorre_to_HiOTTFredrikstad out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
