!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HSFTTSandane
!
!
interface Fa0/0
 ip address 10.0.0.123 255.255.255.254
 description "To HSFTTForde"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HSFTTSandane_from_HSFTTForde deny 10
!
!
!
router bgp 100
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.122 remote-as 90
 neighbor 10.0.0.122 description "To HSFTTForde"
 neighbor 10.0.0.122 advertisement-interval 0
 neighbor 10.0.0.122 soft-reconfiguration inbound
 neighbor 10.0.0.122 send-community
 neighbor 10.0.0.122 route-map RMap_HSFTTSandane_from_HSFTTForde in
 neighbor 10.0.0.122 route-map RMap_HSFTTSandane_to_HSFTTForde out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
