!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HSHTTHaugesund
!
!
interface Fa0/1
 ip address 10.0.0.105 255.255.255.254
 description "To UiSTTStavanger"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.110 255.255.255.254
 description "To HSHTTStord"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HSHTTHaugesund_from_HSHTTStord deny 10
!
route-map RMap_HSHTTHaugesund_from_UiSTTStavanger deny 10
!
!
!
!
router bgp 120
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.111 remote-as 130
 neighbor 10.0.0.111 description "To HSHTTStord"
 neighbor 10.0.0.111 advertisement-interval 0
 neighbor 10.0.0.111 soft-reconfiguration inbound
 neighbor 10.0.0.111 send-community
 neighbor 10.0.0.111 route-map RMap_HSHTTHaugesund_from_HSHTTStord in
 neighbor 10.0.0.111 route-map RMap_HSHTTHaugesund_to_HSHTTStord out
 neighbor 10.0.0.104 remote-as 650
 neighbor 10.0.0.104 description "To UiSTTStavanger"
 neighbor 10.0.0.104 advertisement-interval 0
 neighbor 10.0.0.104 soft-reconfiguration inbound
 neighbor 10.0.0.104 send-community
 neighbor 10.0.0.104 route-map RMap_HSHTTHaugesund_from_UiSTTStavanger in
 neighbor 10.0.0.104 route-map RMap_HSHTTHaugesund_to_UiSTTStavanger out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
