!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname NORDUnetTTStockholm
!
!
interface Fa0/0
 ip address 10.0.0.134 255.255.255.254
 description "To Stockholm"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_NORDUnetTTStockholm_from_Stockholm deny 10
!
!
!
router bgp 470
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.135 remote-as 530
 neighbor 10.0.0.135 description "To Stockholm"
 neighbor 10.0.0.135 advertisement-interval 0
 neighbor 10.0.0.135 soft-reconfiguration inbound
 neighbor 10.0.0.135 send-community
 neighbor 10.0.0.135 route-map RMap_NORDUnetTTStockholm_from_Stockholm in
 neighbor 10.0.0.135 route-map RMap_NORDUnetTTStockholm_to_Stockholm out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
