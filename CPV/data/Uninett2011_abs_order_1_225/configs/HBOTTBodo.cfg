!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname HBOTTBodo
!
!
interface Fa1/1
 ip address 10.0.0.59 255.255.255.254
 description "To NBTTMoTTiTTRana"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.75 255.255.255.254
 description "To HiNTTNarvik"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.83 255.255.255.254
 description "To HiHTTHarstad"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.127 255.255.255.254
 description "To HiNeTTSandnesjoen"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_HBOTTBodo_from_HiHTTHarstad deny 10
!
route-map RMap_HBOTTBodo_from_HiNTTNarvik deny 10
!
route-map RMap_HBOTTBodo_from_HiNeTTSandnesjoen deny 10
!
route-map RMap_HBOTTBodo_from_NBTTMoTTiTTRana deny 10
!
!
!
!
!
!
router bgp 10
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.82 remote-as 290
 neighbor 10.0.0.82 description "To HiHTTHarstad"
 neighbor 10.0.0.82 advertisement-interval 0
 neighbor 10.0.0.82 soft-reconfiguration inbound
 neighbor 10.0.0.82 send-community
 neighbor 10.0.0.82 route-map RMap_HBOTTBodo_from_HiHTTHarstad in
 neighbor 10.0.0.82 route-map RMap_HBOTTBodo_to_HiHTTHarstad out
 neighbor 10.0.0.74 remote-as 310
 neighbor 10.0.0.74 description "To HiNTTNarvik"
 neighbor 10.0.0.74 advertisement-interval 0
 neighbor 10.0.0.74 soft-reconfiguration inbound
 neighbor 10.0.0.74 send-community
 neighbor 10.0.0.74 route-map RMap_HBOTTBodo_from_HiNTTNarvik in
 neighbor 10.0.0.74 route-map RMap_HBOTTBodo_to_HiNTTNarvik out
 neighbor 10.0.0.126 remote-as 370
 neighbor 10.0.0.126 description "To HiNeTTSandnesjoen"
 neighbor 10.0.0.126 advertisement-interval 0
 neighbor 10.0.0.126 soft-reconfiguration inbound
 neighbor 10.0.0.126 send-community
 neighbor 10.0.0.126 route-map RMap_HBOTTBodo_from_HiNeTTSandnesjoen in
 neighbor 10.0.0.126 route-map RMap_HBOTTBodo_to_HiNeTTSandnesjoen out
 neighbor 10.0.0.58 remote-as 450
 neighbor 10.0.0.58 description "To NBTTMoTTiTTRana"
 neighbor 10.0.0.58 advertisement-interval 0
 neighbor 10.0.0.58 soft-reconfiguration inbound
 neighbor 10.0.0.58 send-community
 neighbor 10.0.0.58 route-map RMap_HBOTTBodo_from_NBTTMoTTiTTRana in
 neighbor 10.0.0.58 route-map RMap_HBOTTBodo_to_NBTTMoTTiTTRana out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
