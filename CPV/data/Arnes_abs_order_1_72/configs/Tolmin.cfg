!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Tolmin
!
!
interface Fa0/0
 ip address 10.0.0.31 255.255.255.254
 description "To Bled"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.46 255.255.255.254
 description "To NovaTTGorica"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Tolmin_from_Bled deny 10
!
route-map RMap_Tolmin_from_NovaTTGorica deny 10
!
!
!
!
router bgp 320
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.30 remote-as 20
 neighbor 10.0.0.30 description "To Bled"
 neighbor 10.0.0.30 advertisement-interval 0
 neighbor 10.0.0.30 soft-reconfiguration inbound
 neighbor 10.0.0.30 send-community
 neighbor 10.0.0.30 route-map RMap_Tolmin_from_Bled in
 neighbor 10.0.0.30 route-map RMap_Tolmin_to_Bled out
 neighbor 10.0.0.47 remote-as 190
 neighbor 10.0.0.47 description "To NovaTTGorica"
 neighbor 10.0.0.47 advertisement-interval 0
 neighbor 10.0.0.47 soft-reconfiguration inbound
 neighbor 10.0.0.47 send-community
 neighbor 10.0.0.47 route-map RMap_Tolmin_from_NovaTTGorica in
 neighbor 10.0.0.47 route-map RMap_Tolmin_to_NovaTTGorica out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
