!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Maribor
!
!
interface Fa1/0
 ip address 10.0.0.19 255.255.255.254
 description "To Lasko"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.45 255.255.255.254
 description "To Ljubljana"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.57 255.255.255.254
 description "To GornjaTTRadgona"
 speed auto
 duplex auto
!
interface Fa2/0
 ip address 10.0.0.87 255.255.255.254
 description "To Ptuj"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.88 255.255.255.254
 description "To Dravograd"
 speed auto
 duplex auto
!
interface Fa2/1
 ip address 10.0.0.90 255.255.255.254
 description "To SlovenskaTTBistrica"
 speed auto
 duplex auto
!
!
ip community-list 1 permit 100:0 100:0 100:0
!
!
!
!
!
route-map RMap_Maribor_from_Dravograd deny 10
!
route-map RMap_Maribor_from_GornjaTTRadgona deny 10
!
route-map RMap_Maribor_from_Lasko permit 10
 match community 1
 set local-preference 1
 set community 100:0 additive
route-map RMap_Maribor_from_Lasko deny 20
!
route-map RMap_Maribor_from_Ljubljana deny 10
!
route-map RMap_Maribor_from_Ptuj deny 10
!
route-map RMap_Maribor_from_SlovenskaTTBistrica deny 10
!
route-map RMap_Maribor_to_Dravograd permit 100
!
route-map RMap_Maribor_to_GornjaTTRadgona permit 100
!
!
route-map RMap_Maribor_to_Ljubljana permit 100
!
route-map RMap_Maribor_to_Ptuj permit 100
!
route-map RMap_Maribor_to_SlovenskaTTBistrica permit 100
!
!
router bgp 170
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.89 remote-as 50
 neighbor 10.0.0.89 description "To Dravograd"
 neighbor 10.0.0.89 advertisement-interval 0
 neighbor 10.0.0.89 soft-reconfiguration inbound
 neighbor 10.0.0.89 send-community
 neighbor 10.0.0.89 route-map RMap_Maribor_from_Dravograd in
 neighbor 10.0.0.89 route-map RMap_Maribor_to_Dravograd out
 neighbor 10.0.0.56 remote-as 60
 neighbor 10.0.0.56 description "To GornjaTTRadgona"
 neighbor 10.0.0.56 advertisement-interval 0
 neighbor 10.0.0.56 soft-reconfiguration inbound
 neighbor 10.0.0.56 send-community
 neighbor 10.0.0.56 route-map RMap_Maribor_from_GornjaTTRadgona in
 neighbor 10.0.0.56 route-map RMap_Maribor_to_GornjaTTRadgona out
 neighbor 10.0.0.18 remote-as 140
 neighbor 10.0.0.18 description "To Lasko"
 neighbor 10.0.0.18 advertisement-interval 0
 neighbor 10.0.0.18 soft-reconfiguration inbound
 neighbor 10.0.0.18 send-community
 neighbor 10.0.0.18 route-map RMap_Maribor_from_Lasko in
 neighbor 10.0.0.18 route-map RMap_Maribor_to_Lasko out
 neighbor 10.0.0.44 remote-as 150
 neighbor 10.0.0.44 description "To Ljubljana"
 neighbor 10.0.0.44 advertisement-interval 0
 neighbor 10.0.0.44 soft-reconfiguration inbound
 neighbor 10.0.0.44 send-community
 neighbor 10.0.0.44 route-map RMap_Maribor_from_Ljubljana in
 neighbor 10.0.0.44 route-map RMap_Maribor_to_Ljubljana out
 neighbor 10.0.0.86 remote-as 240
 neighbor 10.0.0.86 description "To Ptuj"
 neighbor 10.0.0.86 advertisement-interval 0
 neighbor 10.0.0.86 soft-reconfiguration inbound
 neighbor 10.0.0.86 send-community
 neighbor 10.0.0.86 route-map RMap_Maribor_from_Ptuj in
 neighbor 10.0.0.86 route-map RMap_Maribor_to_Ptuj out
 neighbor 10.0.0.91 remote-as 310
 neighbor 10.0.0.91 description "To SlovenskaTTBistrica"
 neighbor 10.0.0.91 advertisement-interval 0
 neighbor 10.0.0.91 soft-reconfiguration inbound
 neighbor 10.0.0.91 send-community
 neighbor 10.0.0.91 route-map RMap_Maribor_from_SlovenskaTTBistrica in
 neighbor 10.0.0.91 route-map RMap_Maribor_to_SlovenskaTTBistrica out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Maribor
ip access-list extended ACL100
 permit ip host 10.0.0.55 host 10.0.0.27
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 67000000
interface Fa1/1
 service-policy input ACL_LIMIT_100
