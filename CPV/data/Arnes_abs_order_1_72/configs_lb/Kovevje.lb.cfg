!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Kovevje
!
!
interface Fa0/1
 ip address 10.0.0.33 255.255.255.254
 description "To NovoTTMesto"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.39 255.255.255.254
 description "To Ljubljana"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Kovevje_from_Ljubljana deny 10
!
route-map RMap_Kovevje_from_NovoTTMesto deny 10
!
!
!
!
router bgp 110
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.38 remote-as 150
 neighbor 10.0.0.38 description "To Ljubljana"
 neighbor 10.0.0.38 advertisement-interval 0
 neighbor 10.0.0.38 soft-reconfiguration inbound
 neighbor 10.0.0.38 send-community
 neighbor 10.0.0.38 route-map RMap_Kovevje_from_Ljubljana in
 neighbor 10.0.0.38 route-map RMap_Kovevje_to_Ljubljana out
 neighbor 10.0.0.32 remote-as 200
 neighbor 10.0.0.32 description "To NovoTTMesto"
 neighbor 10.0.0.32 advertisement-interval 0
 neighbor 10.0.0.32 soft-reconfiguration inbound
 neighbor 10.0.0.32 send-community
 neighbor 10.0.0.32 route-map RMap_Kovevje_from_NovoTTMesto in
 neighbor 10.0.0.32 route-map RMap_Kovevje_to_NovoTTMesto out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Kovevje
ip access-list extended ACL100
 permit ip host 10.0.0.6 host 10.0.0.41
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 36000000
interface Fa0/0
 service-policy input ACL_LIMIT_100
