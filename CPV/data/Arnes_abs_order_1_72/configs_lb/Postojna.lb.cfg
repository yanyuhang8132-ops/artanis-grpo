!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Postojna
!
!
interface Fa0/0
 ip address 10.0.0.37 255.255.255.254
 description "To Ljubljana"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.67 255.255.255.254
 description "To Senozece"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Postojna_from_Ljubljana deny 10
!
route-map RMap_Postojna_from_Senozece deny 10
!
!
!
!
router bgp 230
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.36 remote-as 150
 neighbor 10.0.0.36 description "To Ljubljana"
 neighbor 10.0.0.36 advertisement-interval 0
 neighbor 10.0.0.36 soft-reconfiguration inbound
 neighbor 10.0.0.36 send-community
 neighbor 10.0.0.36 route-map RMap_Postojna_from_Ljubljana in
 neighbor 10.0.0.36 route-map RMap_Postojna_to_Ljubljana out
 neighbor 10.0.0.66 remote-as 280
 neighbor 10.0.0.66 description "To Senozece"
 neighbor 10.0.0.66 advertisement-interval 0
 neighbor 10.0.0.66 soft-reconfiguration inbound
 neighbor 10.0.0.66 send-community
 neighbor 10.0.0.66 route-map RMap_Postojna_from_Senozece in
 neighbor 10.0.0.66 route-map RMap_Postojna_to_Senozece out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Postojna
ip access-list extended ACL100
 permit ip host 10.0.0.66 host 10.0.0.86
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 54000000
interface Fa0/0
 service-policy input ACL_LIMIT_100
