!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Koper
!
!
interface Fa1/0
 ip address 10.0.0.25 255.255.255.254
 description "To Kranj"
 speed auto
 duplex auto
!
interface Fa1/1
 ip address 10.0.0.43 255.255.255.254
 description "To Ljubljana"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.71 255.255.255.254
 description "To Divaca"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.73 255.255.255.254
 description "To Izola"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Koper_from_Divaca deny 10
!
route-map RMap_Koper_from_Izola deny 10
!
route-map RMap_Koper_from_Kranj deny 10
!
route-map RMap_Koper_from_Ljubljana deny 10
!
!
!
!
!
!
router bgp 100
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.70 remote-as 40
 neighbor 10.0.0.70 description "To Divaca"
 neighbor 10.0.0.70 advertisement-interval 0
 neighbor 10.0.0.70 soft-reconfiguration inbound
 neighbor 10.0.0.70 send-community
 neighbor 10.0.0.70 route-map RMap_Koper_from_Divaca in
 neighbor 10.0.0.70 route-map RMap_Koper_to_Divaca out
 neighbor 10.0.0.72 remote-as 70
 neighbor 10.0.0.72 description "To Izola"
 neighbor 10.0.0.72 advertisement-interval 0
 neighbor 10.0.0.72 soft-reconfiguration inbound
 neighbor 10.0.0.72 send-community
 neighbor 10.0.0.72 route-map RMap_Koper_from_Izola in
 neighbor 10.0.0.72 route-map RMap_Koper_to_Izola out
 neighbor 10.0.0.24 remote-as 120
 neighbor 10.0.0.24 description "To Kranj"
 neighbor 10.0.0.24 advertisement-interval 0
 neighbor 10.0.0.24 soft-reconfiguration inbound
 neighbor 10.0.0.24 send-community
 neighbor 10.0.0.24 route-map RMap_Koper_from_Kranj in
 neighbor 10.0.0.24 route-map RMap_Koper_to_Kranj out
 neighbor 10.0.0.42 remote-as 150
 neighbor 10.0.0.42 description "To Ljubljana"
 neighbor 10.0.0.42 advertisement-interval 0
 neighbor 10.0.0.42 soft-reconfiguration inbound
 neighbor 10.0.0.42 send-community
 neighbor 10.0.0.42 route-map RMap_Koper_from_Ljubljana in
 neighbor 10.0.0.42 route-map RMap_Koper_to_Ljubljana out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
