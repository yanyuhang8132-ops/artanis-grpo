!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Turin
!
!
interface Fa0/1
 ip address 10.0.0.255 255.255.255.254
 description "To Marseille"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.1.19 255.255.255.254
 description "To Cuneo"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.1.88 255.255.255.254
 description "To Milan"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Turin_from_Cuneo deny 10
!
route-map RMap_Turin_from_Marseille deny 10
!
route-map RMap_Turin_from_Milan deny 10
!
!
!
!
!
router bgp 1410
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.18 remote-as 370
 neighbor 10.0.1.18 description "To Cuneo"
 neighbor 10.0.1.18 advertisement-interval 0
 neighbor 10.0.1.18 soft-reconfiguration inbound
 neighbor 10.0.1.18 send-community
 neighbor 10.0.1.18 route-map RMap_Turin_from_Cuneo in
 neighbor 10.0.1.18 route-map RMap_Turin_to_Cuneo out
 neighbor 10.0.0.254 remote-as 860
 neighbor 10.0.0.254 description "To Marseille"
 neighbor 10.0.0.254 advertisement-interval 0
 neighbor 10.0.0.254 soft-reconfiguration inbound
 neighbor 10.0.0.254 send-community
 neighbor 10.0.0.254 route-map RMap_Turin_from_Marseille in
 neighbor 10.0.0.254 route-map RMap_Turin_to_Marseille out
 neighbor 10.0.1.89 remote-as 870
 neighbor 10.0.1.89 description "To Milan"
 neighbor 10.0.1.89 advertisement-interval 0
 neighbor 10.0.1.89 soft-reconfiguration inbound
 neighbor 10.0.1.89 send-community
 neighbor 10.0.1.89 route-map RMap_Turin_from_Milan in
 neighbor 10.0.1.89 route-map RMap_Turin_to_Milan out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
