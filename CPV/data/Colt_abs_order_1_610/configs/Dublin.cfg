!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Dublin
!
!
interface Fa0/1
 ip address 10.0.0.222 255.255.255.254
 description "To London"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.224 255.255.255.254
 description "To Bristol"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Dublin_from_Bristol deny 10
!
route-map RMap_Dublin_from_London deny 10
!
!
!
!
router bgp 420
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.225 remote-as 250
 neighbor 10.0.0.225 description "To Bristol"
 neighbor 10.0.0.225 advertisement-interval 0
 neighbor 10.0.0.225 soft-reconfiguration inbound
 neighbor 10.0.0.225 send-community
 neighbor 10.0.0.225 route-map RMap_Dublin_from_Bristol in
 neighbor 10.0.0.225 route-map RMap_Dublin_to_Bristol out
 neighbor 10.0.0.223 remote-as 760
 neighbor 10.0.0.223 description "To London"
 neighbor 10.0.0.223 advertisement-interval 0
 neighbor 10.0.0.223 soft-reconfiguration inbound
 neighbor 10.0.0.223 send-community
 neighbor 10.0.0.223 route-map RMap_Dublin_from_London in
 neighbor 10.0.0.223 route-map RMap_Dublin_to_London out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
