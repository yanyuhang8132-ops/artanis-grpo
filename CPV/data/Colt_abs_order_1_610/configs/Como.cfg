!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Como
!
!
interface Fa0/0
 ip address 10.0.0.191 255.255.255.254
 description "To Chiasso"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.212 255.255.255.254
 description "To Milan"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Como_from_Chiasso deny 10
!
route-map RMap_Como_from_Milan deny 10
!
!
!
!
router bgp 350
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.190 remote-as 320
 neighbor 10.0.0.190 description "To Chiasso"
 neighbor 10.0.0.190 advertisement-interval 0
 neighbor 10.0.0.190 soft-reconfiguration inbound
 neighbor 10.0.0.190 send-community
 neighbor 10.0.0.190 route-map RMap_Como_from_Chiasso in
 neighbor 10.0.0.190 route-map RMap_Como_to_Chiasso out
 neighbor 10.0.0.213 remote-as 870
 neighbor 10.0.0.213 description "To Milan"
 neighbor 10.0.0.213 advertisement-interval 0
 neighbor 10.0.0.213 soft-reconfiguration inbound
 neighbor 10.0.0.213 send-community
 neighbor 10.0.0.213 route-map RMap_Como_from_Milan in
 neighbor 10.0.0.213 route-map RMap_Como_to_Milan out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
