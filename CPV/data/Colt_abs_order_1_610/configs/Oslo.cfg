!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Oslo
!
!
interface Fa0/1
 ip address 10.0.0.171 255.255.255.254
 description "To Stockholm"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.173 255.255.255.254
 description "To Gothenburg"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Oslo_from_Gothenburg deny 10
!
route-map RMap_Oslo_from_Stockholm deny 10
!
!
!
!
router bgp 1060
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.172 remote-as 540
 neighbor 10.0.0.172 description "To Gothenburg"
 neighbor 10.0.0.172 advertisement-interval 0
 neighbor 10.0.0.172 soft-reconfiguration inbound
 neighbor 10.0.0.172 send-community
 neighbor 10.0.0.172 route-map RMap_Oslo_from_Gothenburg in
 neighbor 10.0.0.172 route-map RMap_Oslo_to_Gothenburg out
 neighbor 10.0.0.170 remote-as 1320
 neighbor 10.0.0.170 description "To Stockholm"
 neighbor 10.0.0.170 advertisement-interval 0
 neighbor 10.0.0.170 soft-reconfiguration inbound
 neighbor 10.0.0.170 send-community
 neighbor 10.0.0.170 route-map RMap_Oslo_from_Stockholm in
 neighbor 10.0.0.170 route-map RMap_Oslo_to_Stockholm out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
