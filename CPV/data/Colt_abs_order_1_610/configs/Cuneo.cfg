!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Cuneo
!
!
interface Fa0/0
 ip address 10.0.1.18 255.255.255.254
 description "To Turin"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Cuneo_from_Turin deny 10
!
!
!
router bgp 370
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.19 remote-as 1410
 neighbor 10.0.1.19 description "To Turin"
 neighbor 10.0.1.19 advertisement-interval 0
 neighbor 10.0.1.19 soft-reconfiguration inbound
 neighbor 10.0.1.19 send-community
 neighbor 10.0.1.19 route-map RMap_Cuneo_from_Turin in
 neighbor 10.0.1.19 route-map RMap_Cuneo_to_Turin out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
