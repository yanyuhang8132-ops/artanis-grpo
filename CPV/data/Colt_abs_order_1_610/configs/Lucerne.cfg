!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Lucerne
!
!
interface Fa0/1
 ip address 10.0.0.186 255.255.255.254
 description "To Zug"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.188 255.255.255.254
 description "To Lugano"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Lucerne_from_Lugano deny 10
!
route-map RMap_Lucerne_from_Zug deny 10
!
!
!
!
router bgp 770
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.189 remote-as 780
 neighbor 10.0.0.189 description "To Lugano"
 neighbor 10.0.0.189 advertisement-interval 0
 neighbor 10.0.0.189 soft-reconfiguration inbound
 neighbor 10.0.0.189 send-community
 neighbor 10.0.0.189 route-map RMap_Lucerne_from_Lugano in
 neighbor 10.0.0.189 route-map RMap_Lucerne_to_Lugano out
 neighbor 10.0.0.187 remote-as 1520
 neighbor 10.0.0.187 description "To Zug"
 neighbor 10.0.0.187 advertisement-interval 0
 neighbor 10.0.0.187 soft-reconfiguration inbound
 neighbor 10.0.0.187 send-community
 neighbor 10.0.0.187 route-map RMap_Lucerne_from_Zug in
 neighbor 10.0.0.187 route-map RMap_Lucerne_to_Zug out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
