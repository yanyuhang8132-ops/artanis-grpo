!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Rouen
!
!
interface Fa0/0
 ip address 10.0.1.93 255.255.255.254
 description "To Paris"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.1.99 255.255.255.254
 description "To Rennes"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Rouen_from_Paris deny 10
!
route-map RMap_Rouen_from_Rennes deny 10
!
!
!
!
router bgp 1250
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.92 remote-as 1100
 neighbor 10.0.1.92 description "To Paris"
 neighbor 10.0.1.92 advertisement-interval 0
 neighbor 10.0.1.92 soft-reconfiguration inbound
 neighbor 10.0.1.92 send-community
 neighbor 10.0.1.92 route-map RMap_Rouen_from_Paris in
 neighbor 10.0.1.92 route-map RMap_Rouen_to_Paris out
 neighbor 10.0.1.98 remote-as 1200
 neighbor 10.0.1.98 description "To Rennes"
 neighbor 10.0.1.98 advertisement-interval 0
 neighbor 10.0.1.98 soft-reconfiguration inbound
 neighbor 10.0.1.98 send-community
 neighbor 10.0.1.98 route-map RMap_Rouen_from_Rennes in
 neighbor 10.0.1.98 route-map RMap_Rouen_to_Rennes out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
