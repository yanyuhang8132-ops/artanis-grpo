!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Potsdam
!
!
interface Fa0/0
 ip address 10.0.0.10 255.255.255.254
 description "To Berlin"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Potsdam_from_Berlin deny 10
!
!
!
router bgp 1160
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.11 remote-as 100
 neighbor 10.0.0.11 description "To Berlin"
 neighbor 10.0.0.11 advertisement-interval 0
 neighbor 10.0.0.11 soft-reconfiguration inbound
 neighbor 10.0.0.11 send-community
 neighbor 10.0.0.11 route-map RMap_Potsdam_from_Berlin in
 neighbor 10.0.0.11 route-map RMap_Potsdam_to_Berlin out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
