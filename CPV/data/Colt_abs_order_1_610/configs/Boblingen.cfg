!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Boblingen
!
!
interface Fa0/0
 ip address 10.0.0.96 255.255.255.254
 description "To Stuttgart"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Boblingen_from_Stuttgart deny 10
!
!
!
router bgp 150
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.97 remote-as 1340
 neighbor 10.0.0.97 description "To Stuttgart"
 neighbor 10.0.0.97 advertisement-interval 0
 neighbor 10.0.0.97 soft-reconfiguration inbound
 neighbor 10.0.0.97 send-community
 neighbor 10.0.0.97 route-map RMap_Boblingen_from_Stuttgart in
 neighbor 10.0.0.97 route-map RMap_Boblingen_to_Stuttgart out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
