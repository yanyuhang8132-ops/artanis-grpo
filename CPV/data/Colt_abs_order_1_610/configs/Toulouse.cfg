!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Toulouse
!
!
interface Fa0/1
 ip address 10.0.0.241 255.255.255.254
 description "To NodeID79"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.1.9 255.255.255.254
 description "To Bordeaux"
 speed auto
 duplex auto
!
!
ip community-list 1 permit 100:0 100:0 100:0
!
!
!
!
!
route-map RMap_Toulouse_from_Bordeaux deny 10
!
route-map RMap_Toulouse_from_NodeID79 permit 10
 match community 1
 set local-preference 1
 set community 100:0 additive
route-map RMap_Toulouse_from_NodeID79 deny 20
!
route-map RMap_Toulouse_to_Bordeaux permit 100
!
!
!
router bgp 1360
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.8 remote-as 170
 neighbor 10.0.1.8 description "To Bordeaux"
 neighbor 10.0.1.8 advertisement-interval 0
 neighbor 10.0.1.8 soft-reconfiguration inbound
 neighbor 10.0.1.8 send-community
 neighbor 10.0.1.8 route-map RMap_Toulouse_from_Bordeaux in
 neighbor 10.0.1.8 route-map RMap_Toulouse_to_Bordeaux out
 neighbor 10.0.0.240 remote-as 1020
 neighbor 10.0.0.240 description "To NodeID79"
 neighbor 10.0.0.240 advertisement-interval 0
 neighbor 10.0.0.240 soft-reconfiguration inbound
 neighbor 10.0.0.240 send-community
 neighbor 10.0.0.240 route-map RMap_Toulouse_from_NodeID79 in
 neighbor 10.0.0.240 route-map RMap_Toulouse_to_NodeID79 out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
