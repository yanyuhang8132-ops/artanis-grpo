!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Klagenfurt
!
!
interface Fa0/0
 ip address 10.0.1.29 255.255.255.254
 description "To Graz"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Klagenfurt_from_Graz deny 10
!
!
!
router bgp 640
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.28 remote-as 550
 neighbor 10.0.1.28 description "To Graz"
 neighbor 10.0.1.28 advertisement-interval 0
 neighbor 10.0.1.28 soft-reconfiguration inbound
 neighbor 10.0.1.28 send-community
 neighbor 10.0.1.28 route-map RMap_Klagenfurt_from_Graz in
 neighbor 10.0.1.28 route-map RMap_Klagenfurt_to_Graz out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
