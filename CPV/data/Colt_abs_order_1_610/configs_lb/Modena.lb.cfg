!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Modena
!
!
interface Fa0/1
 ip address 10.0.1.38 255.255.255.254
 description "To ReggioTTEmilia"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.1.40 255.255.255.254
 description "To Bologna"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Modena_from_Bologna deny 10
!
route-map RMap_Modena_from_ReggioTTEmilia deny 10
!
!
!
!
router bgp 880
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.41 remote-as 160
 neighbor 10.0.1.41 description "To Bologna"
 neighbor 10.0.1.41 advertisement-interval 0
 neighbor 10.0.1.41 soft-reconfiguration inbound
 neighbor 10.0.1.41 send-community
 neighbor 10.0.1.41 route-map RMap_Modena_from_Bologna in
 neighbor 10.0.1.41 route-map RMap_Modena_to_Bologna out
 neighbor 10.0.1.39 remote-as 1190
 neighbor 10.0.1.39 description "To ReggioTTEmilia"
 neighbor 10.0.1.39 advertisement-interval 0
 neighbor 10.0.1.39 soft-reconfiguration inbound
 neighbor 10.0.1.39 send-community
 neighbor 10.0.1.39 route-map RMap_Modena_from_ReggioTTEmilia in
 neighbor 10.0.1.39 route-map RMap_Modena_to_ReggioTTEmilia out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Modena
ip access-list extended ACL100
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 25000000
interface Fa0/0
 service-policy input ACL_LIMIT_100

ip access-list extended ACL101
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA101
 match access-group name ACL101
policy-map ACL_LIMIT_101
 class SLA101
  police 58000000
interface Fa0/0
 service-policy input ACL_LIMIT_101

ip access-list extended ACL102
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA102
 match access-group name ACL102
policy-map ACL_LIMIT_102
 class SLA102
  police 92000000
interface Fa0/0
 service-policy input ACL_LIMIT_102
