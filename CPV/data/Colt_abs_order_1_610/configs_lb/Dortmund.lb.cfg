!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Dortmund
!
!
interface Fa0/1
 ip address 10.0.1.83 255.255.255.254
 description "To Wuppertal"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.1.84 255.255.255.254
 description "To Essen"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Dortmund_from_Essen deny 10
!
route-map RMap_Dortmund_from_Wuppertal deny 10
!
!
!
!
router bgp 400
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.85 remote-as 460
 neighbor 10.0.1.85 description "To Essen"
 neighbor 10.0.1.85 advertisement-interval 0
 neighbor 10.0.1.85 soft-reconfiguration inbound
 neighbor 10.0.1.85 send-community
 neighbor 10.0.1.85 route-map RMap_Dortmund_from_Essen in
 neighbor 10.0.1.85 route-map RMap_Dortmund_to_Essen out
 neighbor 10.0.1.82 remote-as 1510
 neighbor 10.0.1.82 description "To Wuppertal"
 neighbor 10.0.1.82 advertisement-interval 0
 neighbor 10.0.1.82 soft-reconfiguration inbound
 neighbor 10.0.1.82 send-community
 neighbor 10.0.1.82 route-map RMap_Dortmund_from_Wuppertal in
 neighbor 10.0.1.82 route-map RMap_Dortmund_to_Wuppertal out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Dortmund
ip access-list extended ACL100
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 90000000
interface Fa0/0
 service-policy input ACL_LIMIT_100

ip access-list extended ACL101
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA101
 match access-group name ACL101
policy-map ACL_LIMIT_101
 class SLA101
  police 16000000
interface Fa0/0
 service-policy input ACL_LIMIT_101
