!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Innsbruck
!
!
interface Fa0/0
 ip address 10.0.1.33 255.255.255.254
 description "To Salzburg"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Innsbruck_from_Salzburg deny 10
!
!
!
router bgp 620
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.32 remote-as 1260
 neighbor 10.0.1.32 description "To Salzburg"
 neighbor 10.0.1.32 advertisement-interval 0
 neighbor 10.0.1.32 soft-reconfiguration inbound
 neighbor 10.0.1.32 send-community
 neighbor 10.0.1.32 route-map RMap_Innsbruck_from_Salzburg in
 neighbor 10.0.1.32 route-map RMap_Innsbruck_to_Salzburg out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
