!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Chicago
!
!
interface Fa0/0
 ip address 10.0.0.91 255.255.255.254
 description "To Boston"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Chicago_from_Boston deny 10
!
!
!
router bgp 330
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.90 remote-as 190
 neighbor 10.0.0.90 description "To Boston"
 neighbor 10.0.0.90 advertisement-interval 0
 neighbor 10.0.0.90 soft-reconfiguration inbound
 neighbor 10.0.0.90 send-community
 neighbor 10.0.0.90 route-map RMap_Chicago_from_Boston in
 neighbor 10.0.0.90 route-map RMap_Chicago_to_Boston out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
