!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Bergamo
!
!
interface Fa0/0
 ip address 10.0.1.46 255.255.255.254
 description "To Brescia"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.1.48 255.255.255.254
 description "To Milan"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Bergamo_from_Brescia deny 10
!
route-map RMap_Bergamo_from_Milan deny 10
!
!
!
!
router bgp 90
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.47 remote-as 230
 neighbor 10.0.1.47 description "To Brescia"
 neighbor 10.0.1.47 advertisement-interval 0
 neighbor 10.0.1.47 soft-reconfiguration inbound
 neighbor 10.0.1.47 send-community
 neighbor 10.0.1.47 route-map RMap_Bergamo_from_Brescia in
 neighbor 10.0.1.47 route-map RMap_Bergamo_to_Brescia out
 neighbor 10.0.1.49 remote-as 870
 neighbor 10.0.1.49 description "To Milan"
 neighbor 10.0.1.49 advertisement-interval 0
 neighbor 10.0.1.49 soft-reconfiguration inbound
 neighbor 10.0.1.49 send-community
 neighbor 10.0.1.49 route-map RMap_Bergamo_from_Milan in
 neighbor 10.0.1.49 route-map RMap_Bergamo_to_Milan out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Bergamo
