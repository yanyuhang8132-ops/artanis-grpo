!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Erding
!
!
interface Fa0/0
 ip address 10.0.0.28 255.255.255.254
 description "To Munich"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Erding_from_Munich deny 10
!
!
!
router bgp 450
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.29 remote-as 920
 neighbor 10.0.0.29 description "To Munich"
 neighbor 10.0.0.29 advertisement-interval 0
 neighbor 10.0.0.29 soft-reconfiguration inbound
 neighbor 10.0.0.29 send-community
 neighbor 10.0.0.29 route-map RMap_Erding_from_Munich in
 neighbor 10.0.0.29 route-map RMap_Erding_to_Munich out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
