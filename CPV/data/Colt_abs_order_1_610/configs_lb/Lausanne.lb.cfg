!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Lausanne
!
!
interface Fa0/0
 ip address 10.0.0.110 255.255.255.254
 description "To NodeID73"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.112 255.255.255.254
 description "To Nyon"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Lausanne_from_NodeID73 deny 10
!
route-map RMap_Lausanne_from_Nyon deny 10
!
!
!
!
router bgp 680
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.111 remote-as 1010
 neighbor 10.0.0.111 description "To NodeID73"
 neighbor 10.0.0.111 advertisement-interval 0
 neighbor 10.0.0.111 soft-reconfiguration inbound
 neighbor 10.0.0.111 send-community
 neighbor 10.0.0.111 route-map RMap_Lausanne_from_NodeID73 in
 neighbor 10.0.0.111 route-map RMap_Lausanne_to_NodeID73 out
 neighbor 10.0.0.113 remote-as 1050
 neighbor 10.0.0.113 description "To Nyon"
 neighbor 10.0.0.113 advertisement-interval 0
 neighbor 10.0.0.113 soft-reconfiguration inbound
 neighbor 10.0.0.113 send-community
 neighbor 10.0.0.113 route-map RMap_Lausanne_from_Nyon in
 neighbor 10.0.0.113 route-map RMap_Lausanne_to_Nyon out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Lausanne
ip access-list extended ACL100
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 48000000
interface Fa0/0
 service-policy input ACL_LIMIT_100

ip access-list extended ACL101
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA101
 match access-group name ACL101
policy-map ACL_LIMIT_101
 class SLA101
  police 75000000
interface Fa0/0
 service-policy input ACL_LIMIT_101
