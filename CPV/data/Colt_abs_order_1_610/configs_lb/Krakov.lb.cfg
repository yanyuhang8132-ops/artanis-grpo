!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Krakov
!
!
interface Fa0/0
 ip address 10.0.0.20 255.255.255.254
 description "To Prague"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.22 255.255.255.254
 description "To Warsaw"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Krakov_from_Prague deny 10
!
route-map RMap_Krakov_from_Warsaw deny 10
!
!
!
!
router bgp 670
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.21 remote-as 1170
 neighbor 10.0.0.21 description "To Prague"
 neighbor 10.0.0.21 advertisement-interval 0
 neighbor 10.0.0.21 soft-reconfiguration inbound
 neighbor 10.0.0.21 send-community
 neighbor 10.0.0.21 route-map RMap_Krakov_from_Prague in
 neighbor 10.0.0.21 route-map RMap_Krakov_to_Prague out
 neighbor 10.0.0.23 remote-as 1490
 neighbor 10.0.0.23 description "To Warsaw"
 neighbor 10.0.0.23 advertisement-interval 0
 neighbor 10.0.0.23 soft-reconfiguration inbound
 neighbor 10.0.0.23 send-community
 neighbor 10.0.0.23 route-map RMap_Krakov_from_Warsaw in
 neighbor 10.0.0.23 route-map RMap_Krakov_to_Warsaw out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Krakov
ip access-list extended ACL100
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 29000000
interface Fa0/0
 service-policy input ACL_LIMIT_100

ip access-list extended ACL101
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA101
 match access-group name ACL101
policy-map ACL_LIMIT_101
 class SLA101
  police 74000000
interface Fa0/0
 service-policy input ACL_LIMIT_101

ip access-list extended ACL102
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA102
 match access-group name ACL102
policy-map ACL_LIMIT_102
 class SLA102
  police 72000000
interface Fa0/0
 service-policy input ACL_LIMIT_102
