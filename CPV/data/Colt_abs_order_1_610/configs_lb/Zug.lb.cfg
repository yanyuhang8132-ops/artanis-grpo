!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Zug
!
!
interface Fa0/0
 ip address 10.0.0.187 255.255.255.254
 description "To Lucerne"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.221 255.255.255.254
 description "To Zurich"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Zug_from_Lucerne deny 10
!
route-map RMap_Zug_from_Zurich deny 10
!
!
!
!
router bgp 1520
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.186 remote-as 770
 neighbor 10.0.0.186 description "To Lucerne"
 neighbor 10.0.0.186 advertisement-interval 0
 neighbor 10.0.0.186 soft-reconfiguration inbound
 neighbor 10.0.0.186 send-community
 neighbor 10.0.0.186 route-map RMap_Zug_from_Lucerne in
 neighbor 10.0.0.186 route-map RMap_Zug_to_Lucerne out
 neighbor 10.0.0.220 remote-as 1530
 neighbor 10.0.0.220 description "To Zurich"
 neighbor 10.0.0.220 advertisement-interval 0
 neighbor 10.0.0.220 soft-reconfiguration inbound
 neighbor 10.0.0.220 send-community
 neighbor 10.0.0.220 route-map RMap_Zug_from_Zurich in
 neighbor 10.0.0.220 route-map RMap_Zug_to_Zurich out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

