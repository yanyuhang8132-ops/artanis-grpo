!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Brescia
!
!
interface Fa0/0
 ip address 10.0.1.47 255.255.255.254
 description "To Bergamo"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.1.53 255.255.255.254
 description "To Verona"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Brescia_from_Bergamo deny 10
!
route-map RMap_Brescia_from_Verona deny 10
!
!
!
!
router bgp 230
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.46 remote-as 90
 neighbor 10.0.1.46 description "To Bergamo"
 neighbor 10.0.1.46 advertisement-interval 0
 neighbor 10.0.1.46 soft-reconfiguration inbound
 neighbor 10.0.1.46 send-community
 neighbor 10.0.1.46 route-map RMap_Brescia_from_Bergamo in
 neighbor 10.0.1.46 route-map RMap_Brescia_to_Bergamo out
 neighbor 10.0.1.52 remote-as 1460
 neighbor 10.0.1.52 description "To Verona"
 neighbor 10.0.1.52 advertisement-interval 0
 neighbor 10.0.1.52 soft-reconfiguration inbound
 neighbor 10.0.1.52 send-community
 neighbor 10.0.1.52 route-map RMap_Brescia_from_Verona in
 neighbor 10.0.1.52 route-map RMap_Brescia_to_Verona out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

! ACL Configuration for Brescia
ip access-list extended ACL100
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA100
 match access-group name ACL100
policy-map ACL_LIMIT_100
 class SLA100
  police 10000000
interface Fa0/0
 service-policy input ACL_LIMIT_100

ip access-list extended ACL101
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA101
 match access-group name ACL101
policy-map ACL_LIMIT_101
 class SLA101
  police 16000000
interface Fa0/0
 service-policy input ACL_LIMIT_101

ip access-list extended ACL102
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA102
 match access-group name ACL102
policy-map ACL_LIMIT_102
 class SLA102
  police 96000000
interface Fa0/0
 service-policy input ACL_LIMIT_102

ip access-list extended ACL103
 permit ip host 11.0.0.1 host 100.0.0.1
class-map match-any SLA103
 match access-group name ACL103
policy-map ACL_LIMIT_103
 class SLA103
  police 64000000
interface Fa0/0
 service-policy input ACL_LIMIT_103
