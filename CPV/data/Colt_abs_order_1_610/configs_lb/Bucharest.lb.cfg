!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Bucharest
!
!
interface Fa0/0
 ip address 10.0.1.35 255.255.255.254
 description "To Budapest"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Bucharest_from_Budapest deny 10
!
!
!
router bgp 270
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.34 remote-as 280
 neighbor 10.0.1.34 description "To Budapest"
 neighbor 10.0.1.34 advertisement-interval 0
 neighbor 10.0.1.34 soft-reconfiguration inbound
 neighbor 10.0.1.34 send-community
 neighbor 10.0.1.34 route-map RMap_Bucharest_from_Budapest in
 neighbor 10.0.1.34 route-map RMap_Bucharest_to_Budapest out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
