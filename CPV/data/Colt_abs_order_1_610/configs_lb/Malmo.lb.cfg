!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Malmo
!
!
interface Fa0/0
 ip address 10.0.0.147 255.255.255.254
 description "To Copenhagen"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Malmo_from_Copenhagen deny 10
!
!
!
router bgp 830
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.146 remote-as 360
 neighbor 10.0.0.146 description "To Copenhagen"
 neighbor 10.0.0.146 advertisement-interval 0
 neighbor 10.0.0.146 soft-reconfiguration inbound
 neighbor 10.0.0.146 send-community
 neighbor 10.0.0.146 route-map RMap_Malmo_from_Copenhagen in
 neighbor 10.0.0.146 route-map RMap_Malmo_to_Copenhagen out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
