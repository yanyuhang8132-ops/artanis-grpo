!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Leipzig
!
!
interface Fa0/1
 ip address 10.0.0.12 255.255.255.254
 description "To Nuremberg"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.14 255.255.255.254
 description "To Dresden"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Leipzig_from_Dresden deny 10
!
route-map RMap_Leipzig_from_Nuremberg deny 10
!
!
!
!
router bgp 690
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.15 remote-as 410
 neighbor 10.0.0.15 description "To Dresden"
 neighbor 10.0.0.15 advertisement-interval 0
 neighbor 10.0.0.15 soft-reconfiguration inbound
 neighbor 10.0.0.15 send-community
 neighbor 10.0.0.15 route-map RMap_Leipzig_from_Dresden in
 neighbor 10.0.0.15 route-map RMap_Leipzig_to_Dresden out
 neighbor 10.0.0.13 remote-as 1040
 neighbor 10.0.0.13 description "To Nuremberg"
 neighbor 10.0.0.13 advertisement-interval 0
 neighbor 10.0.0.13 soft-reconfiguration inbound
 neighbor 10.0.0.13 send-community
 neighbor 10.0.0.13 route-map RMap_Leipzig_from_Nuremberg in
 neighbor 10.0.0.13 route-map RMap_Leipzig_to_Nuremberg out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end

