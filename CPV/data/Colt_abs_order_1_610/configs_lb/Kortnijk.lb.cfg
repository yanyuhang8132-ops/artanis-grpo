!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Kortnijk
!
!
interface Fa0/0
 ip address 10.0.1.60 255.255.255.254
 description "To Brussels"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Kortnijk_from_Brussels deny 10
!
!
!
router bgp 660
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.1.61 remote-as 260
 neighbor 10.0.1.61 description "To Brussels"
 neighbor 10.0.1.61 advertisement-interval 0
 neighbor 10.0.1.61 soft-reconfiguration inbound
 neighbor 10.0.1.61 send-community
 neighbor 10.0.1.61 route-map RMap_Kortnijk_from_Brussels in
 neighbor 10.0.1.61 route-map RMap_Kortnijk_to_Brussels out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
