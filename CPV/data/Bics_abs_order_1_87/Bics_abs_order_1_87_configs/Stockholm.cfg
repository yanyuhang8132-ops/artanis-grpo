!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Stockholm
!
!
interface Fa0/0
 ip address 10.0.0.75 255.255.255.254
 description "To Frankfurt"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Stockholm_from_Frankfurt deny 10
!
!
!
router bgp 270
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.74 remote-as 100
 neighbor 10.0.0.74 description "To Frankfurt"
 neighbor 10.0.0.74 advertisement-interval 0
 neighbor 10.0.0.74 soft-reconfiguration inbound
 neighbor 10.0.0.74 send-community
 neighbor 10.0.0.74 route-map RMap_Stockholm_from_Frankfurt in
 neighbor 10.0.0.74 route-map RMap_Stockholm_to_Frankfurt out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
