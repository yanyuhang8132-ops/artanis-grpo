!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Madrid
!
!
interface Fa0/1
 ip address 10.0.0.89 255.255.255.254
 description "To Paris"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.92 255.255.255.254
 description "To Barcelona"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Madrid_from_Barcelona deny 10
!
route-map RMap_Madrid_from_Paris deny 10
!
!
!
!
router bgp 190
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.93 remote-as 30
 neighbor 10.0.0.93 description "To Barcelona"
 neighbor 10.0.0.93 advertisement-interval 0
 neighbor 10.0.0.93 soft-reconfiguration inbound
 neighbor 10.0.0.93 send-community
 neighbor 10.0.0.93 route-map RMap_Madrid_from_Barcelona in
 neighbor 10.0.0.93 route-map RMap_Madrid_to_Barcelona out
 neighbor 10.0.0.88 remote-as 220
 neighbor 10.0.0.88 description "To Paris"
 neighbor 10.0.0.88 advertisement-interval 0
 neighbor 10.0.0.88 soft-reconfiguration inbound
 neighbor 10.0.0.88 send-community
 neighbor 10.0.0.88 route-map RMap_Madrid_from_Paris in
 neighbor 10.0.0.88 route-map RMap_Madrid_to_Paris out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
