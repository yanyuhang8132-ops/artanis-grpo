!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Luxembourg
!
!
interface Fa0/1
 ip address 10.0.0.43 255.255.255.254
 description "To Strasbourg"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.44 255.255.255.254
 description "To Brussels"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Luxembourg_from_Brussels deny 10
!
route-map RMap_Luxembourg_from_Strasbourg deny 10
!
!
!
!
router bgp 170
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.45 remote-as 60
 neighbor 10.0.0.45 description "To Brussels"
 neighbor 10.0.0.45 advertisement-interval 0
 neighbor 10.0.0.45 soft-reconfiguration inbound
 neighbor 10.0.0.45 send-community
 neighbor 10.0.0.45 route-map RMap_Luxembourg_from_Brussels in
 neighbor 10.0.0.45 route-map RMap_Luxembourg_to_Brussels out
 neighbor 10.0.0.42 remote-as 280
 neighbor 10.0.0.42 description "To Strasbourg"
 neighbor 10.0.0.42 advertisement-interval 0
 neighbor 10.0.0.42 soft-reconfiguration inbound
 neighbor 10.0.0.42 send-community
 neighbor 10.0.0.42 route-map RMap_Luxembourg_from_Strasbourg in
 neighbor 10.0.0.42 route-map RMap_Luxembourg_to_Strasbourg out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
