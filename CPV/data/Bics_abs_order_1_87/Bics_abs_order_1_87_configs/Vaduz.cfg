!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Vaduz
!
!
interface Fa0/0
 ip address 10.0.0.36 255.255.255.254
 description "To Zurich"
 speed auto
 duplex auto
!
!
!
!
!
route-map RMap_Vaduz_from_Zurich deny 10
!
!
!
router bgp 290
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.37 remote-as 330
 neighbor 10.0.0.37 description "To Zurich"
 neighbor 10.0.0.37 advertisement-interval 0
 neighbor 10.0.0.37 soft-reconfiguration inbound
 neighbor 10.0.0.37 send-community
 neighbor 10.0.0.37 route-map RMap_Vaduz_from_Zurich in
 neighbor 10.0.0.37 route-map RMap_Vaduz_to_Zurich out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
