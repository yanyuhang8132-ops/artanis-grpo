!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Lyon
!
!
interface Fa0/0
 ip address 10.0.0.65 255.255.255.254
 description "To Geneva"
 speed auto
 duplex auto
!
interface Fa1/0
 ip address 10.0.0.87 255.255.255.254
 description "To Paris"
 speed auto
 duplex auto
!
interface Fa0/1
 ip address 10.0.0.97 255.255.255.254
 description "To Marseille"
 speed auto
 duplex auto
!
!
ip community-list 1 permit 100:0 100:0 100:0
!
ip community-list 2 permit 100:0 100:0 100:0
!
!
!
!
route-map RMap_Lyon_from_Geneva permit 10
 match community 1
 set local-preference 1
 set community 100:0 additive
route-map RMap_Lyon_from_Geneva deny 20
!
route-map RMap_Lyon_from_Marseille deny 10
!
route-map RMap_Lyon_from_Paris permit 10
 match community 2
 set local-preference 1
 set community 100:0 additive
route-map RMap_Lyon_from_Paris deny 20
!
!
route-map RMap_Lyon_to_Marseille permit 100
!
route-map RMap_Lyon_to_Paris permit 100
!
!
router bgp 180
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.64 remote-as 110
 neighbor 10.0.0.64 description "To Geneva"
 neighbor 10.0.0.64 advertisement-interval 0
 neighbor 10.0.0.64 soft-reconfiguration inbound
 neighbor 10.0.0.64 send-community
 neighbor 10.0.0.64 route-map RMap_Lyon_from_Geneva in
 neighbor 10.0.0.64 route-map RMap_Lyon_to_Geneva out
 neighbor 10.0.0.96 remote-as 200
 neighbor 10.0.0.96 description "To Marseille"
 neighbor 10.0.0.96 advertisement-interval 0
 neighbor 10.0.0.96 soft-reconfiguration inbound
 neighbor 10.0.0.96 send-community
 neighbor 10.0.0.96 route-map RMap_Lyon_from_Marseille in
 neighbor 10.0.0.96 route-map RMap_Lyon_to_Marseille out
 neighbor 10.0.0.86 remote-as 220
 neighbor 10.0.0.86 description "To Paris"
 neighbor 10.0.0.86 advertisement-interval 0
 neighbor 10.0.0.86 soft-reconfiguration inbound
 neighbor 10.0.0.86 send-community
 neighbor 10.0.0.86 route-map RMap_Lyon_from_Paris in
 neighbor 10.0.0.86 route-map RMap_Lyon_to_Paris out
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
