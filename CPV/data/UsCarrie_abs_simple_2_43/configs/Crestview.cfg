!
version 15.2
!
service timestamps debug datetime msec
!
service timestamps log datetime msec
!
boot-start-marker
!
boot-end-marker
!
no aaa new-model
!
ip cef
!
no ipv6 cef
!
multilink bundle-name authenticated
!
ip forward-protocol nd
!
no ip http server
!
no ip http secure-server
!
ip bgp-community new-format
!
hostname Crestview
!
!
interface Fa0/1
 ip address 10.0.0.174 255.255.255.254
 description "To Pensacola"
 speed auto
 duplex auto
!
interface Fa0/0
 ip address 10.0.0.176 255.255.255.254
 description "To PanamaTTCity"
 speed auto
 duplex auto
!
!
!
!
ip prefix-list IpL_Crestview_PanamaTTCity seq 10 permit 128.0.1.0/24
!
!
route-map RMap_Crestview_from_PanamaTTCity deny 10
 match ip address prefix-list IpL_Crestview_PanamaTTCity
 set local-preference 1
 set community 100:0 additive
route-map RMap_Crestview_from_PanamaTTCity deny 100
!
!
router bgp 490
 no synchronization
 bgp log-neighbor-changes
 neighbor 10.0.0.177 remote-as 1220
 neighbor 10.0.0.177 description "To PanamaTTCity"
 neighbor 10.0.0.177 advertisement-interval 0
 neighbor 10.0.0.177 soft-reconfiguration inbound
 neighbor 10.0.0.177 send-community
 neighbor 10.0.0.177 route-map RMap_Crestview_from_PanamaTTCity in
 neighbor 10.0.0.175 remote-as 1240
 neighbor 10.0.0.175 description "To Pensacola"
 neighbor 10.0.0.175 advertisement-interval 0
 neighbor 10.0.0.175 soft-reconfiguration inbound
 neighbor 10.0.0.175 send-community
!
!
!
!
!
!
!
!
!
!
!
control-plane
!
!
line con 0
 stopbits 1
line aux 0
 stopbits 1
line vty 0 4
 login
!
end
