hostname LB1
!
interface GigabitEthernet0/0
 description Link to R1
 ip address 11.0.0.3 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description Link to R2
 ip address 11.0.0.4 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description Uplink to Internet
 ip address 100.0.0.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/3
 description Link to ACL1
 ip address 100.0.1.1 255.255.255.0
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 100.0.0.254
!
ip access-list extended FLOW_MATCH
 permit ip host 11.0.0.2 host 100.0.0.2
!
ip access-list extended DEFAULT_FLOW
 permit ip any 100.0.0.0 0.0.0.255
!
route-map FLOW_POLICY permit 10
 match ip address FLOW_MATCH
 set interface GigabitEthernet0/2
 set ip next-hop 100.0.0.254
!
route-map FLOW_POLICY permit 11
 match ip address FLOW_MATCH
 set interface GigabitEthernet0/2
 set ip next-hop 100.0.0.254
!
route-map FLOW_POLICY permit 12
 match ip address FLOW_MATCH
 set interface GigabitEthernet0/2
 set ip next-hop 100.0.0.254
!
route-map FLOW_POLICY permit 13
 match ip address FLOW_MATCH
 set interface GigabitEthernet0/3
 set ip next-hop 100.0.1.2
!
route-map FLOW_POLICY permit 30
 match ip address DEFAULT_FLOW
 set interface GigabitEthernet0/2
 set ip next-hop 100.0.0.254
!
interface GigabitEthernet0/0
 ip policy route-map FLOW_POLICY
!
interface GigabitEthernet0/1
 ip policy route-map FLOW_POLICY
!