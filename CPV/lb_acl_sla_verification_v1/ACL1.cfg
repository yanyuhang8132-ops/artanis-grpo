hostname ACL1
!
interface GigabitEthernet0/0
 description From LB1
 ip address 100.0.1.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description To Internet
 ip address 100.0.1.254 255.255.255.0
 no shutdown
!
ip access-list extended ACL1_MATCH
 permit ip host 11.0.0.2 any
!
class-map match-all FLOW2_CLASS
 match access-group name ACL1_MATCH
!
policy-map ACL1_POLICY
 class FLOW2_CLASS
  police 30000000000
  conform-action transmit
  exceed-action drop
!
interface GigabitEthernet0/0
 service-policy output ACL1_POLICY
!